<title>The flood and the wall</title>
<style>
  html, body { margin: 0; background: #193C3F; }
  body { display: flex; justify-content: center; align-items: flex-start; }

<body>
<div class="sheet">
<div style="width: 1600px; height: 900px; box-sizing: border-box; background: #193C3F; color: #F4F0E9; display: flex; flex-direction: column;">
  <div style="padding: 40px 72px 0 72px;">
    <div style="font-size: 12px; letter-spacing: 3.4px; color: #C6A553;">THE METHOD, NOT THE DATA</div>
    <h1 style="margin: 12px 0 0 0; font-size: 46px; font-weight: normal; color: #F4F0E9;">The flood and the wall</h1>
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 40px; margin-top: 12px;">
      <p style="margin: 0; font-size: 18px; line-height: 1.45; color: #9FB4B0; max-width: 940px;">Sort the work by what the machine still cannot do, then raise the water. What it covers still gets done. It stops getting paid for.</p>
      <span style="font-size: 13px; color: #9FB4B0; white-space: nowrap;">under water 4 of 12 &#183; at the line 1 &#183; polder 2 &#183; dry 5</span>
    </div>
  </div>
  <div style="margin-top: 4px;">
    <svg viewBox="0 0 1600 740" width="1600" height="740" role="img" aria-label="Twelve generic tasks drawn as columns whose height is what the machine still cannot do, with a waterline rising across them, two diked polders standing dry, an outside read marked in gold, and a wall of seven bricks to the right, four bound to us and three generic or rented." font-family="Georgia, serif"><rect x="80.0" y="456.0" width="68.8" height="44.0" fill="#2C5558"/><rect x="162.8" y="429.6" width="68.8" height="70.4" fill="#2C5558"/><rect x="245.6" y="403.2" width="68.8" height="96.8" fill="#2C5558"/><rect x="328.4" y="376.8" width="68.8" height="123.2" fill="#2C5558"/><rect x="411.2" y="350.4" width="68.8" height="149.6" fill="#2C5558"/><rect x="494.0" y="315.2" width="68.8" height="184.8" fill="#2C5558"/><rect x="576.8" y="280.0" width="68.8" height="220.0" fill="#2C5558"/><rect x="659.6" y="244.8" width="68.8" height="255.2" fill="#2C5558"/><rect x="742.4" y="200.8" width="68.8" height="299.2" fill="#2C5558"/><rect x="825.2" y="156.8" width="68.8" height="343.2" fill="#2C5558"/><rect x="908.0" y="121.6" width="68.8" height="378.4" fill="#2C5558"/><rect x="990.8" y="82.0" width="68.8" height="418.0" fill="#2C5558"/><rect x="70.0" y="332.8" width="999.6" height="167.2" fill="#67A5AB" opacity=".42"/><rect x="411.2" y="350.4" width="68.8" height="149.6" fill="#2C5558"/><rect x="411.2" y="345.4" width="68.8" height="4" fill="#BE7B4F"/><rect x="407.2" y="323.8" width="4" height="176.2" fill="#BE7B4F"/><rect x="480.0" y="323.8" width="4" height="176.2" fill="#BE7B4F"/><rect x="659.6" y="244.8" width="68.8" height="255.2" fill="#2C5558"/><rect x="659.6" y="239.8" width="68.8" height="4" fill="#BE7B4F"/><rect x="655.6" y="235.8" width="4" height="264.2" fill="#BE7B4F"/><rect x="728.4" y="235.8" width="4" height="264.2" fill="#BE7B4F"/><line x1="70.0" x2="1069.6" y1="227.2" y2="227.2" stroke="#67A5AB" stroke-width="1.5" stroke-dasharray="7 6" opacity=".8"/><text x="92.0" y="218.2" fill="#67A5AB" font-size="11" letter-spacing="1.8">WHERE THE TIDE IS HEADED &#183; THREE YEARS</text><line x1="70.0" x2="1069.6" y1="332.8" y2="332.8" stroke="#67A5AB" stroke-width="2.5"/><text x="92.0" y="323.8" fill="#F4F0E9" font-size="11.5" letter-spacing="1.8">WATERLINE &#183; TODAY</text><line x1="242.6" x2="317.4" y1="438.4" y2="438.4" stroke="#C6A553" stroke-width="2.5" stroke-dasharray="4 3"/><line x1="280.0" x2="280.0" y1="403.2" y2="438.4" stroke="#C6A553" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/><line x1="491.0" x2="565.8" y1="368.0" y2="368.0" stroke="#C6A553" stroke-width="2.5" stroke-dasharray="4 3"/><line x1="528.4" x2="528.4" y1="315.2" y2="368.0" stroke="#C6A553" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/><line x1="822.2" x2="897.0" y1="258.0" y2="258.0" stroke="#C6A553" stroke-width="2.5" stroke-dasharray="4 3"/><line x1="859.6" x2="859.6" y1="156.8" y2="258.0" stroke="#C6A553" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/><polygon points="528.4,299.2 522.4,308.2 534.4,308.2" fill="#BE7B4F"/><rect x="492.0" y="313.2" width="72.8" height="186.8" fill="none" stroke="#BE7B4F" stroke-width="1.5" stroke-dasharray="5 4"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C6A553"/></marker></defs><path d="M 362.8,368.8 C 480,246 830,96 1124,74" fill="none" stroke="#C6A553" stroke-width="2.5" marker-end="url(#ah)"/><text x="362.8" y="354.8" fill="#C6A553" font-size="17" text-anchor="middle">the cost falls here</text><text x="1120" y="46" fill="#C6A553" font-size="17" text-anchor="end">the price is decided there</text><text x="80.0" y="44" fill="#9FB4B0" font-size="11" letter-spacing="2.2">YOUR WORK, SORTED BY REACH &#8594;</text><text transform="translate(30,280.0) rotate(-90)" fill="#6E8A86" font-size="10.5" letter-spacing="2" text-anchor="middle">&#8593; WHAT THE MACHINE STILL CANNOT DO</text><text transform="translate(114.4,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">Scheduling and</tspan><tspan x="0" dy="14">reminders</tspan></text><text transform="translate(197.2,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">Drafting a standard</tspan><tspan x="0" dy="14">document</tspan></text><text transform="translate(280.0,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">First-pass data</tspan><tspan x="0" dy="14">extraction</tspan></text><text transform="translate(362.8,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">Summarising a</tspan><tspan x="0" dy="14">long record</tspan></text><text transform="translate(445.6,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">Answering a</tspan><tspan x="0" dy="14">known question</tspan></text><text transform="translate(528.4,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">Reconciling two</tspan><tspan x="0" dy="14">systems</tspan></text><text transform="translate(611.2,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">Screening the</tspan><tspan x="0" dy="14">exceptions</tspan></text><text transform="translate(694.0,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">First draft of a</tspan><tspan x="0" dy="14">recommendation</tspan></text><text transform="translate(776.8,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">Judging an</tspan><tspan x="0" dy="14">unusual case</tspan></text><text transform="translate(859.6,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">Setting this year's</tspan><tspan x="0" dy="14">priorities</tspan></text><text transform="translate(942.4,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">Negotiating the</tspan><tspan x="0" dy="14">contract</tspan></text><text transform="translate(1025.2,512) rotate(-58)" fill="#C7D6D2" font-size="13" text-anchor="end"><tspan x="0" dy="0">The difficult</tspan><tspan x="0" dy="14">conversation</tspan></text><rect x="1130.0" y="60.0" width="410.0" height="500.0" fill="#1C4548" stroke="#3A6468" stroke-width="1"/><text x="1160.0" y="106.0" fill="#C6A553" font-size="14" letter-spacing="3.4">THE WALL</text><text x="1160.0" y="132.0" fill="#9FB4B0" font-size="15" font-style="italic">what the water cannot take</text><rect x="1160.0" y="161.0" width="26" height="19" fill="#C6A553"/><text x="1200.0" y="176.0" fill="#F4F0E9" font-size="15">The record only we hold</text><rect x="1160.0" y="207.0" width="26" height="19" fill="#C6A553"/><text x="1200.0" y="222.0" fill="#F4F0E9" font-size="15">The relationship, twenty years old</text><rect x="1160.0" y="253.0" width="26" height="19" fill="#C6A553"/><text x="1200.0" y="268.0" fill="#F4F0E9" font-size="15">The signature that answers for the act</text><rect x="1160.0" y="299.0" width="26" height="19" fill="#C6A553"/><text x="1200.0" y="314.0" fill="#F4F0E9" font-size="15">The route to the customer we own</text><line x1="1160.0" x2="1510.0" y1="333.0" y2="333.0" stroke="#2C5558" stroke-width="1"/><rect x="1160.0" y="345.0" width="26" height="19" fill="none" stroke="#6E8A86" stroke-width="1.5" stroke-dasharray="3 3"/><text x="1200.0" y="360.0" fill="#8FA6A3" font-size="15">The model everyone rents</text><rect x="1160.0" y="391.0" width="26" height="19" fill="none" stroke="#6E8A86" stroke-width="1.5" stroke-dasharray="3 3"/><text x="1200.0" y="406.0" fill="#8FA6A3" font-size="15">The workflow tool any vendor ships</text><rect x="1160.0" y="437.0" width="26" height="19" fill="none" stroke="#6E8A86" stroke-width="1.5" stroke-dasharray="3 3"/><text x="1200.0" y="452.0" fill="#8FA6A3" font-size="15">The data we license from outside</text><text x="1160.0" y="514.0" fill="#9FB4B0" font-size="12.5">filled: bound to us</text><text x="1160.0" y="536.0" fill="#9FB4B0" font-size="12.5">hollow: generic, or rented</text><line x1="80" x2="1540" y1="648" y2="648" stroke="#2C5558" stroke-width="1"/><rect x="80.0" y="682" width="13" height="26" fill="#2C5558"/><text x="118.0" y="694" fill="#F4F0E9" font-size="14">Height: what the machine still cannot do.</text><text x="118.0" y="714" fill="#9FB4B0" font-size="12.5">The room&#8217;s own reading, task by task.</text><line x1="372.0" x2="394.0" y1="690" y2="690" stroke="#67A5AB" stroke-width="2.5"/><line x1="372.0" x2="394.0" y1="702" y2="702" stroke="#67A5AB" stroke-width="1.5" stroke-dasharray="6 5"/><text x="410.0" y="694" fill="#F4F0E9" font-size="14">The water: today. Dashed: three years out.</text><text x="410.0" y="714" fill="#9FB4B0" font-size="12.5">Raise it slowly, and read the count aloud.</text><rect x="669.0" y="682" width="13" height="26" fill="#2C5558"/><rect x="669.0" y="678" width="13" height="4" fill="#BE7B4F"/><rect x="665.0" y="678" width="4" height="30" fill="#BE7B4F"/><rect x="682.0" y="678" width="4" height="30" fill="#BE7B4F"/><text x="702.0" y="694" fill="#F4F0E9" font-size="14">A polder: the room keeps this one human.</text><text x="702.0" y="714" fill="#9FB4B0" font-size="12.5">A choice, not a forecast.</text><line x1="956.0" x2="978.0" y1="694" y2="694" stroke="#C6A553" stroke-width="2.5" stroke-dasharray="4 3"/><text x="994.0" y="694" fill="#F4F0E9" font-size="14">The outside read.</text><text x="994.0" y="714" fill="#9FB4B0" font-size="12.5">A reading, not a verdict.</text><polygon points="1259.0,682 1251.0,700 1267.0,700" fill="#BE7B4F"/><text x="1286.0" y="694" fill="#F4F0E9" font-size="14">The room overrules the read.</text><text x="1286.0" y="714" fill="#9FB4B0" font-size="12.5">Out loud, and with a reason.</text></svg>
  </div>
</div>
