ssengers per movement lowers the charge per movement.", "tier": 2, "breaks_if": "The differentials are recalibrated at each tariff reset, which the 2025-2027 decision provides for. This is a within-period drag, not a permanent one."}, {"factor": "Passengers -> commercial revenue", "strength": "decoupled", "obs": "Concession revenue fell 11.5% in FY2025 (EUR 287.2m to EUR 254.0m) while AMS passengers rose 3.0%, and fell about 10% again in H1 2026.", "tier": 1, "breaks_if": "Nothing: the cause is structural, not demand. Kappe was deconsolidated on 1 May 2025 and retail moved into a Lagardere joint venture, so the earnings surface below the operating line. The natural hedge against a capped aviation business has been converted into associate income."}, {"factor": "Revenue -> EBITDA (operating leverage)", "strength": "negative", "obs": "H1 2026 revenue +5.6%, underlying EBITDA +1.7%. Average FTE rose from 2,833 in 2023 to 3,831 in 2025, +35%, against group passengers +10%.", "tier": 1, "breaks_if": "The FTE build is programme-related and reverses on completion. Nothing in the record says it will."}], "external": [{"factor": "The movement cap", "strength": "binding in 2025, not binding in 2026", "obs": "FY2025 movements were 99.91% of the 478,000 ceiling. H1 2026 movements fell 4%, opening roughly 19,000 of headroom on an annualised basis.", "tier": 2, "breaks_if": "It already has. A model that treats the cap as the constraint is right in one year and wrong in the next, and the switch is driven by fuel and geopolitics rather than policy."}, {"factor": "Legal standing of the cap", "strength": "two-sided", "obs": "The Raad van State annulled the Luchthavenverkeerbesluit on 11 March 2026: a flight number is not a noise norm, and the minister had not tied it to the enforcement points. The 2008 LVB revives; the Ministry maintains 478,000 administratively and is drafting a replacement for November 2026.", "tier": 2, "breaks_if": "The replacement can be tighter or looser. The court struck the decree for being under-justified, not for being too tight, so the direction is genuinely unknown."}, {"factor": "Nature permit (nitrogen)", "strength": "the constraint with a zero in it", "obs": "The permit was annulled by the District Court of The Hague. A non-enforcement order of 19 December 2025 runs 24 months; environmental organisations objected on 22 January 2026. AR2025 discusses this under going concern.", "tier": 1, "breaks_if": "It is not a volume trim. A cap reduces movements; a permit failure stops them."}, {"factor": "Fuel and geopolitics", "strength": "dominant in 2026", "obs": "Management attributes the H1 2026 movement decline to severe winter weather and to the Middle East conflict roughly doubling jet fuel prices.", "tier": 2, "breaks_if": "Nothing structural. It is the reason the cap stopped binding, which is the point."}, {"factor": "Airline competitive response", "strength": "revealed, not asserted", "obs": "KLM stated the increase would make Schiphol the second most expensive airport in Europe. Schiphol then withdrew the 2026 increase and discounted daytime charges by more than 10%. The airport priced the objection at EUR 37m in one half-year.", "tier": 2, "breaks_if": "Nothing. This is the ceiling being located empirically."}, {"factor": "Allowed return vs realised return", "strength": "open question, not a finding", "obs": "The regulated WACC is 5.36% post tax for 2025-2027 (ACM decision p.49, pair-verified). Group ROCE was 9.9% in FY2025 against 5.9% in FY2024.", "tier": 1, "breaks_if": "The two are not comparable and this read does not treat them as such. ROCE is group-wide, includes the unregulated Commercial and international businesses, and is struck on capital employed rather than on the RAB. CF-24 records the prior question: the statute may make 5.36% a ceiling on a projected return rather than an allowed return. Scoring the economic-value axis against the wrong denominator is worse than not scoring it."}]}, "predictions": [{"track": "A", "pred": "AMS passengers per movement >= 146 for FY2026", "fals": "< 144.1, i.e. below the FY2025 base", "now": "146.2 at H1", "status": "on_thesis"}, {"track": "A", "pred": "Pier A opens in 2027 as stated", "fals": "slips past 2027 or is descoped", "now": "no contrary evidence", "status": "early"}, {"track": "A", "pred": "AMS movements >= 470,000 in FY2027", "fals": "< 450,000", "now": "~447,000 annualised from H1 2026", "status": "drifting"}, {"track": "A", "pred": "Group 90m passengers by 2050, the airport's own target", "fals": "an instrument that forecloses it arithmetically", "now": "needs 168.5 per movement at today's 534,021 movements, +15% on 146.3, or about 0.6% a year of gauge for 24 years", "status": "watch"}, {"track": "B", "pred": "AMS aviation charge <= EUR 26 per passenger through 2027", "fals": "a mid-period uplift above EUR 28", "now": "EUR 25.85 FY2025, falling in 2026 on the discount", "status": "on_thesis"}, {"track": "B", "pred": "Group underlying EBITDA margin >= 40% in FY2026", "fals": "< 37% full year", "now": "36.3% at H1 against 40.6% FY2025", "status": "drifting", "note": "H2 is the stronger half at this airport, so a half-year miss is not yet a full-year breach"}, {"track": "B", "pred": "Cash flow after capex turns positive by FY2027", "fals": "two further years below -EUR 300m", "now": "-EUR 22m FY2025, -EUR 464m at H1 2026", "status": "drifting"}, {"track": "B", "pred": "Nature permit restored or replaced before the non-enforcement order expires", "fals": "expiry around December 2027 without a permit", "now": "objection lodged 22 January 2026", "status": "watch"}, {"track": "B", "pred": "A replacement movement instrument in force by the Ministry's November 2026 date", "fals": "no instrument in force by 31 March 2027", "now": "annulled 11 March 2026, drafting", "status": "watch"}], "contradictions": [{"sev": "high", "kind": "reinforcing loop", "text": "Capex raises the RAB, the RAB raises allowed revenue, allowed revenue raises the tariff, the tariff draws airline resistance, resistance produces a voluntary discount, the discount produces a settlement deficit, and the deficit returns as a larger tariff in the next period, on the same capped passenger base.", "prov": "Wet luchtvaart settlement mechanism, AR2025 note 5.1 p.179 (Tier 1) - observed discount, RSG H1 2026 (Tier 2)"}, {"sev": "high", "kind": "counter-acting levers", "text": "The noise-differentiated tariff rewards the fleet renewal that lifts passengers per movement. The volume escape from the cap and the environmental mandate are the same mechanism, and both cut the charge per movement. The airport's only route out of the cap runs through its own yield.", "prov": "RSG H1 2026 quiet-category mix (Tier 2) - ACM tariff decision structure (Tier 1)"}, {"sev": "medium", "kind": "decoupling", "text": "Commercial revenue no longer tracks passengers. The retail estate moved into joint ventures during 2025, so the hedge against a capped aviation business now appears as associate income below the operating line rather than as revenue beside it.", "prov": "AR2025 note 4 pp.174-175 and note 5 p.179 (Tier 1)"}, {"sev": "medium", "kind": "frame inversion", "text": "The cap bound in FY2025 at 99.91% of the ceiling and did not bind in H1 2026, when movements fell 4%. Any model that carries the cap as THE constraint will be correct in one year and wrong in the next, and the switch is exogenous.", "prov": "RSG traffic figures (Tier 2)"}, {"sev": "watch", "kind": "structural_threat", "text": "The nature permit, not the movement cap, is the constraint that contains a zero. It sits inside the going-concern discussion of the FY2025 statements, and the non-enforcement order that holds it open expires around December 2027.", "prov": "AR2025 going concern p.170 (Tier 1) - court and ministry record (Tier 2)"}], "engine_defects": {"note": "The logic layer is sound and the Shapley attribution is correct on its own terms: it sums to the gap, it is order-independent, and the lens aggregation is exact. Three things about the INPUTS do not survive the record, and a fourth is a tie-out worth revisiting.", "items": [{"id": "D1", "sev": "high", "title": "Scope mismatch in the revenue-per-passenger anchor", "text": "RP0 is set as 2761 / 68.8 = EUR 40.13. The numerator is GROUP revenue, which includes Eindhoven, Rotterdam and the Alliances & Participations business. The denominator is AMS-only passengers. Consistently scoped it is either EUR 35.35 (group over group, 2,761 / 78.105) or EUR 27.27 (AMS aviation over AMS passengers, 1,876 / 68.8). The engine's anchor is 13.5% high on the group basis. Because revenue = passengers x RP and passengers are capped, the level error propagates undamped into every cash-flow outcome and into the gap the Shapley decomposition then attributes.", "fix": "Declare the scope on the face of the register and use the same one on both sides. The 144.1 seats constant is correctly AMS-scoped, so the file already mixes two scopes in one logic layer."}, {"id": "D2", "sev": "high", "title": "The cap falsifier fired, in the direction it was not written for", "text": "The register holds the movement cap at 478k in both branches, calls it a hard constraint rather than a forecast, and states falsifier F1 as a tightening toward 460k. On 11 March 2026 the Raad van State annulled the decree that set 478,000, on the ground that a flight number is not a noise norm. The constraint is now administrative rather than statutory and its replacement is due in November 2026. A falsifier written only for a tightening cannot fire on an annulment.", "fix": "The Shapley dummy axiom scores this input at zero because both branches hold the same value. That is arithmetically right and epistemically wrong: it reads zero because the two branches agreed, not because the number is safe. Give the cap a two-sided falsifier and a branch that moves it."}, {"id": "D3", "sev": "medium", "title": "The up-gauging base sits at its own historical high", "text": "SEATS = 144.1 is taken as the FY2025 actual and up-gauging of 3% (A) or 6% (B) is layered on top. AMS ran about 144.3 passengers per movement in 2019. So FY2025 was recovery to the prior peak, not a gain, and both branches are claims about exceeding the airport's record rather than about approaching it. H1 2026 at 146.24 against 140.8 a year earlier is the first genuine evidence, and it is one half-year.", "fix": "Anchor the branches to 2019 rather than to 2025, and say that passengers per movement mixes gauge with load factor. Seats per movement is the clean series and it is not disclosed."}, {"id": "D4", "sev": "low", "title": "L6 is tied out, and there is now a series that could untie it", "text": "Capex-delivery quality carries zero weight by the variance gate because no objective series exists at that scale. There is now a partial one: EUR 801m spent in H1 2026 against EUR 1,056m for the whole of FY2025, against a EUR 10bn programme to 2035, with Pier A stated to open in 2027. Delivery milestones are observable and dateable.", "fix": "Not a defect in the file. A candidate for the next revision, recorded here so the tie-out is a choice that stays under review rather than a permanent one."}]}, "blocked_on": [{"item": "rab", "status": "CLOSED AS UNOBTAINABLE from public ACM material, pair-verified 2026-09-01 (mapping v0.7, CF-23). Defined at art. 29 elfde lid Bels, quantified nowhere; the only tabular appearance is building block D at p.36 and every cell reads [vertr.].", "blocks": "The mandate axis, and with it any statement about whether the return earned on the regulated asset base is the return the regime allows. This read therefore states the ROCE and the WACC side by side and refuses to net them."}, {"item": "regulated_wacc_pct usage", "status": "SOURCED at 5.36% post tax, ACM decision p.49, pair-verified. CF-24 OPEN: the statute may make this a ceiling on a projected return rather than an allowed return.", "blocks": "Scoring
