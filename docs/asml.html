function derivedCF() {
  // Cash flow by IDENTITY from the two statements: every balance line is used
  // exactly once, so the total ties to the change in cash by construction.
  // Not the reported statement — that is absent from schema v3 (convention E4).
  const inc = G.income, bal = G.balance, ys = G.years;
  const ni = ys.map((_, t) => inc.revenue[t] - inc.costOfSales[t] - inc.depreciation[t]
    - inc.sga[t] + inc.interestIncome[t] - inc.interestExpense[t] - inc.incomeTaxes[t]);
  const d = (arr, t) => arr[t] - arr[t - 1];
  const rows = [];
  const push = (label, fn, cls) => rows.push({label, vals: ys.slice(1).map((_, i) => fn(i + 1)), cls});
  push("Net income", t => ni[t]);
  push("+ Depreciation & amortisation", t => inc.depreciation[t]);
  push("− Δ other current operating assets", t => -d(bal.otherCurrentAssets, t));
  push("+ Δ accounts payable & accrued", t => d(bal.accountsPayable, t));
  push("+ Δ other non-interest liabilities (incl. prepayments)", t => d(bal.otherNonInterestLiab, t));
  push("Cash from operations", t => ni[t] + inc.depreciation[t] - d(bal.otherCurrentAssets, t)
    + d(bal.accountsPayable, t) + d(bal.otherNonInterestLiab, t), "tot");
  push("− Capex incl. (Δ net PPE + depreciation)", t => -(d(bal.ppe, t) + inc.depreciation[t]));
  push("− Δ R&D / other operating assets, net", t => -d(bal.otherOperatingAssets, t));
  push("Cash from investing", t => -(d(bal.ppe, t) + inc.depreciation[t]) - d(bal.otherOperatingAssets, t), "tot");
  push("Δ interest-bearing debt", t => d(bal.longTermDebt, t));
  push("Net shareholder flows (Δ equity − net income)", t => d(bal.equity, t) - ni[t]);
  push("Cash from financing", t => d(bal.longTermDebt, t) + d(bal.equity, t) - ni[t], "tot");
  const dcash = t => ni[t] + inc.depreciation[t] - d(bal.otherCurrentAssets, t)
    + d(bal.accountsPayable, t) + d(bal.otherNonInterestLiab, t)
    - (d(bal.ppe, t) + inc.depreciation[t]) - d(bal.otherOperatingAssets, t)
    + d(bal.longTermDebt, t) + d(bal.equity, t) - ni[t];
  push("Δ cash (derived)", dcash, "tot");
  push("Check: derived Δ cash − reported Δ cash", t => dcash(t) - d(bal.operatingCash, t));
  return rows;
}

/* ---------- valuation & financial health ----------
   Everything here is arithmetic on lines the golden already carries. No new
   extraction, and nothing is fetched in the browser: the market snapshot is a
   file with a retrieval date, injected like every other input. */
const BASE_EV = ((((comp.cases || {}).base || {}).valuation) || {}).ev
  || (comp.footballField && comp.footballField.evBase) || 0;
const BASE_T = G.years.length - 1;
const BASE_YEAR = G.years[BASE_T];
const MKT = STATE.marketSnapshot || null;

const health = (() => {
  const i = G.income, b = G.balance, t = BASE_T;
  const revenue = i.revenue[t];
  const grossProfit = revenue - i.costOfSales[t];
  const ebitda = grossProfit - i.sga[t];
  const ebit = ebitda - i.depreciation[t];
  const pretax = ebit + i.interestIncome[t] - i.interestExpense[t];
  const netIncome = pretax - i.incomeTaxes[t];
  const assets = b.operatingCash[t] + b.otherCurrentAssets[t] + b.ppe[t] + b.otherOperatingAssets[t];
  const equity = b.equity[t], debt = b.longTermDebt[t];
  const intExp = i.interestExpense[t];
  return {
    year: BASE_YEAR, revenue, grossProfit, ebitda, ebit, pretax, netIncome,
    assets, equity, debt, intExp,
    // Guarded terms. A term is null when its denominator makes it meaningless,
    // never when it is merely unflattering: a negative operating margin is a
    // finding, a ratio of two negatives is an artefact.
    coverage: intExp > 0 && ebit > 0 ? ebit / intExp : null,
    coverageWhy: intExp <= 0 ? "There is no interest expense on the base-year income statement, "
                             + "so there is nothing to cover."
      : ebit <= 0 ? "There are no operating earnings to cover interest at all. EBIT / interest "
                  + "expense would return a negative number, and a negative coverage ratio cannot "
                  + "be ranked against a positive one: it does not mean thin cover, it means none."
      : null,
    debtToAssets: assets > 0 ? debt / assets : null,
    taxBurden: pretax > 0 ? netIncome / pretax : null,
    interestBurden: ebit > 0 ? pretax / ebit : null,
    operatingMargin: revenue > 0 ? ebit / revenue : null,
    assetTurnover: assets > 0 ? revenue / assets : null,
    equityMultiplier: equity > 0 ? assets / equity : null,
    roe: equity > 0 ? netIncome / equity : null,
    roeWhy: equity > 0 ? null
      : `Book equity is ${fmt(equity, 1)} ${G.unit}, negative. Return on equity and the equity `
        + `multiplier are suppressed: dividing a loss by negative equity returns a POSITIVE `
        + `number, and printing it would report a profitable return on a company that lost `
        + `money. This is not a display choice, it is the ratio breaking down.`,
  };
})();

// The interest line's own recorded caveat, read from the extraction rather than
// written here: on one subject the tag is debt interest only, so coverage is
// flattering even as a sign.
const INTEREST_NOTE = (((G._collect || {}).missing_optional) || [])
  .filter(s => typeof s === "string" && s.startsWith("interestExpense:"));

function valuationRows() {
  const cs = (comp.cases) || {};
  return CASE_ORDER.filter(c => cs[c]).map(c => ({case: c, v: cs[c].valuation}));
}

/* market implied EV = market capitalisation + the model's own net debt, so the
   two enterprise values are on one basis. Net debt is filing-derived; only the
   cap is tier 3. */
function marketBlock() {
  if (!MKT) return null;
  const rows = valuationRows();
  if (!rows.length) return null;
  const netDebt = rows.find(r => r.case === "base").v.netDebt;
  const cap = (MKT.marketCap || {}).value;
  return {
    ok: MKT.currencyMatchesModel === true && typeof cap === "number",
    cap, netDebt,
    impliedEV: typeof cap === "number" ? cap + netDebt : null,
    price: (MKT.lastPrice || {}).value,
    currency: MKT.currency,
    note: MKT.currencyNote,
  };
}
const MB = marketBlock();

/* The ratio drivers as actually reported, on the ENGINE's definitions — the same
   ones build_registry.py uses for the anchors — so the history and the forecast
   paths are the same measurement and the continuation is legible. */
const RATIO_HISTORY = (() => {
  const i = G.income, b = G.balance, ys = G.years;
  const cash = ((comp.cashPolicy || {}).operatingCashPctRevenue) || 0;
  const defs = [
    ["gross_margin_pct", "Gross margin", "(revenue − cost of sales) / revenue",
     t => (i.revenue[t] - i.costOfSales[t]) / i.revenue[t]],
    ["opex_pct_revenue", "Opex ratio", "SG&A / revenue (R&D sits inside SG&A — C2)",
     t => i.sga[t] / i.revenue[t]],
    ["capex_incl_pct_revenue", "Capex intensity", "(Δ net PP&E + depreciation) / revenue",
     t => t === 0 ? null : (b.ppe[t] - b.ppe[t - 1] + i.depreciation[t]) / i.revenue[t]],
    ["owc_pct_revenue", "Working capital", "OWC / revenue, OWC on the engine's cash policy",
     t => ((cash * i.revenue[t] + b.otherCurrentAssets[t])
           - (b.accountsPayable[t] + b.otherNonInterestLiab[t])) / i.revenue[t]],
  ];
  const ts = ys.map((_, t) => t).slice(-3);
  return defs.map(([id, label, rule, fn]) => ({
    id, label, rule,
    years: ts.map(t => ({year: ys[t], value: fn(t)})),
    base: (CASES.base && CASES.base.paths[id]) || null,
  }));
})();

/* ---------- economic value created, on the actuals ----------
   The model's spine is ROIC against WACC (convention D1) and the Scenarios tab
   carries it FORWARD, over the five projected years. Nothing carried it
   BACKWARD, so the page asserted a spine without ever showing whether the
   business has cleared its cost of capital in the years that actually happened.

   Same arithmetic as the engine: NOPLAT = EBIT x (1 - taxRate), invested capital
   = OWC + PP&E + other operating assets on the engine's cash policy, ROIC =
   NOPLAT / PRIOR-year invested capital. The base-year figure is checked against
   the engine's own, which is why the check row is on the face. */
const EVA_HISTORY = (() => {
  const i = G.income, b = G.balance, ys = G.years;
  const cash = ((comp.cashPolicy || {}).operatingCashPctRevenue) || 0;
  const tax = (G.assumptions || {}).taxRate;
  const d = (G.scenarios || {}).discount || {};
  if (typeof tax !== "number" || typeof d.waccMid !== "number") return null;

  const ic = ys.map((_, t) =>
    (cash * i.revenue[t] + b.otherCurrentAssets[t])
    - (b.accountsPayable[t] + b.otherNonInterestLiab[t])
    + b.ppe[t] + b.otherOperatingAssets[t]);

  const charge = (w, icp) => w * icp;
  const rows = [];
  for (let t = 1; t < ys.length; t++) {
    const ebit = i.revenue[t] - i.costOfSales[t] - i.depreciation[t] - i.sga[t];
    const noplat = ebit * (1 - tax);
    const icp = ic[t - 1];
    // The RATIO breaks when the denominator is not positive; the ECONOMIC PROFIT
    // does not. NOPLAT less a capital charge is well defined either way, and
    // where invested capital is negative the charge is a credit — the business
    // is being funded by its customers rather than funding them.
    rows.push({
      year: ys[t], icPrior: icp, ebit, noplat,
      roic: icp > 0 ? noplat / icp : null,
      eva: noplat - charge(d.waccMid, icp),
      evaLow: noplat - charge(d.waccLow, icp),
      evaHigh: noplat - charge(d.waccHigh, icp),
      // A return is a level; growth says whether that level is worth feeding.
      // Growth multiplies whatever the spread already is, in either direction.
      growth: i.revenue[t - 1] > 0 ? i.revenue[t] / i.revenue[t - 1] - 1 : null,
      reinvested: ic[t] - icp,
    });
  }
  // Every year the extraction reached, not a fixed three. The windows already
  // differ by subject (RBRK has two years by necessity) and truncating to three
  // would have hidden NVIDIA's FY2023, the one year in its record that sits
  // BELOW its own cost of capital — which is the single most informative row
  // this panel has.
  const window = rows;
  const engineIC = ((comp.cashPolicy || {}).baseYear || {}).investedCapital;
  return {
    rows: window,
    wacc: d,
    taxRate: tax,
    lossYears: window.filter(r => r.ebit < 0).length,
    cumulative: window.reduce((a, r) => a + r.eva, 0),
    // every year's verdict holds across the whole band, or it does not
    signStable: window.every(r => (r.evaLow > 0) === (r.evaHigh > 0)),
    checkComputed: ic[ic.length - 1],
    checkEngine: engineIC,
    checkTies: typeof engineIC === "number"
      && Math.abs(ic[ic.length - 1] - engineIC) < 0.05,
  };
})();

/* ---------- relative expensiveness ----------
   Every figure here is TIER 3, including the subject's own row, and that is the
   point: one provider, one moment, one definition, so the players are
   comparable to EACH OTHER. They are not comparable to the model's own
   multiples, which use house gross profit and the model's net debt — the two
   panels are different measurements and the page says so rather than letting a
   reader take a ratio between them. */
const PM = STATE.peerMultiples || null;

function peerRank(rows, key, id) {
  const vals = rows.filter(r => typeof r[key] === "number")
                   .sort((a, b) => a[key] - b[key]);
  const i = vals.findIndex(r => r.ticker === id);
  return i < 0 ? null : {rank: i + 1, of: vals.length};
}

const median = (xs) => {
  const v = xs.filter(x => typeof x === "number").sort((a, b) => a - b);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
};

/* The four cells of the value-driver grid. Growth is not a virtue and not a
   vice on its own: it scales the spread. The wording refuses to congratulate
   growth bought below the hurdle, which is the reading a growth rate printed on
   its own invites. */
function growthVerdict(r, wacc) {
  if (r.roic === null)
    return r.eva > 0 ? "created — ratio n/a" : "destroyed — ratio n/a";
  const above = r.roic > wacc;
  const growing = r.growth !== null && r.growth > 0.02;
  if (above && growing) return "compounding: growth feeds a positive spread";
  if (above) return "earning above the hurdle, but not scaling it";
  if (growing) return "growth on a negative spread: scale is making it worse";
  return "below the hurdle, and not growing into it";
}

const gapBoth = (model, market) => {
  if (!isFinite(model) || !isFinite(market) || model === 0 || market === 0) return "—";
  const a = (model - market) / Math.abs(market) * 100;
  const b = (market - model) / Math.abs(model) * 100;
  return `model ${a < 0 ? "below" : "above"} market by ${Math.abs(a).toFixed(1)}% · `
       + `market ${b < 0 ? "below" : "above"} model by ${Math.abs(b).toFixed(1)}%`;
};

function cfPanel() {
    const rows = derivedCF();
    return `<div class="panel"><h2>Statement of cash flows · derived by identity</h2>
      <p class="note" style="color:var(--wait)">Schema v3 carries no reported cash flow statement
      (open convention E4). This one is derived from the income statement and balance-sheet
      deltas: every balance line is used exactly once, so it ties to the change in cash by
      construction — the check row is the proof. What deltas cannot recover: the
      buyback/dividend split (shown net) and any non-cash reclassifications.</p>
      <div class="scroll"><table>
      <thead><tr><th></th>${G.years.slice(1).map(y => `<th style="text-align:right">${y}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr${r.cls ? ` class="${r.cls}"` : ""}><td>${esc(r.label)}</td>
        ${r.vals.map(v => `<td class="n">${fmt(v)}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>
      <p class="note">Read the financing and prepayment lines together: they show who is funding
      the business. A large customer-prepayment inflow means the customer base is financing
      working capital, which the fragility and capital-recovery lenses both speak to.</p></div>`;
  }

/* A reading item may carry links: [{tab, label}] pointing at the tab that holds
   its evidence. The old hardcoded ASML page had these as buttons and the
   data-driven readings lost them, so a claim citing LR-ZS-F02 left the reader to
   go and find LR-ZS-F02. A link naming a tab that does not exist is rendered
   BROKEN rather than dropped: a dead reference should be visible. */
function readingLinks(links) {
  if (!Array.isArray(links) || !links.length) return "";
  return `<div class="lnks">` + links.map(l => {
    const tab = l && l.tab, label = (l && l.label) || tab;
    if (!tab || !TAB_NAMES.includes(tab))
      return `<span class="lnk broken" title="no tab named ${esc(String(tab))}">${
        esc(String(label))} · broken link</span>`;
    return `<button class="lnk" data-goto="${esc(tab)}">${esc(label)} →</button>`;
  }).join("") + `</div>`;
}

const TABS = {
  "Reading": () => {
    const R = STATE.reading;
    if (R) {
      let out = `<div class="panel"><h2>${esc(R.title || "The company, as this model holds it")}</h2>
        ${(R.lede || []).map(p => `<p class="note">${esc(p)}</p>`).join("")}
        <p class="note" style="color:var(--wait)">Commentary, not data: every claim below rests on

        unstamped.</p></div>`;
      for (const s of (R.sections || [])) {
        out += `<div class="panel"><h2>${esc(s.heading)}</h2>`;

    }

      <p class="note">Commentary is authored per company from its recorded findings and lives in

      subject yet. Nothing generic is shown in its place.</p></div>`;
  },

  "Statements": () => `
    <div class="panel"><h2>Income statement</h2><div class="scroll"><table>
      <thead>${yearHead(G.years)}</thead><tbody>${rows(G.income, G.labels)}</tbody></table></div></div>
    <div class="panel"><h2>Balance sheet</h2><div class="scroll"><table>
      <thead>${yearHead(G.years)}</thead><tbody>${rows(G.balance, G.labels)}</tbody></table></div>
      <p class="note">Tax rate ${pct(G.assumptions.taxRate)} · WACC ${pct(G.assumptions.wacc)}
      · shares ${fmt(G.sharesOutstanding[G.sharesOutstanding.length-1],1)}m</p></div>` + cfPanel(),

  "Valuation": () => {
    const rows = valuationRows();
    if (!rows.length) return `<div class="panel"><h2>No valuation yet</h2>
      <p class="note">The engine has not run on this subject, so there is no
      <code>scenarios.computed</code> block to read. Nothing is estimated in its place.</p></div>`;
    const U = comp.footballField && comp.footballField.unit || G.unit;
    const shares = (G.sharesOutstanding || []).slice(-1)[0] || 0;
    let out = "";

    /* ---- 1. the market's price ------------------------------------------- */
    if (!MKT) {
      out += `<div class="panel"><h2>The market's price</h2>
        <p class="note" style="color:var(--wait)">No market snapshot on file for this subject.
        The comparison is left empty rather than filled: run
        <code>tools/fetch_market_inputs.py --snapshot</code> on the market venv, which writes a
        price with its retrieval date. Nothing on this page is tuned toward a market price in
        any case.</p></div>`;
    } else if (!MB.ok) {
      out += `<div class="panel"><h2>The market's price</h2>
        <p class="note" style="color:var(--block)">${esc(MB.note || "market data unusable")}</p>

    /* ---- 2. what each scenario means ------------------------------------- */

    out += `<div class="panel"><h2>What each scenario means</h2>

        A curator must supply the count and record the basis before any per-share number appears
        here. The enterprise and equity values above stand on their own.</p>`}</div>`;

    /* ---- 3. ratios on the same basis ------------------------------------- */
    const rev = health.revenue, gp = health.grossProfit;
    const rr = (ev, d) => d > 0 ? (ev / d).toFixed(2) + "x" : "—";
    out += `<div class="panel"><h2>Ratios on the same basis</h2>
      <p class="note">Both multiples use <b>FY${BASE_YEAR}</b> revenue ${fmt(rev)} and gross profit

      <div class="scroll"><table>

      ${rows.map(({case: c, v}) => `<tr><td class="${caseCls(c)}">${c}</td>

        <td class="n">${rr(v.ev, gp)}</td></tr>`).join("")}
      ${MB && MB.ok ? `<tr class="tot"><td>market</td><td class="n">${fmt(MB.impliedEV)}</td>
        <td class="n">${rr(MB.impliedEV, rev)}</td>

    /* ---- 4. where the value sits ----------------------------------------- */
    out += `<div class="panel"><h2>Where the value sits</h2>

      <div class="scroll"><table>

      ${rows.map(({case: c, v}) => {
        // A share of a negative whole is not a share. Where EV itself is below
        // zero the ratio is two negatives and says nothing about composition.

          meaningless ? "n/a" : sh === null ? "—" : sh.toFixed(1) + "%"}</td>
        <td style="width:150px;font-size:11px;color:var(--block)">${meaningless
          ? "enterprise value is not positive — a share of it is not a proportion"
          : `<div class="bar"><i style="width:${Math.min(100, Math.abs(sh || 0)).toFixed(1)}%"></i></div>`}</td></tr>`;
      }).join("")}
      </tbody></table></div>
      <p class="note" style="color:var(--wait)"><b>Units.</b> The stored field
      <code>terminalSharePct</code> is a FRACTION, not a percentage: 1.86 means 186%. Reading it as
      a percentage understated a terminal contribution by two orders of magnitude on two published
      pages before it was caught. The column above multiplies by 100 exactly once.</p></div>`;

    /* ---- 4b. relative expensiveness against the recorded peer set -------- */
    if (!PM) {
      out += `<div class="panel"><h2>Relative expensiveness · peers</h2>
        <p class="note" style="color:var(--wait)">No peer-multiples file for this subject. Run
        <code>tools/fetch_market_inputs.py --peer-multiples</code> on the market venv. Nothing is
        estimated in its place.</p></div>`;
    } else {
      const ok = PM.players.filter(p => p.usable);
      const bad = PM.players.filter(p => !p.usable);
      const subj = ok.find(p => p.isSubject);
      const COLS = [
        ["evRevenue", "EV / Revenue", 2],
        ["evGrossProfit", "EV / Gross profit", 2],
        ["pe", "P/E", 1],
      ];
      const cell = (p, key, dp) => {
        const v = p[key];
        if (typeof v !== "number")
          return `<td class="n" style="color:var(--block);font-size:11px">n/a</td>`;
        const bold = p.isSubject ? "font-weight:600;color:var(--brass)" : "";
        return `<td class="n" style="${bold}">${v.toFixed(dp)}${key === "pe" ? "" : "×"}</td>`;
      };
      out += `<div class="panel"><h2>Relative expensiveness · the recorded peer set
        <span class="status-chip st-open">tier 3</span></h2>
        <p class="note">${esc(PM.provider)}, retrieved <b>${esc(PM.retrieved_at)}</b>.
        <b style="color:var(--wait)">TIER 3 throughout, INCLUDING the subject's own row</b> — and
        that is deliberate. One provider, one moment, one definition of enterprise value, so the
        players are comparable to each other. Enterprise value is market capitalisation plus total
        debt less cash and short-term investments, computed here rather than read from the
        provider's own field, so no player is on a different definition from the rest.</p>
        <div class="scroll"><table>
        <thead><tr><th>Player</th><th>Listing</th><th style="text-align:right">Fiscal year</th>
        ${COLS.map(([, label]) => `<th style="text-align:right">${label}</th>`).join("")}
        <th style="text-align:right">ROIC proxy*</th></tr></thead><tbody>
        ${ok.map(p => `<tr${p.isSubject ? ' style="background:rgba(198,165,83,.07)"' : ""}>
          <td${p.isSubject ? ' style="color:var(--brass);font-weight:600"' : ""}>${esc(p.ticker)}${
            p.isSubject ? " · subject" : ""}</td>
          <td style="font-family:var(--mono);font-size:11px;color:var(--ink-faint)">${esc(p.listing)}${
            p.listing !== p.ticker ? " ⚑" : ""}</td>
          <td class="n" style="font-size:11px;color:var(--ink-faint)">${esc(p.fiscalYearEnd || "—")}
            <br>${esc(p.currency)}</td>
          ${COLS.map(([k, , dp]) => cell(p, k, dp)).join("")}
          <td class="n" style="${p.roicProxy === null ? "color:var(--block);font-size:11px"
            : p.roicProxyUnstable ? "color:var(--wait)" : ""}">${
            p.roicProxy === null ? "n/a" : (100 * p.roicProxy).toFixed(1) + "%"
              + (p.roicProxyUnstable ? " ⚠" : "")}</td></tr>`).join("")}
        <tr class="tot"><td>Median of ${ok.length}</td><td></td><td></td>
          ${COLS.map(([k, , dp]) => {
            const m = median(ok.map(p => p[k]));
            return `<td class="n">${m === null ? "—" : m.toFixed(dp) + (k === "pe" ? "" : "×")}</td>`;
          }).join("")}
          <td class="n">${(() => { const m = median(ok.map(p => p.roicProxy));
            return m === null ? "—" : (100 * m).toFixed(1) + "%"; })()}</td></tr>
        </tbody></table></div>

        ${subj ? `<p class="note">${COLS.map(([k, label]) => {
          const r = peerRank(ok, k, subj.ticker);
          if (!r) return `<b>${label}</b>: not ranked, the subject's own figure is n/a.`;
          return `<b>${label}</b>: ${esc(subj.ticker)} is ${r.rank} of ${r.of}, ${
            r.rank === 1 ? "the CHEAPEST in the set"
            : r.rank === r.of ? "the DEAREST in the set"
            : r.rank <= r.of / 2 ? "in the cheaper half" : "in the dearer half"}.`;
        }).join(" ")}</p>` : ""}

        ${bad.length ? `<p class="note" style="color:var(--block)"><b>${bad.length} player${
          bad.length > 1 ? "s" : ""} left out rather than part-filled.</b> ${bad.map(p =>
          `<b>${esc(p.ticker)}</b>: ${esc(p.why)}`).join(" ")}</p>` : ""}

        <p class="note" style="color:var(--wait)"><b>*The ROIC proxy is the weakest column here,
        and it is not the ROIC on this page.</b> It is EBIT × (1 − 21%) over FINANCING-side
        invested capital — total debt plus equity less cash — while the model's ROIC strikes
        NOPLAT on OPERATING-side invested capital (working capital + PP&amp;E + other operating
        assets) and on the prior year. Two different measures of the same word.
        ${subj && subj.roicProxy !== null && EVA_HISTORY && EVA_HISTORY.rows.length
          && EVA_HISTORY.rows[EVA_HISTORY.rows.length - 1].roic !== null
          ? `On ${esc(subj.ticker)} the proxy reads
             <b>${(100 * subj.roicProxy).toFixed(1)}%</b> against the model's
             <b>${pct(EVA_HISTORY.rows[EVA_HISTORY.rows.length - 1].roic, 1)}</b> for the same
             company — the gap is the measure, not the business, and it is shown so the proxy is
             read as a screen rather than as a result.`
          : `The subject's own proxy is not computable, which is itself the calibration: read the
             economic-profit panel below instead.`}
        The 21% rate is held identical for EVERY player so the ranking is not distorted by
        differing tax regimes; it is nobody's actual rate.
        ${ok.some(p => p.roicProxyUnstable) ? `Rows marked ⚠ carry invested capital below a tenth
          of revenue — ${ok.filter(p => p.roicProxyUnstable).map(p => esc(p.ticker)).join(", ")} —
          so the ratio moves on the size of a near-zero denominator rather than on returns. A
          cash-rich, equity-funded software balance sheet nets to almost nothing on this
          definition, which is exactly where the proxy stops meaning anything.` : ""}
        ${ok.some(p => p.roicProxy === null) ? `Rows reading n/a have invested capital at or below
          zero, suppressed on the same rule as the return on equity below.` : ""}</p>

        <p class="note" style="color:var(--wait)"><b>Three reasons not to over-read this table.</b>
        First, <b>the fiscal years do not line up</b>: ${PM.fiscalYearSpread
          ? `these figures span year-ends from ${esc(PM.fiscalYearSpread.earliest)} to
             ${esc(PM.fiscalYearSpread.latest)}`
          : "the year-ends differ"}, so the multiples are priced today against trailing periods up
        to eleven months apart. Second, <b>gross profit is the provider's, not the house line</b>:
        the model's own gross profit is depreciation-free (convention E1) and this one is not, so
        the EV/Gross Profit above and the one in "Ratios on the same basis" are different
        measurements and a ratio between them means nothing. Third, <b>this is the W1 peer
        basis</b> — ${esc(PM.peerSetCaveat)}</p>

        <p class="note">${esc(PM.peerSetBasis)}</p>
        ${ok.some(p => p.listing !== p.ticker) ? `<p class="note" style="color:var(--wait)">
          ⚑ priced off a different listing. A depositary receipt quotes in one currency and reports
          its statements in another — ${ok.filter(p => p.listing !== p.ticker).map(p =>
          `${esc(p.ticker)} → ${esc(p.listing)}`).join(", ")} — and an enterprise value built from
          a market capitalisation in one currency and debt in another is not a number. Each player
          is priced off the listing whose quote currency matches its own statements; the ratios are
          dimensionless, so they still compare across the set.</p>` : ""}
        </div>`;
    }

    /* ---- 5. did the last three years earn their cost of capital? -------- */
    if (EVA_HISTORY) {
      const E = EVA_HISTORY, w = E.wacc;
      const verdict = r => r.eva > 0 ? "created" : "destroyed";
      out += `<div class="panel"><h2>Economic value created · the last ${E.rows.length} reported
        year${E.rows.length > 1 ? "s" : ""}</h2>
        <p class="note">This is the model's spine, pointed backwards. ROIC against WACC on the
        years that actually happened, using the engine's own definitions: NOPLAT = EBIT ×
        (1 − ${pct(E.taxRate)}), invested capital = operating working capital + PP&amp;E + other
        operating assets on the cash policy, and ROIC struck on <b>prior-year</b> invested capital.
        Economic profit is NOPLAT less a capital charge at the W1 mid rate of
        <b>${pct(w.waccMid)}</b> — the same identity the engine uses forward, so the history and
        the forecast are one measure.</p>
        <div class="scroll"><table>
        <thead><tr><th>Year</th>
        <th style="text-align:right">Invested capital<br><span style="font-weight:400;font-size:10px;color:var(--ink-faint)">prior year</span></th>
        <th style="text-align:right">NOPLAT</th>
        <th style="text-align:right">ROIC</th>
        <th style="text-align:right">− WACC</th>
        <th style="text-align:right">Revenue growth</th>
        <th style="text-align:right">Δ invested capital</th>
        <th style="text-align:right">Economic profit (${esc(G.unit)})</th>
        <th>Growth × spread</th></tr></thead><tbody>
        ${E.rows.map(r => `<tr>
          <td>FY${r.year}</td>
          <td class="n" style="${r.icPrior <= 0 ? "color:var(--block)" : ""}">${fmt(r.icPrior)}</td>
          <td class="n" style="${r.noplat < 0 ? "color:var(--block)" : ""}">${fmt(r.noplat)}</td>
          <td class="n" style="${r.roic === null ? "color:var(--block)"
            : r.roic < w.waccMid ? "color:var(--block)" : "color:var(--pass)"}">${
            r.roic === null ? "n/a" : pct(r.roic, 1)}</td>
          <td class="n" style="color:var(--ink-faint)">${r.roic === null ? "—"
            : ((r.roic - w.waccMid) * 100).toFixed(1) + "pp"}</td>
          <td class="n">${r.growth === null ? "—" : pct(r.growth, 1)}</td>
          <td class="n" style="color:var(--ink-faint)">${fmt(r.reinvested)}</td>
          <td class="n" style="color:${r.eva > 0 ? "var(--pass)" : "var(--block)"}">${fmt(r.eva)}</td>
          <td style="font-size:11.5px;color:${r.eva > 0 ? "var(--pass)" : "var(--block)"}">${
            esc(growthVerdict(r, w.waccMid))}</td></tr>`).join("")}
        <tr class="tot"><td>Cumulative, ${E.rows.length} year${E.rows.length > 1 ? "s" : ""}</td>
          <td></td><td></td><td></td><td></td><td></td>
          <td class="n" style="color:var(--ink-faint)">${fmt(E.rows.reduce((a, r) => a + r.reinvested, 0))}</td>
          <td class="n" style="color:${E.cumulative > 0 ? "var(--pass)" : "var(--block)"}">${
            fmt(E.cumulative)}</td>
          <td style="font-size:11.5px">${E.cumulative > 0 ? "value created" : "value destroyed"}</td></tr>
        </tbody></table></div>

        <p class="note"><b>Why growth sits in this table and not in a separate one.</b> A return is
        a level; growth says whether that level is worth feeding. Growth does not create value on
        its own — it MULTIPLIES the spread between ROIC and WACC, in whichever direction the spread
        already points. Above the hurdle, faster growth compounds the surplus and reinvestment is
        the right use of cash. Below it, faster growth destroys value faster, and the same
        reinvestment is the problem rather than the remedy. The Δ invested capital column is what
        was actually put back in, so the two can be read together: growth bought with capital that
        earns less than it costs is the worst cell in this table, not the second-best.</p>

        ${E.rows.some(r => r.roic === null) ? `<p class="note" style="color:var(--block)">
          <b>ROIC is suppressed where invested capital is not positive, and this is the same trap
          as the return on equity above.</b> ${E.rows.filter(r => r.roic === null).map(r =>
            `FY${r.year} strikes on prior-year invested capital of ${fmt(r.icPrior)}: NOPLAT of
             ${fmt(r.noplat)} divided by that returns
             <b>+${(100 * r.noplat / r.icPrior).toFixed(1)}%</b>, a positive return on a loss,
             which alongside a genuinely high ROIC elsewhere on this site would read as strength.`)
            .join(" ")} The economic profit column survives, because NOPLAT less a capital charge
          is defined whatever the sign: where invested capital is negative the charge is a
          <b>credit</b>, since customers are funding the business rather than the business funding
          them. That is a real feature of a deferred-revenue model, and it is the reason the
          currency figure is the honest one to read here.</p>` : ""}

        ${E.lossYears ? `<p class="note" style="color:var(--wait)"><b>Tax on a loss.</b>
          ${E.lossYears} of these ${E.rows.length} year${E.rows.length > 1 ? "s" : ""} carry
          negative EBIT, and NOPLAT multiplies it by (1 − ${pct(E.taxRate)}), which makes the loss
          SMALLER. That assumes a tax benefit on the loss. Where a filer carries a full valuation
          allowance the benefit does not arrive in cash, so the true economic loss is nearer EBIT
          itself. The engine applies the identical treatment forward, so history and forecast stay
          comparable; the assumption is the same one either way. See convention T1.</p>` : ""}

        <p class="note" style="color:var(--wait)"><b>Stage of development, and why this number is
        biased against a young company.</b> Invested capital here is the accounting base: working
        capital, PP&amp;E and other operating assets. A company whose growth spending goes through
        the income statement rather than onto the balance sheet — customer acquisition, research,
        stock compensation — builds an asset the measure cannot see. Its invested capital is
        therefore too SMALL and its NOPLAT too small, and the two biases do not cancel: in the
        investment phase the charge understates the capital at risk while the return understates
        the earning power being built. A mature company that capitalises its plant has no such
        gap. So a negative ROIC on a subscription business in its build-out is evidence that the
        spending has not yet converted, NOT evidence that the capital is unproductive, and the two
        readings are distinguished by whether the cohort economics improve — which is the
        trajectory panel on the Scenarios tab, not this one. Capitalising and amortising that
        spend is a legitimate alternative basis and would raise both terms; it is a change of
        convention, recorded as <b>G1</b> and open, not applied silently here. Do not rank a
        capital-intensive manufacturer against a subscription business on this column alone.</p>

        <p class="note" style="color:var(--wait)"><b>Two things this measure is not.</b>
        First, the W1 band was constructed at a single date and is held flat across every year
        shown. The cost of capital in FY${E.rows[0].year} was not ${pct(w.waccMid)}; no historical
        band exists in this pipeline, so what is being asked is whether these years clear
        <i>today's</i> hurdle, not the hurdle of their own time. Second, the rate the NOPLAT is
        struck at is governed by open convention T1 — statutory against effective — so where those
        differ the level of ROIC moves with it even though the ranking does not.
        ${E.signStable
          ? `Every verdict above holds across the whole band, ${pct(w.waccLow)} to ${pct(w.waccHigh)}:
             no year changes sign between the low and high rate.`
          : `<b>At least one year changes sign between ${pct(w.waccLow)} and ${pct(w.waccHigh)}</b>,
             so its verdict is a function of where in the band you stand rather than of the
             business.`}</p>

        <p class="note" style="font-family:var(--mono);font-size:11px;color:${
          E.checkTies ? "var(--ink-faint)" : "var(--block)"}">
        check · base-year invested capital computed here ${fmt(E.checkComputed, 1)} vs the engine's
        ${fmt(E.checkEngine, 1)} · ${E.checkTies ? "ties" : "DOES NOT TIE — the page and the engine "
          + "disagree about what invested capital is, and the rows above are not trustworthy"}</p>
        </div>`;
    }

    /* ---- 6. financial health -------------------------------------------- */
    const H = health;
    const lev = rows.find(r => r.case === "base").v;
    const ndEV = lev.ev !== 0 ? lev.netDebt / lev.ev : null;
    out += `<div class="panel"><h2>Financial health · FY${H.year}</h2>
      <p class="note">Every line is computed from the golden's own fields, no new extraction:
      EBIT = revenue − cost of sales − depreciation − SG&amp;A · pre-tax = EBIT + interest income −
      interest expense · net income = pre-tax − taxes · total assets = operating cash + other
      current assets + PP&amp;E + other operating assets. Because SG&amp;A is the only line between
      gross profit and EBITDA, R&amp;D sits inside it (convention C2).</p>
      <div class="scroll"><table><tbody>
      <tr><td>Revenue</td><td class="n">${fmt(H.revenue)}</td>
        <td>Gross profit</td><td class="n">${fmt(H.grossProfit)}</td></tr>
      <tr><td>EBITDA</td><td class="n" style="${H.ebitda < 0 ? "color:var(--block)" : ""}">${fmt(H.ebitda)}</td>
        <td>EBIT</td><td class="n" style="${H.ebit < 0 ? "color:var(--block)" : ""}">${fmt(H.ebit)}</td></tr>
      <tr><td>Pre-tax</td><td class="n">${fmt(H.pretax)}</td>
        <td>Net income</td><td class="n" style="${H.netIncome < 0 ? "color:var(--block)" : ""}">${fmt(H.netIncome)}</td></tr>
      <tr><td>Total assets</td><td class="n">${fmt(H.assets)}</td>
        <td>Book equity</td><td class="n" style="${H.equity < 0 ? "color:var(--block)" : ""}">${fmt(H.equity)}</td></tr>
      </tbody></table></div>

      <h2 style="margin-top:18px">Interest cover</h2>
      ${H.coverage !== null
        ? `<p class="note" style="font-size:14px">EBIT ${fmt(H.ebit)} ÷ interest expense
           ${fmt(H.intExp)} = <b>${H.coverage.toFixed(1)}×</b></p>`
        : `<p class="note" style="font-size:14px;color:var(--block)"><b>No cover: EBIT is
           negative.</b> EBIT is ${fmt(H.ebit)} ${esc(U)} against interest expense
           ${fmt(H.intExp)}. ${esc(H.coverageWhy || "")}</p>`}
      ${INTEREST_NOTE.length ? `<p class="note" style="color:var(--wait)"><b>The denominator carries
        a recorded caveat.</b> ${INTEREST_NOTE.map(s => esc(s.replace(/,\s*recorded\s*$/, "."))).join(" ")}
        Where the tag is debt interest only, the true interest burden is larger than the line
        shown, so any cover computed on it is flattering — in sign as well as in size.</p>` : ""}

      <h2 style="margin-top:18px">Leverage</h2>
      <div class="scroll"><table>
      <thead><tr><th>Measure</th><th style="text-align:right">Value</th><th>Basis</th></tr></thead><tbody>
      <tr><td>Debt / total assets</td><td class="n">${H.debtToAssets === null ? "—" : H.debtToAssets.toFixed(3)}</td>
        <td style="font-size:11.5px;color:var(--ink-soft)">interest-bearing debt ${fmt(H.debt)} over
        total assets ${fmt(H.assets)}, FY${H.year}</td></tr>
      <tr><td>Net debt / enterprise value</td><td class="n">${ndEV === null ? "—" : ndEV.toFixed(3)}</td>
        <td style="font-size:11.5px;color:var(--ink-soft)">base case: net debt ${fmt(lev.netDebt)}
        over EV ${fmt(lev.ev)}. The valuation-relevant cut; negative means net cash.</td></tr>
      </tbody></table></div>
      <p class="note">Debt / assets is the headline here on purpose. <b>Debt/equity and
      debt/EBITDA are deliberately not shown</b>: they invert or explode on exactly the subjects
      where leverage matters most — a negative book equity flips the sign of one, a negative EBITDA
      flips the other — so a reader would rank the most levered names as the least. Both denominators
      above stay positive across this cohort.</p>

      <h2 style="margin-top:18px">DuPont · five-step</h2>
      <p class="note" style="font-family:var(--mono);font-size:11.5px">ROE = (NI/pre-tax) ×
      (pre-tax/EBIT) × (EBIT/revenue) × (revenue/assets) × (assets/equity)</p>
      <div class="scroll"><table>
      <thead><tr><th>Term</th><th>Ratio</th><th style="text-align:right">Value</th>
      <th>Reads as</th></tr></thead><tbody>
      ${[
        ["Tax burden", "NI / pre-tax", H.taxBurden,
         H.pretax > 0 ? "share of pre-tax profit kept after tax"
           : "UNAVAILABLE — pre-tax result is a loss, so the ratio is two negatives and carries no meaning"],
        ["Interest burden", "pre-tax / EBIT", H.interestBurden,
         H.ebit > 0 ? "share of operating profit surviving the interest line"
           : "UNAVAILABLE — EBIT is negative, so there is no operating profit for interest to erode"],
        ["Operating margin", "EBIT / revenue", H.operatingMargin,
         "operating profitability; negative is a finding, not a gap"],
        ["Asset turnover", "revenue / assets", H.assetTurnover,
         "revenue produced per unit of assets"],
        ["Equity multiplier", "assets / equity", H.equityMultiplier,
         H.equity > 0 ? "how far assets are levered above book equity"
           : "UNAVAILABLE — book equity is negative, so the multiplier is negative and meaningless"],
      ].map(([n, r, v, reads]) => `<tr>
        <td>${n}</td><td style="font-family:var(--mono);font-size:11.5px">${r}</td>
        <td class="n" style="${v === null ? "color:var(--ink-faint)" : ""}">${
          v === null ? "n/a" : v.toFixed(4)}</td>
        <td style="font-size:11.5px;color:${String(reads).startsWith("UNAVAILABLE")
          ? "var(--block)" : "var(--ink-soft)"}">${esc(reads)}</td></tr>`).join("")}
      <tr class="tot"><td>Return on equity</td><td style="font-family:var(--mono);font-size:11.5px">NI / equity</td>
        <td class="n">${H.roe === null ? "SUPPRESSED" : H.roe.toFixed(4)}</td>
        <td style="font-size:11.5px;color:${H.roe === null ? "var(--block)" : "var(--ink-soft)"}">${
          H.roe === null ? "book equity is negative — see below for why this is blank rather than a number"
          : (H.taxBurden === null || H.interestBurden === null
            ? "the level holds, but the decomposition is partial: the terms marked unavailable "
              + "above do not multiply back to it"
            : "the five terms above multiply back to this")}</td></tr>
      </tbody></table></div>
      ${H.roe === null ? `<p class="note" style="color:var(--block)"><b>Why the blank is the
        answer.</b> ${esc(H.roeWhy)} Net income is ${fmt(H.netIncome)} and equity is
        ${fmt(H.equity)}; the quotient is +${(H.netIncome / H.equity).toFixed(2)}, which would read
        as a ${(100 * H.netIncome / H.equity).toFixed(0)}% return on a company that lost money. It
        is shown here once, in words, so the suppression cannot be mistaken for missing data.</p>` : ""}

      <p class="note" style="color:var(--wait)"><b>Which measure is the spine.</b> This model's
      spine is <b>ROIC against WACC</b>, which excludes capital structure deliberately: it asks
      whether the operations earn more than the capital costs, whoever supplied it. ROE and its
      equity multiplier put leverage back in. Both are legitimate and they answer different
      questions, but having them on one page invites reading them as one measure. Where they
      disagree, the valuation follows ROIC — see the Scenarios tab for ROIC against the W1 band.
      Recorded as convention D1.</p></div>`;
    return out;
  },

  "Scenarios": () => {
    let out = "";
    // 0. Where the forecast starts from. The cases are a continuation of a
    //    trajectory, and without the trajectory a reader has no way to judge
    //    whether the base case bends the line or merely extends it.
    {
      const hist = RATIO_HISTORY.filter(r => r.years.some(y => y.value !== null));
      const yrs = RATIO_HISTORY[0].years.map(y => y.year);
      const H = (G.drivers || {}).horizonYears || 5;
      const lastY = G.years[G.years.length - 1];
      out += `<div class="panel"><h2>Where the forecast starts · the last ${yrs.length} reported years</h2>
        <p class="note">The ratio drivers as actually reported, computed on the engine's own
        definitions — the same arithmetic that produced the anchors, so history and forecast are
        one measurement rather than two. Read this before the three cases: it is the evidence a
        case path either continues or breaks with.</p>
        <div class="scroll"><table>
        <thead><tr><th>Driver</th>
        ${yrs.map(y => `<th style="text-align:right">FY${y}</th>`).join("")}
        <th style="text-align:right" class="c-base">base FY${lastY + 1}</th>
        <th style="text-align:right" class="c-base">base FY${lastY + H}</th>
        <th>Definition</th></tr></thead><tbody>
        ${hist.map(r => `<tr><td>${esc(r.id)}<br>
          <span style="color:var(--ink-faint);font-size:11px">${esc(r.label)}</span></td>
          ${r.years.map(y => `<td class="n">${y.value === null ? "—" : (y.value * 100).toFixed(1) + "%"}</td>`).join("")}
          <td class="n c-base">${r.base ? (r.base[0] * 100).toFixed(1) + "%" : "—"}</td>
          <td class="n c-base">${r.base ? (r.base[r.base.length - 1] * 100).toFixed(1) + "%" : "—"}</td>
          <td style="white-space:normal;font-size:11.5px;color:var(--ink-soft);min-width:200px">${esc(r.rule)}</td>
          </tr>`).join("")}
        </tbody></table></div>
        <p class="note">Capex intensity has no FY${G.years[0]} value by construction: it is derived
        from the change in net PP&amp;E, so the first year in the window carries no prior balance.
        Every percentage here is a ratio to revenue except gross margin, which is a margin on it.</p>
        </div>`;
    }
    // 1. The assumptions that separate the cases, BEFORE any computed effect.
    if (divergingIds.length) {
      const rows = divergingIds
        .map(id => ({id, span: TORNADO[id] || 0}))
        .sort((a,b) => b.span - a.span);
      out += `<div class="panel"><h2>What separates the cases</h2>
        <p class="note">The assumptions, before their effect on any total. Only these
        ${rows.length} drivers differ across bear, base and bull; the other
        ${flatIds.length} are held identical in every case by construction (see Drivers).
        Values are FY2029 terminal. <b>EV span is enterprise value in ${esc(G.unit)}</b> — the
        difference in EV between that driver's bear and bull paths with every other driver held at
        base — shown beside base EV so the size is readable.</p>
        <div class="scroll"><table>
        <thead><tr><th>Driver</th><th style="text-align:right">unit</th>
        <th style="text-align:right" class="c-bear">bear</th>
        <th style="text-align:right" class="c-base">base</th>
        <th style="text-align:right" class="c-bull">bull</th>
        <th style="text-align:right">EV span (${esc(G.unit)})</th>
        <th style="text-align:right">× base EV</th></tr></thead><tbody>
        ${rows.map(({id, span}) => `<tr><td>${esc(id)}</td>
          <td class="n" style="color:var(--ink-faint);font-size:11.5px">${esc(unitNote(id))}</td>
          ${CASE_ORDER.map(c => `<td class="n ${caseCls(c)}">${driverVal(id, CASES[c].paths[id].slice(-1)[0])}</td>`).join("")}
          <td class="n">${span ? fmt(span) : "—"}</td>
          <td class="n" style="${span && BASE_EV && span / Math.abs(BASE_EV) > 1
            ? "color:var(--block);font-weight:600" : ""}">${
            span && BASE_EV ? (span / Math.abs(BASE_EV)).toFixed(2) + "×" : "—"}</td></tr>`).join("")}
        ${BASE_EV ? `<tr class="tot"><td>Base enterprise value</td><td></td><td></td><td></td><td></td>
          <td class="n">${fmt(BASE_EV)}</td><td class="n">1.00×</td></tr>` : ""}
        </tbody></table></div>
        ${BASE_EV && rows.some(r => r.span / Math.abs(BASE_EV) > 1) ? `<p class="note"
          style="color:var(--block)"><b>At least one driver's span exceeds the whole enterprise
          value.</b> A single assumption swung between its own bear and bull paths moves EV by more
          than the base case is worth. That is the finding, not a formatting artefact: the value
          here is a small residual between large offsetting flows, so it is dominated by the
          assumptions rather than by the business's scale.</p>` : ""}</div>`;
    }
    // 2. The narratives that motivate them.
    out += `<div class="panel"><h2>Case narratives</h2>` +
      CASE_ORDER.filter(k => CASES[k]).map(k =>
        `<div class="conv" style="border-color:${{bear:"var(--block)",base:"var(--brass)",bull:"var(--pass)"}[k]}">
         <b class="${caseCls(k)}">${esc(k)}</b><br>${esc(CASES[k].narrative||"")}</div>`).join("") + `</div>`;
    // 3. Only now the computed effect.
    const ff = comp.footballField;
    if (ff) {
      const band = (lo, base, hi, label, unit, dp) => {
        const span = hi - lo || 1;
        const cols = {Bear:"var(--block)", Base:"var(--brass)", Bull:"var(--pass)"};
        const row = (name, v) => `<tr><td style="color:${cols[name]}">${name}</td>
          <td class="n">${fmt(v, dp)}</td>
          <td style="width:170px"><div class="bar" style="position:relative"><i style="position:absolute;left:${
            ((v - lo) / span * 100).toFixed(1)}%;transform:translateX(-50%);width:3px;height:100%;background:${cols[name]}"></i></div></td></tr>`;
        return `<div class="panel"><h2>${label}</h2><div class="scroll"><table>
          <thead><tr><th>Case</th><th style="text-align:right">${unit}</th>
          <th style="text-align:right">bear → bull</th></tr></thead><tbody>
          ${row("Bear", lo)}${row("Base", base)}${row("Bull", hi)}
          <tr><td style="color:var(--ink-faint);font-size:11px">axis</td><td></td>
          <td style="font-family:var(--mono);font-size:10px;color:var(--ink-faint)">
          <span style="float:left">${fmt(lo, dp)}</span><span style="float:right">${fmt(hi, dp)} ${esc(unit)}</span></td></tr>
          <tr class="tot"><td>Spread</td><td class="n">${fmt(hi - lo, dp)}</td>
          <td class="n">${((hi - lo) / base * 100).toFixed(1)}% of base</td></tr>
          </tbody></table></div></div>`;
      };
      if (typeof ff.perShareBase === "number")
        out += band(ff.perShareLow, ff.perShareBase, ff.perShareHigh,
                    "Effect · value per share", "EUR / share", 2);
      if (typeof ff.evBase === "number")
        out += band(ff.evLow, ff.evBase, ff.evHigh,
                    "Effect · enterprise value", ff.unit || G.unit, 0);
    }
    const clean = Object.entries(TORNADO).map(([d,v]) => ({d, s:v}))
      .filter(r => r.s > 0).sort((a,b) => b.s - a.s);
    if (clean.length) {
      const max = clean[0].s;
      out += `<div class="panel"><h2>Sensitivity · EV span by driver</h2>
        <p class="note">Span is <b>enterprise value in ${esc(G.unit)}</b>: the EV difference between
        that driver's bear and bull paths, every other driver held at base. Base EV is
        <b>${fmt(BASE_EV)} ${esc(G.unit)}</b>, and the last column states each span as a multiple
        of it.</p>
        <div class="scroll"><table>
        <thead><tr><th>Driver</th><th style="text-align:right">EV span (${esc(G.unit)})</th>
        <th style="text-align:right">× base EV</th><th></th></tr></thead><tbody>
        ${clean.map(r => `<tr><td>${esc(r.d)}</td><td class="n">${fmt(r.s)}</td>
          <td class="n" style="${BASE_EV && r.s / Math.abs(BASE_EV) > 1
            ? "color:var(--block);font-weight:600" : ""}">${
            BASE_EV ? (r.s / Math.abs(BASE_EV)).toFixed(2) + "×" : "—"}</td>
          <td style="width:140px"><div class="bar"><i style="width:${(r.s/max*100).toFixed(1)}%"></i></div></td></tr>`).join("")}
        </tbody></table></div>
        <p class="note">Each driver swung bear to bull, every other driver held at base. A span
        larger than base EV is marked: it means the model's value is smaller than the uncertainty
        on a single one of its inputs.</p></div>`;
    }
    return out;
  },

  "Drivers": () => {
    const defs = ((G.drivers || {}).definitions) || [];
    const anch = (G.drivers || {}).anchors || {};
    if (!Object.keys(PATHS0).length && defs.length) {
      return `<div class="panel"><h2>Driver registry · ${esc((G.drivers.registryVersion) || "skeleton")}</h2>
        <p class="note">Definitions and anchors exist; the three case paths and narratives are
        the analyst work still to do, and Scenarios stays empty until the valuation engine runs
        on them. Every anchor carries its basis and source below — read the cautions before
        building paths on top of them.</p>
        <div class="scroll"><table>
        <thead><tr><th>Driver</th><th style="text-align:right">unit</th>
        <th style="text-align:right">anchor</th><th>basis · source</th></tr></thead><tbody>
        ${defs.map(d => { const a = anch[d.id] || {};
          return `<tr><td>${esc(d.id)}<br><span style="color:var(--ink-faint);font-size:11px">${esc(d.label)}</span></td>
          <td class="n" style="color:var(--ink-faint);font-size:11.5px">${esc(unitNote(d.id))}</td>
          <td class="n">${a.value !== undefined ? driverVal(d.id, a.value) : "—"}</td>
          <td style="white-space:normal;font-size:11.5px;color:var(--ink-soft);min-width:220px">${esc(a.basis || "")}${a.source ? ` · <i>${esc(a.source)}</i>` : ""}</td></tr>`; }).join("")}
        </tbody></table></div>
        ${G.drivers._skeleton ? `<p class="note" style="color:var(--wait)">${esc(G.drivers._skeleton)}</p>` : ""}</div>`;
    }
    const table = (ids, withCases) => `<div class="scroll"><table>
      <thead><tr><th>Driver</th><th style="text-align:right">unit</th>
      <th style="text-align:right">anchor</th>
      ${withCases ? CASE_ORDER.map(c => `<th style="text-align:right" class="${caseCls(c)}">${c} FY2029</th>`).join("") : ""}
      </tr></thead><tbody>
      ${ids.map(id => `<tr><td>${esc(id)}</td>
        <td class="n" style="color:var(--ink-faint);font-size:11.5px">${esc(unitNote(id))}</td>
        <td class="n">${driverVal(id, PATHS0[id][0])}</td>
        ${withCases ? CASE_ORDER.map(c => `<td class="n ${caseCls(c)}">${driverVal(id, CASES[c].paths[id].slice(-1)[0])}</td>`).join("") : ""}
        </tr>`).join("")}
      </tbody></table></div>`;
    return `<div class="panel"><h2>Drivers that diverge across cases (${divergingIds.length})</h2>
      ${table(divergingIds, true)}
      <p class="note">Anchor is base-case year one. Every driver carries a value, a source and a
      stated rule in the golden file; the engine refuses to compute otherwise.</p></div>
      <div class="panel"><h2>Drivers held identical in every case (${flatIds.length})</h2>
      ${table(flatIds, false)}
      <p class="note" style="color:var(--wait)">Zero scenario span here is by construction, not
      evidence: no disagreement has been admitted on these drivers. The fragility scan treats
      each as a candidate claim.</p></div>`;
  },

  "Derived scenarios": () => {
    if (!S) return `<div class="panel"><h2>No scenario set yet</h2>
      <p class="note">The threat register is still being curated, so no branch probabilities exist.
      Running <code>scenario_derive.py</code> today refuses at input completeness and lists exactly
      which curator fields are missing. Nothing here is estimated in the meantime.</p></div>`;
    const co = S.coherence, sm = S.sector_map;
    return `<div class="panel"><h2>How to read this table</h2>
      <dl class="kv">
      <dt>locus</dt><dd>WHERE the threat acts. <span class="c-bull">firm</span>: hits this
        subject's position inside its sector — admitted. <span class="c-base">mixed</span>: admitted with a
        note naming the firm-specific part. <span class="c-bear">sector</span>: hits everyone at
        once, demeans away in the sector-relative frame the atlas measures — excluded, never
        scored.</dd>
      <dt>analyst</dt><dd>The curator's evidence-graded probability that the threat bites within
        the ${S.horizon_years}-year horizon. Pure judgment, documented with tiered sources.</dd>
      <dt>base</dt><dd>The empirical prior. No panel of threat-materialisation rates exists yet,
        so each branch draws the atlas erosion envelope split equally — the rate at which
        advantages in this sector die of ALL causes, divided across the named ones. Flagged *.</dd>
      <dt>railed</dt><dd>λ·base + (1−λ)·analyst, λ = ${S.lambda}. The blend that stops one
        strong opinion from outrunning the sector's history: the analyst read is pulled
        ${(S.lambda*100).toFixed(0)}% of the way toward the base rate before it reaches the
        face.</dd>
      </dl></div>
      <div class="panel"><h2>Probability set</h2><div class="scroll"><table>
      <thead><tr><th>Branch</th><th>Locus</th><th style="text-align:right">Analyst</th>
      <th style="text-align:right">Base</th><th style="text-align:right">Railed</th></tr></thead><tbody>
      ${S.branches.map(b => `<tr><td>${esc(b.branch_id)} · ${esc(b.source.label)}</td>
        <td>${esc(b.source.locus || "not recorded")}</td><td class="n">${pct(b.p_analyst)}</td>
        <td class="n">${pct(b.p_base)}${b.default_prior_used ? " *" : ""}</td>
        <td class="n"><b>${pct(b.p_railed)}</b></td></tr>`).join("")}
      <tr class="tot"><td>Base case · ${esc(S.base_case.definition)}</td><td></td><td></td><td></td>
        <td class="n">${pct(S.base_case.p)}</td></tr>
      </tbody></table></div>
      <p class="note">* drawn from the shared cause-agnostic prior, not a threat-specific reference class.</p></div>
      <div class="panel"><h2>Coherence — why these three checks</h2>
      <p class="note"><b>Envelope.</b> The atlas says an advantage in this sector survives a year
      with probability ${(sm.hold*100).toFixed(0)}%, so over ${S.horizon_years} years the chance
      it erodes from ANY cause is 1 − ${sm.hold}^${S.horizon_years} = ${pct(co.erosion_envelope)}.
      Every named threat is a subset of "the advantage erodes", so the named probabilities must
      fit inside that ceiling plus a 5pp tolerance. It is the one empirical rail against
      overclaiming threats.</p>
      <p class="note"><b>Conservation.</b> The base case is defined as the residual — no recorded
      threat bites — so base + branches must return to 100.00% within ±2pp. A breach means a
      probability was edited without its complement.</p>
      <p class="note"><b>Prior sum vs your reads.</b> Σ analyst reads = 60.00% against Σ base =
      ${pct(co.erosion_envelope)}: in aggregate the curator sits on the cause-agnostic rate, and
      the information is in the allocation across threats, not in the level.</p>
      <dl class="kv">
        <dt>Prior sum</dt><dd>${pct(co.prior_sum)}</dd>
        <dt>Erosion envelope</dt><dd>${pct(co.erosion_envelope)} (1 − ${sm.hold}^${S.horizon_years})</dd>
        <dt>Envelope</dt><dd>${esc(co.envelope_status)}</dd>
        <dt>Atlas cell</dt><dd>${esc(sm.atlas_sector)} · φ ${sm.phi} · n ${sm.n} · ${esc(sm.grade)} grade</dd>
        <dt>λ</dt><dd>${S.lambda} on the base rate</dd>
      </dl></div>
      ${S.excluded_threats.length ? `<div class="panel"><h2>Excluded</h2>${
        S.excluded_threats.map(e => `<div class="conv"><b>${esc(e.reason)}</b><br>${esc(e.label)}</div>`).join("")
      }</div>` : ""}`;
  },

  "Lenses": () => {
    const C = STATE.concordance, R = STATE.lensRegister;
    if (!R) return `<div class="panel"><p class="empty">No lens register yet.</p></div>`;
    const side = (e) => e.direction === "supports_thesis"
      ? `<span style="color:var(--pass)">S${e.mass}</span>`
      : `<span style="color:var(--block)">O${e.mass}</span>`;
    let out = "";

    // ---- generic lens idioms: rendered from the register, any subject -------
    const byLens = (l) => R.entries.filter(e => e.lens === l);
    const driversOf = (es) => [...new Set(es.flatMap(e => e.drivers || []))];
    const claimCard = (e) => `<div class="conv" style="border-color:${
      e.direction === "supports_thesis" ? "var(--pass)" : "var(--block)"}">
      <b>${eref(e.entry_id)}${e.locus === "mixed" ? " · mixed locus" : ""}</b><br>
      ${esc(e.claim)}${e.locus_note ? `<br><span style="color:var(--ink-faint)">Locus: ${esc(e.locus_note)}</span>` : ""}</div>`;
    const spanOf = (d) => TORNADO[d] || 0;

    // Fragility as a load path: one node per claim, ordered by the EV span of the
    // driver it lands on, so the heaviest dependence reads first.
    const frag = byLens("fragility");
    if (frag.length) {
      const ordered = [...frag].sort((a, b) =>
        Math.max(...(b.drivers || []).map(spanOf), 0) - Math.max(...(a.drivers || []).map(spanOf), 0));
      out += `<div class="panel"><h2>Fragility · the load path</h2>
        <div class="flow">
          ${ordered.map((e, k) => `${k ? `<div class="farrow">→<small>${
            esc((e.drivers || [])[0] || "")}</small></div>` : ""}
            <div class="fnode" style="border-color:var(--block)">
            <b>${esc(e.entry_id.split("-").pop())}</b>${esc(e.claim.split(":")[0].slice(0, 120))}
            <br>${eref(e.entry_id)}</div>`).join("")}
        </div>
        <p class="note">${frag.length} recorded dependence${frag.length > 1 ? "s" : ""}, ordered by
        the EV span of the driver each lands on. Every node is a claim with a citation; none is
        an inference.</p></div>`;
    }

    // Porter as the five boxes. Unclaimed forces are drawn dashed: a coverage gap
    // made visible rather than filled.
    const FORCES = [["supplier", "Supplier power"], ["buyer", "Buyer power"],
                    ["rivalry", "Rivalry"], ["entrants", "New entrants"],
                    ["substitutes", "Substitutes"]];
    const porter = byLens("porter");
    const forceHit = (key) => porter.concat(frag).filter(e =>
      new RegExp(key === "entrants" ? "entrant|new entry"
               : key === "substitutes" ? "substitut|alternative"
               : key === "supplier" ? "suppl|vendor|foundr|source"
               : key === "buyer" ? "buyer|customer|concentrat"
               : "rival|competitor|monopol|only manufacturer|share", "i").test(e.claim));
    const pbox = (key, label, col, row) => {
      const hits = forceHit(key);
      const sup = hits.some(e => e.direction === "supports_thesis");
      return `<div class="pbox ${hits.length ? (sup ? "sup" : "opp") : "none"}"
        style="grid-column:${col};grid-row:${row}"><b>${label}</b>${
        hits.length ? hits.map(e => `${esc(e.claim.slice(0, 150))} ${eref(e.entry_id)}`).join("<br>")
                    : "no claim registered"}</div>`;
    };
    out += `<div class="panel"><h2>Porter · five forces, firm-relative reading only</h2>
      <div class="porter">
        ${pbox("entrants", "New entrants", 2, 1)}
        ${pbox("supplier", "Supplier power", 1, 2)}
        ${pbox("rivalry", "Rivalry", 2, 2)}
        ${pbox("buyer", "Buyer power", 3, 2)}
        ${pbox("substitutes", "Substitutes", 2, 3)}
      </div>
      <p class="note">Forces are matched to registered claims by mechanism, so a box fills only
      when a cited claim speaks to it. Dashed boxes are coverage gaps, visible rather than filled.
      Sector-level five-forces content demeans away in the closed-set frame; only firm-located
      readings are admitted.</p></div>`;

    // Teece as the appropriability chain, with the atlas regime in the middle.
    const teece = byLens("teece");
    if (teece.length) {
      const sm = S ? S.sector_map : null;
      out += `<div class="panel"><h2>Teece · who keeps the value from the innovation</h2>
        <div class="flow">
          <div class="fnode"><b>Innovation</b>${esc(G.company)}, arena
            ${esc((G.drivers || {}).arena || "unmapped")}.</div>
          <div class="farrow">→<small>appropriability</small></div>
          <div class="fnode"><b>Regime check</b>${sm
            ? `Sector fade φ ${sm.phi}, top-tercile hold ${(sm.hold * 100).toFixed(0)}%/yr — the
               empirical rate at which such advantages decay (atlas, ${esc(sm.grade)} grade).`
            : `No atlas sector mapped yet: the persistence rate this claim should be scored
               against is not on file. Mapping happens in the derivation config.`}</div>
          <div class="farrow">→<small>complementary assets</small></div>
          <div class="fnode" style="border-color:var(--pass)"><b>Complementary asset</b>
            ${esc(teece[0].claim.split(":")[0].slice(0, 160))}<br>${eref(teece[0].entry_id)}</div>
        </div>
        <p class="note">Teece is the one lens the calibration loop can eventually score: it claims
        persistence, and the fade atlas measures persistence.</p></div>`;
    }

    // Capital recovery: the claimed driver plotted across the three cases.
    const cap = byLens("capital_recovery");
    if (cap.length) {
      const d = (cap[0].drivers || [])[0];
      const havePaths = d && CASES.bear && CASES.bear.paths[d];
      out += `<div class="panel"><h2>Capital recovery · commitment vs adoption</h2>
        ${havePaths ? `<div class="scroll"><table>
          <thead><tr><th>${esc(d)}</th>${CASE_ORDER.map(c =>
            `<th style="text-align:right" class="${caseCls(c)}">${c} FY${G.years[G.years.length-1] + (G.drivers.horizonYears || 5)}</th>`).join("")}
            <th style="text-align:right">EV span</th></tr></thead><tbody>
          <tr><td>${esc(unitNote(d))}</td>${CASE_ORDER.map(c =>
            `<td class="n ${caseCls(c)}">${driverVal(d, CASES[c].paths[d].slice(-1)[0])}</td>`).join("")}
            <td class="n">${spanOf(d) ? fmt(spanOf(d)) : "—"}</td></tr>
          </tbody></table></div>` : ""}
        ${cap.map(claimCard).join("")}</div>`;
    }

    // Value curve: the strategy canvas where the scores exist, and the firm's
    // own price/margin ladder either way.
    const vc = byLens("value_curve");
    if (vc.length || VC) {
      const ids = driversOf(vc).filter(id => PATHS0[id] !== undefined);
      out += `<div class="panel"><h2>Value curve · the strategy canvas</h2>
        ${valueCanvas()}
        ${ids.length ? `<h2 style="margin-top:18px">The firm's own price and margin ladder</h2>
          <div class="scroll"><table>
          <thead><tr><th>Driver named by the claim</th><th style="text-align:right">unit</th>
          <th style="text-align:right">anchor</th></tr></thead><tbody>
          ${ids.sort((a,b) => (PATHS0[b][0]||0) - (PATHS0[a][0]||0)).map(id =>
            `<tr><td>${esc(id)}</td>
             <td class="n" style="color:var(--ink-faint);font-size:11.5px">${esc(unitNote(id))}</td>
             <td class="n">${driverVal(id, PATHS0[id][0])}</td></tr>`).join("")}
          </tbody></table></div>
          <p class="note">Level evidence from the firm's own drivers. It says what the subject
          charges; it cannot say what the arena charges, which is what the canvas above is for.</p>`
        : ""}
        ${vc.map(claimCard).join("")}</div>`;
    }

    // Without a threat register there are no branches to land on: show the
    // entries ungrouped rather than crashing or pretending concordance exists.
    if (!C) {
      const side = (e) => e.direction === "supports_thesis"
        ? `<span style="color:var(--pass)">S${e.mass}</span>`
        : `<span style="color:var(--block)">O${e.mass}</span>`;
      const drafts = R.entries.filter(e => e.status === "draft").length;
      return out + `<div class="panel"><h2>Lens claims — ungrouped</h2>
        <p class="note">No threat register exists for this subject yet, so no branch
        mapping and no concordance r can be computed. Claims are shown ungrouped.
        ${drafts ? `<b style="color:var(--wait)">${drafts} of ${R.entries.length}
        entries are draft: proposals awaiting curator sign-off, not citable.</b>` : ""}</p>
        ${R.entries.map(e => `<div class="conv"><b>${side(e)} · ${esc(e.entry_id)} ·
          ${esc(e.lens)} · ${esc(e.locus)} locus · tier ${e.provenance_tier} ·
          ${esc(e.status)}</b><br>${esc(e.claim)}</div>`).join("")}</div>`;
    }

    out += `<div class="panel"><h2>Disagreement engine</h2>
      <p class="note">Each lens makes a claim about a driver, never about a return and never a
      probability. Supporting mass S and opposing mass O per branch give r = min(S,O)/(S+O),
      the same contestedness the calibration ledger rails on.
      ${C.drafts ? `<b style="color:var(--wait)">${C.drafts} of ${C.total} entries are draft:
      proposals awaiting curator sign-off, not citable.</b>` : ""}</p></div>`;
    for (const b of C.branches) {
      const rTxt = b.r === null ? "no claims land here — uncontested by omission"
        : `S = ${b.S} · O = ${b.O} · r = ${b.r.toFixed(2)}
           ${Math.min(b.S,b.O)===0 ? "(one-sided: opposition or support missing, not resolved)"
             : b.r < 0.15 ? "(clean)" : b.r < 0.30 ? "(mixed)" : "(contested)"}`;
      out += `<div class="panel"><h2>${esc(b.branch_id)}</h2>
        <p class="note" style="margin:0 0 8px">${esc(b.label)}</p>
        <p class="note" style="margin:0 0 10px;font-family:var(--mono);font-size:12px">${rTxt}</p>
        ${b.entries.map(e => `<div class="conv"><b>${side(e)} · ${esc(e.entry_id)} ·
          ${esc(e.lens)} · tier ${e.tier} · ${esc(e.status)}</b><br>${esc(e.claim)}</div>`).join("")
        || '<p class="empty">no lens claims attached</p>'}</div>`;
    }
    if (C.unmatched.length) {
      out += `<div class="panel"><h2>Unmatched claims — coverage findings</h2>
        <p class="note">These land on drivers no active branch perturbs. They contest the
        scenario set's coverage, not a branch's probability: either a threat is missing
        from the register, or the claim needs an explicit target branch.</p>
        ${C.unmatched.map(e => `<div class="conv"><b>${esc(e.entry_id)} · ${esc(e.lens)} ·
          lands on ${esc(e.drivers.join(", "))}</b><br>${esc(e.claim)}</div>`).join("")}</div>`;
    }
    return out;
  },

  "Conventions": () => {
    const log = STATE.conventionsLog;
    const byId = Object.fromEntries(((log && log.conventions) || []).map(c => [c.id, c]));
    const decided = Object.values(byId).filter(c => c.status === "decided").length;
    let out = `<div class="panel"><h2>Conventions ledger</h2>
      <p class="note">Each is a question the engine could not settle on its own, travelling with
      the numbers it affects. Resolving one is a three-step loop: the chat may <b>draft</b> a
      resolution, only the curator moves it to <b>decided</b> in the log, and no number on this
      page changes until the owning engine <b>re-runs</b> — the valuation engine for model
      conventions, scenario_derive.py for derivation conventions. This console computes nothing.
      ${log ? `<b style="color:var(--pass)">${decided} decided</b> · <b style="color:var(--wait)">${Object.keys(byId).length - decided} open</b>` : ""}</p></div>`;
    const items = uc.map(c => {
      const t = typeof c === "string" ? c : (c.note || c.text || JSON.stringify(c));
      const m = /^([A-Z]\d+)\s+([\s\S]*)$/.exec(t.trim());
      return {id: m ? m[1] : (c.id || ""), text: m ? m[2] : t};
    });
    // The engine stamps its own list into computed; the log carries entries added
    // afterwards (routings, new findings). Render the union, or later decisions
    // stay invisible on the face.
    const inEngine = new Set(items.map(x => x.id));
    for (const c of Object.values(byId)) {
      if (!inEngine.has(c.id)) items.push({id: c.id, text: c.interim_default || c.resolution || ""});
    }
    for (const it of items) {
      const lg = byId[it.id];
      const chip = lg ? `<span class="status-chip st-${lg.status}">${lg.status}</span>` : "";
      out += `<div class="conv"><b>${esc(it.id)}</b>${chip}
        ${lg && lg.title ? `<span style="color:var(--ink)"> ${esc(lg.title)}</span>` : ""}<br>
        ${esc(it.text)}
        ${lg && lg.resolution ? `<br><span style="color:var(--pass)">Resolution (${esc(lg.decided_on || "")}): ${esc(lg.resolution)}</span>` : ""}
        ${lg && lg.status === "open" && lg.resolution_path ? `<br><span style="color:var(--wait)">To resolve: ${esc(lg.resolution_path)}</span>` : ""}

    return out;

    let out = `<div class="panel"><h2>Three engines and a viewer</h2>

      <tr><td>Valuation</td><td>valuation engine ${esc(comp.engineVersion||"")}</td>
        <td>golden drivers + three pre-registered cases</td>

        <td>outside this console; page shows the stale block until then</td></tr>
      <tr><td>Derivation</td><td>scenario_derive.py (local)</td>
        <td>config + threats + drivers + atlas (+ contradictions)</td>
        <td>scenario_set JSON + face, byte-deterministic, sha256 printed</td>
        <td>local re-run; successor revisions only, never overwrite</td></tr>
      <tr><td>Disagreement</td><td>lens_register.py (local)</td>
        <td>lens register + threat register</td>
        <td>S, O, r per branch; coverage findings</td>
        <td>local re-run; r does not feed the rail without a declared reading</td></tr>
      <tr><td>Display</td><td>this console</td><td>all of the above</td>
        <td>this page + the chat digest</td><td>restart to pick up file changes</td></tr>
      </tbody></table></div></div>`;
    out += `<div class="panel"><h2>Input manifest · sha256</h2>
      <p class="note">The reproducibility anchor: identical hashes mean an identical page. Quote a

      <div class="scroll"><table>
      <thead><tr><th>Role</th><th>File</th><th>sha256</th></tr></thead><tbody>
      ${man.map(m => `<tr><td>${esc(m.role)}</td><td style="font-family:var(--mono);font-size:11.5px">${esc(m.file)}</td>
        <td style="font-family:var(--mono);font-size:11px;color:${m.sha256?"var(--ink-soft)":"var(--block)"}">${m.sha256 ? esc(m.sha256.slice(0,16)) + "…" : "missing"}</td></tr>`).join("")}
      </tbody></table></div></div>`;
    if (cfg) {
      out += `<div class="panel"><h2>Derivation readings in force</h2>

        ${Object.entries(cfg.readings || {}).sort().map(([k,v]) =>
          `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}
        <dt>lambda</dt><dd>${cfg.lambda} on the base rate</dd>
        <dt>horizon</dt><dd>${cfg.horizon_years} years</dd>

    out += `<div class="panel"><h2>The equations that connect the drivers</h2>
      <div class="scroll"><table><tbody>

      <tr><td>EBIT</td><td style="font-family:var(--mono);font-size:12px">GP − opex_pct_revenue × revenue − depreciation</td></tr>

    return out;
  },
};

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("q").value = ""; $("send").disabled = true;
  $("seed").style.display = "none";
  bubble("user", q);
  history.push({role:"user", content:q});
  const pending = bubble("assistant", "thinking");
  pending.querySelector(".body").innerHTML = '<span class="dots"></span>';
  try {
    const r = await fetch("/api/chat", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({messages: history}),
    });
    const d = await r.json();
    pending.remove();
    if (d.error) { bubble("assistant", d.error, "err"); }
    else { bubble("assistant", d.reply); history.push({role:"assistant", content:d.reply}); }
  } catch (err) {
    pending.remove();
    bubble("assistant", "Could not reach the console proxy: " + err.message, "err");
  } finally {
    $("send").disabled = false; $("q").focus();
  }
});
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); }
});
}
</script>
</body>
</html>
