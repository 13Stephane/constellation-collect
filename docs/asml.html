<!doctype html>
<!-- Constellation console. Served by serve_console.py, which injects state and
     proxies chat to the configured provider. The page never holds an API key. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation console</title>
<style>
  :root {
    --ground:#0F2426; --surface:#17383B; --raised:#1D4145; --rule:#2B5054;
    --ink:#F4F0E9; --ink-soft:#AFC3C0; --ink-faint:#7E9895;
    --brass:#C6A553; --brass-bg:#2B3B33;
    --pass:#8FCE9A; --block:#E0A3A3; --wait:#C6A553;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display:grid; grid-template-columns: minmax(0,1fr) 420px;
  }
  @media (max-width: 980px) { body { grid-template-columns: 1fr; } #chat { border-left:none; border-top:1px solid var(--rule); } }

  /* ---- left: the numbers ---- */
  main { overflow-y:auto; padding:26px 30px 60px; }
  h1 { font-family:var(--serif); font-size:22px; font-weight:600; margin:0; }
  h2 { font-family:var(--serif); font-size:16px; font-weight:600; margin:0 0 12px; }
  .eyebrow { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
             text-transform:uppercase; color:var(--ink-faint); }
  .sub { color:var(--ink-soft); margin:8px 0 0; font-size:13.5px; }
  header { border-bottom:2px solid var(--brass); padding-bottom:16px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:3px;
          border:1px solid var(--rule); color:var(--ink-soft); }
  .chip.pass{ color:var(--pass); border-color:transparent; background:#1E3B2C; }
  .chip.block{ color:var(--block); border-color:transparent; background:#3B2325; }
  .chip.wait{ color:var(--wait); border-color:transparent; background:#33301F; }

  nav { display:flex; gap:2px; margin:22px 0 18px; flex-wrap:wrap; }
  nav button {
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:transparent; color:var(--ink-faint); border:1px solid var(--rule);
    padding:7px 13px; cursor:pointer; border-radius:3px;
  }
  nav button:hover { color:var(--ink); border-color:var(--brass); }
  nav button[aria-selected="true"] { color:var(--ground); background:var(--brass);
                                     border-color:var(--brass); font-weight:600; }
  nav button:focus-visible, .ask button:focus-visible, textarea:focus-visible {
    outline:2px solid var(--brass); outline-offset:2px; }

  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
       text-transform:uppercase; color:var(--ink-faint); font-weight:500;
       padding:0 10px 7px 0; border-bottom:1px solid var(--rule); white-space:nowrap; }
  td { padding:7px 10px 7px 0; border-bottom:1px solid rgba(43,80,84,.5);
       font-variant-numeric: tabular-nums; white-space:nowrap; }
  td:first-child, th:first-child { white-space:normal; min-width:190px; }
  td.n { text-align:right; }
  tr.tot td { font-weight:600; border-top:1px solid var(--rule); }

  .panel { background:var(--surface); border:1px solid var(--rule); border-radius:4px;
           padding:16px 18px; margin-bottom:16px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:13px; }
  .kv dt { color:var(--ink-faint); font-family:var(--mono); font-size:11px;
           letter-spacing:.06em; text-transform:uppercase; }
  .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  .note { color:var(--ink-soft); font-size:12.5px; line-height:1.6; margin:10px 0 0; }
  .conv { border-left:2px solid var(--brass); padding:8px 0 8px 12px; margin:12px 0;
          font-size:12.5px; color:var(--ink-soft); }
  .conv b { color:var(--brass); font-family:var(--mono); font-size:11px; }
  .bar { height:6px; background:var(--brass-bg); border-radius:3px; overflow:hidden; min-width:80px; }
  .bar i { display:block; height:100%; background:var(--brass); }
  .empty { color:var(--ink-faint); font-style:italic; font-size:13px; }

  /* ---- right: the conversation ---- */
  #chat { border-left:1px solid var(--rule); background:var(--surface);
          display:flex; flex-direction:column; height:100vh; position:sticky; top:0; }
  #chat header { padding:16px 18px; border-bottom:1px solid var(--rule); border-bottom-width:1px; }
  #log { flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
  .msg { font-size:13.5px; line-height:1.6; }
  .msg .who { font-family:var(--mono); font-size:10px; letter-spacing:.12em;
              text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:5px; }
  .msg.you .body { background:var(--raised); padding:9px 12px; border-radius:4px; }
  .msg.err .body { color:var(--block); font-family:var(--mono); font-size:12px;
                   background:#3B2325; padding:10px 12px; border-radius:4px; white-space:pre-wrap; }
  .msg .body { white-space:pre-wrap; }
  .msg .body table { margin:8px 0; }
  .seed { display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 12px; }
  .seed button { font-size:11.5px; text-align:left; background:transparent; color:var(--ink-soft);
                 border:1px solid var(--rule); padding:6px 10px; border-radius:3px; cursor:pointer; }
  .seed button:hover { border-color:var(--brass); color:var(--ink); }
  .ask { border-top:1px solid var(--rule); padding:12px 18px 16px; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:var(--ground); color:var(--ink);
             border:1px solid var(--rule); border-radius:4px; padding:9px 11px;
             font:inherit; font-size:13.5px; min-height:40px; max-height:160px; }
  .ask button { background:var(--brass); color:var(--ground); border:none; border-radius:4px;
                padding:10px 16px; font-weight:600; cursor:pointer; font-size:13px; }
  .ask button:disabled { opacity:.45; cursor:default; }
  .dots::after { content:"·"; animation: d 1.2s steps(3,end) infinite; }
  @keyframes d { 0%{content:"·"} 33%{content:"· ·"} 66%{content:"· · ·"} }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation:none; content:"· · ·" } }
  .c-bear { color:var(--block); } .c-base { color:var(--brass); } .c-bull { color:var(--pass); }
  .porter { display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:8px; margin-top:6px; }
  .pbox { border:1px solid var(--rule); border-radius:4px; padding:10px 12px; font-size:12px;
          line-height:1.5; color:var(--ink-soft); }
  .pbox b { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
            text-transform:uppercase; margin-bottom:5px; color:var(--ink-faint); }
  .pbox.sup { border-color:var(--pass); }  .pbox.opp { border-color:var(--block); }
  .pbox.none { border-style:dashed; opacity:.65; }
  .flow { display:flex; align-items:stretch; gap:0; flex-wrap:wrap; margin-top:6px; }
  .fnode { flex:1; min-width:150px; border:1px solid var(--rule); border-radius:4px;
           padding:10px 12px; font-size:12px; line-height:1.5; color:var(--ink-soft); }
  .fnode b { display:block; font-size:12.5px; color:var(--ink); margin-bottom:4px; font-family:var(--serif); }
  .farrow { display:flex; flex-direction:column; justify-content:center; padding:0 8px;
            color:var(--brass); font-size:16px; text-align:center; }
  .farrow small { font-size:9.5px; color:var(--ink-faint); font-family:var(--mono); max-width:96px; }
  .status-chip { font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 8px;
                 border-radius:3px; text-transform:uppercase; margin-left:8px; }
  .st-open { background:#33301F; color:var(--wait); }
  .st-decided { background:#1E3B2C; color:var(--pass); }
</style>
</head>
<body>

<main>
  <header>
    <div class="eyebrow">Constellation · console</div>
    <h1 id="firm">—</h1>
    <p class="sub" id="strap">—</p>
    <div class="chips" id="chips"></div>
  </header>

  <nav id="tabs" role="tablist"></nav>
  <div id="view"></div>
</main>

<aside id="chat">
  <header>
    <div class="eyebrow">Conversation</div>
    <div class="sub" id="provider" style="margin-top:6px">—</div>
  </header>
  <div id="log"></div>
  <div class="seed" id="seed"></div>
  <form class="ask" id="ask">
    <textarea id="q" rows="1" placeholder="Ask about these numbers…" aria-label="Ask about these numbers"></textarea>
    <button type="submit" id="send">Ask</button>
  </form>
</aside>

 hit each case's total. Direct lines: IBM +8/+12/+15 percent/yr, Metrology +5/+8/+11 percent/yr by case. REVISABLE, load-bearing assumptions: the High-NA ramp, the 2030 bracket (a Nov-2024 target; check for newer guidance), and the linear path shape. This is a first coherent scenario set, not a researched forecast.", "gross_margin_pct": "ASML Investor Day, November 2024, 2030 model: total net sales of approximately 44 to 60bn at a gross margin of approximately 56 to 60 percent. Restated in the 2024 fourth-quarter and full-year Investor Relations presentation, filed with the SEC as exhibit 99.2 to a Form 6-K on 29 January 2025. BASIS CONVERSION, load-bearing: the Investor Day figure is a REPORTED gross margin; this driver is a HOUSE gross margin, which excludes production depreciation because schema-v2 states depreciation on its own line. FY2024 reported 51.28 percent, house 53.05 percent, wedge 1.77pp (production depreciation 501.5 on revenue 28,262.9). House-basis 2030 targets are therefore 57.77 / 59.77 / 61.77 percent, not 56 / 58 / 60. Applying the guidance unconverted would understate the driver by 1.77pp. RULE: linear interpolation from the FY2024 house actual of 53.05 percent to the house-basis 2030 target over six steps; the model horizon takes the first five. REVISABLE: margin expansion driven by High-NA mix, volume leverage and Installed Base Management growth will not be a straight line. CASE COUPLING: bear takes the low end, bull the high, matching how the Investor Day pairs its revenue and margin scenarios. The revenue tree must later be built to the matching revenue bracket (44 / 52 / 60bn) or the cases become internally inconsistent. CONSERVATIVE IN TWO PLACES: the wedge is held constant at 1.77pp, but capex near 7.9 percent of revenue against depreciation near 3.2 percent means depreciation-to-revenue rises and the wedge widens, so the true house target is above these figures; and the terminal value capitalises from FY2029, before the 2030 target is reached.", "opex_pct_revenue": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: level (18.77, 17.39, 17.90; range 1.38pp). Rule: three-year mean held flat. Covers R&D plus SG&A combined, since schema-v2 has no R&D line. R&D is committed and does not flex with shipments, so this ratio rises in a downcycle. Bear, base and bull are IDENTICAL for this driver. The anchor window contains no downcycle, so the observed range understates the true spread and no spread has been invented. Widen from a longer history (FY2012-13, FY2019) or Investor Day 2030 guidance before stamping.", "dep_pct_prior_ppe": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: trend, down (19.46, 18.59, 16.63; decrements -0.87 then -1.96pp). The decline is mechanical: capex near 8 percent of rising revenue grows PPE faster than depreciation follows, and the ratio should asymptote toward the inverse of average useful life. Rule: hold the FY2024 actual flat, because continuing the trend needs a PPE-growth and asset-life view that is not in this file. Denominated in prior PPE rather than revenue, so it is case-independent and carries one path across all three cases by design, not by omission.", "capex_incl_pct_revenue": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: level (7.28, 8.28, 8.02; range 1.00pp). Rule: three-year mean held flat. House capex is delta(net PPE) plus depreciation. Capex is committed one to two years out, so this ratio rises when revenue falls. Bear, base and bull are IDENTICAL for this driver. The anchor window contains no downcycle, so the observed range understates the true spread and no spread has been invented. Widen from a longer history (FY2012-13, FY2019) or Investor Day 2030 guidance before stamping.", "owc_pct_revenue": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: swing, not level (-6.80, +4.04, -3.68; range 10.84pp on 28.3bn of revenue, i.e. 1.4 to 3bn of FOCF). Rule per O3: three-year mean held flat, with the swing ent/yr, Metrology +5/+8/+11 percent/yr by case. REVISABLE, load-bearing assumptions: the High-NA ramp, the 2030 bracket (a Nov-2024 target; check for newer guidance), and the linear path shape. This is a first coherent scenario set, not a researched forecast.", "ibm_revenue": "Base year one PINNED to FY2025 reported actuals: total net sales 32.7bn, EUV 11.6bn on 48 systems, DUV 12.0bn on 279 systems at 47 percent immersion by units, Metrology and Inspection 0.825bn, Installed Base Management 8.2bn (ASML Q4/FY2025 results). DUV value split by holding dry-DUV ASP flat at the FY2024 13.33 and solving ArFi, giving ArFi 131 units at 76.54; the alternative holds ArFi ASP and flexes dry-DUV. Tree ties to -75 on 32,700 (-0.2 percent). FY2026-FY2029: linear interpolation to the Investor Day 2030 bracket (bear 44 / base 52 / bull 60bn revenue), recorded in scenarios._forwardAnchor. High-NA ramp to FY2030 set by the founder: 10 bear / 25 base / 45 bull systems/yr, the largest lever between cases, starting from ~2-3/yr now. ASP drift: EUV and High-NA +2 percent/yr, DUV flat, ASP being far stickier than volume in this industry. EUV/ArFi/DUV-dry unit paths hold the FY2025 system-revenue mix and flex units to hit each case's total. Direct lines: IBM +8/+12/+15 percent/yr, Metrology +5/+8/+11 percent/yr by case. REVISABLE, load-bearing assumptions: the High-NA ramp, the 2030 bracket (a Nov-2024 target; check for newer guidance), and the linear path shape. This is a first coherent scenario set, not a researched forecast.", "gross_margin_pct": "ASML Investor Day, November 2024, 2030 model: total net sales of approximately 44 to 60bn at a gross margin of approximately 56 to 60 percent. Restated in the 2024 fourth-quarter and full-year Investor Relations presentation, filed with the SEC as exhibit 99.2 to a Form 6-K on 29 January 2025. BASIS CONVERSION, load-bearing: the Investor Day figure is a REPORTED gross margin; this driver is a HOUSE gross margin, which excludes production depreciation because schema-v2 states depreciation on its own line. FY2024 reported 51.28 percent, house 53.05 percent, wedge 1.77pp (production depreciation 501.5 on revenue 28,262.9). House-basis 2030 targets are therefore 57.77 / 59.77 / 61.77 percent, not 56 / 58 / 60. Applying the guidance unconverted would understate the driver by 1.77pp. RULE: linear interpolation from the FY2024 house actual of 53.05 percent to the house-basis 2030 target over six steps; the model horizon takes the first five. REVISABLE: margin expansion driven by High-NA mix, volume leverage and Installed Base Management growth will not be a straight line. CASE COUPLING: bear takes the low end, bull the high, matching how the Investor Day pairs its revenue and margin scenarios. The revenue tree must later be built to the matching revenue bracket (44 / 52 / 60bn) or the cases become internally inconsistent. CONSERVATIVE IN TWO PLACES: the wedge is held constant at 1.77pp, but capex near 7.9 percent of revenue against depreciation near 3.2 percent means depreciation-to-revenue rises and the wedge widens, so the true house target is above these figures; and the terminal value capitalises from FY2029, before the 2030 target is reached.", "opex_pct_revenue": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: level (18.77, 17.39, 17.90; range 1.38pp). Rule: three-year mean held flat. Covers R&D plus SG&A combined, since schema-v2 has no R&D line. R&D is committed and does not flex with shipments, so this ratio rises in a downcycle. Bear, base and bull are IDENTICAL for this driver. The anchor window contains no downcycle, so the observed range understates the true spread and no spread has been invented. Widen from a longer history (FY2012-13, FY2019) or Investor Day 2030 guidance before stamping.", "dep_pct_prior_ppe": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: trend, down (19.46, 18.59, 16.63; decrements -0.87 then -1.96pp). The decline is mechanical: capex near 8 percent of rising revenue grows PPE faster than depreciation follows, and the ratio should asymptote toward the inverse of average useful life. Rule: hold the FY2024 actual flat, because continuing the trend needs a PPE-growth and asset-life view that is not in this file. Denominated in prior PPE rather than revenue, so it is case-independent and carries one path across all three cases by design, not by omission.", "capex_incl_pct_revenue": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: level (7.28, 8.28, 8.02; range 1.00pp). Rule: three-year mean held flat. House capex is delta(net PPE) plus depreciation. Capex is committed one to two years out, so this ratio rises when revenue falls. Bear, base and bull are IDENTICAL for this driver. The anchor window contains no downcycle, so the observed range understates the true spread and no spread has been invented. Widen from a longer history (FY2012-13, FY2019) or Investor Day 2030 guidance before stamping.", "owc_pct_revenue": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: swing, not level (-6.80, +4.04, -3.68; range 10.84pp on 28.3bn of revenue, i.e. 1.4 to 3bn of FOCF). Rule per O3: three-year mean held flat, with the swing belonging in the tornado rather than in a point estimate. Filled from the POLICY column of the anchor sheet, not the legacy column: under a 0.0 cash policy, cash is excess and does not scale with revenue. Customer prepayments in otherNonInterestLiab are the swing: strong bookings push OWC more negative, a downcycle drains them. Bear, base and bull are IDENTICAL for this driver. The anchor window contains no downcycle, so the observed range understates the true spread and no spread has been invented. Widen from a longer history (FY2012-13, FY2019) or Investor Day 2030 guidance before stamping.", "tax_rate": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: trend, up (15.02, 15.81, 18.59). Per open item T1 this is the IMPLIED EFFECTIVE rate from the income lines, NOT assumptions.taxRate of 0.2580, which is near the Dutch statutory rate and overstates tax by roughly 650 per year on FY2024 EBIT. Rule: hold the FY2024 implied rate flat. The climb is consistent with a 15 percent global minimum floor phasing in; if it continues toward statutory, value falls. Case-independent, so one path across all three cases by design.", "other_op_assets_scaling_pct_revenue": "FY2020-FY2024, five years of component data from the yearly balance sheet in the source deck. Scaling remainder as a share of revenue: 16.94, 14.28, 14.03, 13.86, 17.31. Rule: FY2022-FY2024 mean per O2, held flat, with the range going to the tornado. Same treatment as owc_pct_revenue. SUPERSEDES the v0.5 fill of 17.31 percent, which held the FY2024 level flat when only FY2023 and FY2024 were visible; five years show FY2024 is the top of the range, elevated by the loans receivable step that remains unexplained under O4. Identical across bear, base and bull."}}, "bull": {"narrative": "Broad capex supercycle, memory recovery, faster High-NA adoption.", "paths": {"euv_units": [48, 49, 50, 51, 53], "euv_asp": [241.67, 246.5, 251.43, 256.46, 261.59], "highna_units": [0, 9, 18, 27, 36], "highna_asp": [260.0, 265.2, 270.5, 275.91, 281.43], "arfi_units": [131, 137, 143, 150, 156], "arfi_asp": [76.54, 76.54, 76.54, 76.54, 76.54], "duv_dry_units": [148, 155, 162, 169, 176], "duv_dry_asp": [13.33, 13.33, 13.33, 13.33, 13.33], "metrology_revenue": [825.0, 915.8, 1016.5, 1128.3, 1252.4], "ibm_revenue": [8200.0, 9430.0, 10844.5, 12471.2, 14341.9], "gross_margin_pct": [0.545, 0.5596, 0.5741, 0.5887, 0.6032], "opex_pct_revenue": [0.1802, 0.1802, 0.1802, 0.1802, 0.1802], "dep_pct_prior_ppe": [0.1663, 0.1663, 0.1663, 0.1663, 0.1663], "capex_incl_pct_revenue": [0.0786, 0.0786, 0.0786, 0.0786, 0.0786], "owc_pct_revenue": [-0.0215, -0.0215, -0.0215, -0.0215, -0.0215], "tax_rate": [0.1859, 0.1859, 0.1859, 0.1859, 0.1859], "other_op_assets_scaling_pct_revenue": [0.1506, 0.1506, 0.1506, 0.1506, 0.15 h-NA ramp, the 2030 bracket (a Nov-2024 target; check for newer guidance), and the linear path shape. This is a first coherent scenario set, not a researched forecast.", "metrology_revenue": "Base year one PINNED to FY2025 reported actuals: total net sales 32.7bn, EUV 11.6bn on 48 systems, DUV 12.0bn on 279 systems at 47 percent immersion by units, Metrology and Inspection 0.825bn, Installed Base Management 8.2bn (ASML Q4/FY2025 results). DUV value split by holding dry-DUV ASP flat at the FY2024 13.33 and solving ArFi, giving ArFi 131 units at 76.54; the alternative holds ArFi ASP and flexes dry-DUV. Tree ties to -75 on 32,700 (-0.2 percent). FY2026-FY2029: linear interpolation to the Investor Day 2030 bracket (bear 44 / base 52 / bull 60bn revenue), recorded in scenarios._forwardAnchor. High-NA ramp to FY2030 set by the founder: 10 bear / 25 base / 45 bull systems/yr, the largest lever between cases, starting from ~2-3/yr now. ASP drift: EUV and High-NA +2 percent/yr, DUV flat, ASP being far stickier than volume in this industry. EUV/ArFi/DUV-dry unit paths hold the FY2025 system-revenue mix and flex units to hit each case's total. Direct lines: IBM +8/+12/+15 percent/yr, Metrology +5/+8/+11 percent/yr by case. REVISABLE, load-bearing assumptions: the High-NA ramp, the 2030 bracket (a Nov-2024 target; check for newer guidance), and the linear path shape. This is a first coherent scenario set, not a researched forecast.", "ibm_revenue": "Base year one PINNED to FY2025 reported actuals: total net sales 32.7bn, EUV 11.6bn on 48 systems, DUV 12.0bn on 279 systems at 47 percent immersion by units, Metrology and Inspection 0.825bn, Installed Base Management 8.2bn (ASML Q4/FY2025 results). DUV value split by holding dry-DUV ASP flat at the FY2024 13.33 and solving ArFi, giving ArFi 131 units at 76.54; the alternative holds ArFi ASP and flexes dry-DUV. Tree ties to -75 on 32,700 (-0.2 percent). FY2026-FY2029: linear interpolation to the Investor Day 2030 bracket (bear 44 / base 52 / bull 60bn revenue), recorded in scenarios._forwardAnchor. High-NA ramp to FY2030 set by the founder: 10 bear / 25 base / 45 bull systems/yr, the largest lever between cases, starting from ~2-3/yr now. ASP drift: EUV and High-NA +2 percent/yr, DUV flat, ASP being far stickier than volume in this industry. EUV/ArFi/DUV-dry unit paths hold the FY2025 system-revenue mix and flex units to hit each case's total. Direct lines: IBM +8/+12/+15 percent/yr, Metrology +5/+8/+11 percent/yr by case. REVISABLE, load-bearing assumptions: the High-NA ramp, the 2030 bracket (a Nov-2024 target; check for newer guidance), and the linear path shape. This is a first coherent scenario set, not a researched forecast.", "gross_margin_pct": "ASML Investor Day, November 2024, 2030 model: total net sales of approximately 44 to 60bn at a gross margin of approximately 56 to 60 percent. Restated in the 2024 fourth-quarter and full-year Investor Relations presentation, filed with the SEC as exhibit 99.2 to a Form 6-K on 29 January 2025. BASIS CONVERSION, load-bearing: the Investor Day figure is a REPORTED gross margin; this driver is a HOUSE gross margin, which excludes production depreciation because schema-v2 states depreciation on its own line. FY2024 reported 51.28 percent, house 53.05 percent, wedge 1.77pp (production depreciation 501.5 on revenue 28,262.9). House-basis 2030 targets are therefore 57.77 / 59.77 / 61.77 percent, not 56 / 58 / 60. Applying the guidance unconverted would understate the driver by 1.77pp. RULE: linear interpolation from the FY2024 house actual of 53.05 percent to the house-basis 2030 target over six steps; the model horizon takes the first five. REVISABLE: margin expansion driven by High-NA mix, volume leverage and Installed Base Management growth will not be a straight line. CASE COUPLING: bear takes the low end, bull the high, matching how the Investor Day pairs its revenue and margin scenarios. The revenue tree must later be built to the matching revenue bracket (44 / 52 / 60bn) or the cases become internally inconsistent. CONSERVATIVE IN TWO PLACES: the wedge is held constant at 1.77pp, but capex near 7.9 percent of revenue against depreciation near 3.2 percent means depreciation-to-revenue rises and the wedge widens, so the true house target is above these figures; and the terminal value capitalises from FY2029, before the 2030 target is reached.", "opex_pct_revenue": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: level (18.77, 17.39, 17.90; range 1.38pp). Rule: three-year mean held flat. Covers R&D plus SG&A combined, since schema-v2 has no R&D line. R&D is committed and does not flex with shipments, so this ratio rises in a downcycle. Bear, base and bull are IDENTICAL for this driver. The anchor window contains no downcycle, so the observed range understates the true spread and no spread has been invented. Widen from a longer history (FY2012-13, FY2019) or Investor Day 2030 guidance before stamping.", "dep_pct_prior_ppe": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: trend, down (19.46, 18.59, 16.63; decrements -0.87 then -1.96pp). The decline is mechanical: capex near 8 percent of rising revenue grows PPE faster than depreciation follows, and the ratio should asymptote toward the inverse of average useful life. Rule: hold the FY2024 actual flat, because continuing the trend needs a PPE-growth and asset-life view that is not in this file. Denominated in prior PPE rather than revenue, so it is case-independent and carries one path across all three cases by design, not by omission.", "capex_incl_pct_revenue": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: level (7.28, 8.28, 8.02; range 1.00pp). Rule: three-year mean held flat. House capex is delta(net PPE) plus depreciation. Capex is committed one to two years out, so this ratio rises when revenue falls. Bear, base and bull are IDENTICAL for this driver. The anchor window contains no downcycle, so the observed range understates the true spread and no spread has been invented. Widen from a longer history (FY2012-13, FY2019) or Investor Day 2030 guidance before stamping.", "owc_pct_revenue": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: swing, not level (-6.80, +4.04, -3.68; range 10.84pp on 28.3bn of revenue, i.e. 1.4 to 3bn of FOCF). Rule per O3: three-year mean held flat, with the swing belonging in the tornado rather than in a point estimate. Filled from the POLICY column of the anchor sheet, not the legacy column: under a 0.0 cash policy, cash is excess and does not scale with revenue. Customer prepayments in otherNonInterestLiab are the swing: strong bookings push OWC more negative, a downcycle drains them. Bear, base and bull are IDENTICAL for this driver. The anchor window contains no downcycle, so the observed range understates the true spread and no spread has been invented. Widen from a longer history (FY2012-13, FY2019) or Investor Day 2030 guidance before stamping.", "tax_rate": "FY2022-FY2024 anchor window (O2: FY2020-21 excluded). Shape: trend, up (15.02, 15.81, 18.59). Per open item T1 this is the IMPLIED EFFECTIVE rate from the income lines, NOT assumptions.taxRate of 0.2580, which is near the Dutch statutory rate and overstates tax by roughly 650 per year on FY2024 EBIT. Rule: hold the FY2024 implied rate flat. The climb is consistent with a 15 percent global minimum floor phasing in; if it continues toward statutory, value falls. Case-independent, so one path across all three cases by design.", "other_op_assets_scaling_pct_revenue": "FY2020-FY2024, five years of component data from the yearly balance sheet in the source deck. Scaling remainder as a share of revenue: 16.94, 14.28, 14.03, 13.86, 17.31. Rule: FY2022-FY2024 mean per O2, held flat, with the range going to the tornado. Same treatment as owc_pct_revenue. SUPERSEDES the v0.5 fill of 17.31 percent, which held the FY2024 level flat when only FY2023 and FY2024 were visible; five years show FY2024 is the top of the range, elevated by the loans receivable step that remains unexplained under O4. Identical across bear, base and bull."}}}, "triggers": [{"id": "bookings", "observable": "Quarterly net system bookings", "threshold": null, "direction": null, "flipsTo": null, "playbook": null, "resolutions": []}, {"id": "china_mix", "observable": "China as a share of system sales", "threshold": null, "direction": null, "flipsTo": null, "playbook": null, "resolutions": []}, {"id": "highna_ship", "observable": "High-NA systems shipped per period", "threshold": null, "direction": null, "flipsTo": null, "playbook": null, "resolutions": []}, {"id": "memory_capex", "observable": "HBM/DRAM capex announcements", "threshold": null, "direction": null, "flipsTo": null, "playbook": null, "resolutions": []}, {"id": "semi_wfe", "observable": "SEMI WFE spend forecast revisions", "threshold": null, "direction": null, "flipsTo": null, "playbook": null, "resolutions": []}], "_note_triggers": "Nulls here are reported as unarmed but do not block a run. Each armed trigger needs a threshold, a direction, the case it flips to, and a playbook. Resolutions accumulate over time and are the calibration loop.", "_openItems": ["C5 wacc across cases", "C6 discounting timing", "T1 statutory 25.80 vs implied effective 13.7-18.6; the forward tax_rate driver is free of this, slices 1-4 are not", "E2 projected block does not drive interest or tax lines", "E3 operatingCash is total cash, not an operating subset", "E4 FY2024 reclassification inside otherCurrentAssets: current finance receivables 1,379.2 -> 82.6 and current tax assets 1,001.2 -> 283.6. Both feed OWC and are part of the O3 swing", "O2 anchor paths on FY2022-FY2024, not FY2020", "O4 note 26 loans receivable grew 56.8 percent on revenue up 2.5 percent and is 56 percent of the FY2024 otherOperatingAssets step. Read the note before stamping", "O1 RESOLVED v0.5 tight split. O3 RESOLVED v0.6 by filling owc at the three-year mean.", "O6 the tornado swaps one driver's path from bear or bull into an otherwise-base world. Once paths embed operating leverage that combination is internally incoherent: a base-revenue world with bear gross margin does not exist. Useful as a sensitivity ranking, not as a scenario.", "O7 bear = base = bull on all six anchored drivers, so their tornado span is ZERO by construction. The football field spans on revenue-tree variation alone until spreads are sourced.", "O8 terminalGrowth is NOT in the tornado. Only case drivers and the WACC band are swung. Terminal growth is usually among the most sensitive inputs in a five-year explicit DCF and its sensitivity is currently invisible. Add it to the tornado or swing it by hand.", "O9 terminal-value dominance, an acceptance test that can only run once the revenue tree is filled. Five explicit years at WACC 0.10 and g 0.02 will put most of EV in the terminal value (the synthetic fixture ran 77-80 percent). If terminalSharePct exceeds roughly 0.75, switch terminalMethod to fade_then_gordon with fadeYears set, or lengthen the explicit horizon. Both are already supported by the engine.", "O10 the WACC band is the only remaining non-revenue gap and needs a completed /collect run (STATE.md estimates 1-2 USD uninterrupted). Rotate the API key first: it hit a transcript.", "O11 Metrology and Inspection (646 in FY2024) had no home in the three-term tree. Added as a direct term in v0.8. Any arena registry built from a single revenue line will have this class of gap.", "O12 High-NA is not separable from ASML's units table (44 EUV systems is NXE and EXE combined). Fill highna_units at zero for the base year with all EUV in the euv term, or reconstruct from quarterly commentary and say so in the source.", "O14 the model base year is FY2024 but FY2025 is closed and reported at 32.7bn total net sales, up 15.6 percent. Every forward path written now starts from a year that is eighteen months old. Re-basing is a Track A1 job.", "O5 RESOLVED v0.9. O13 RESOLVED v0.9: the 34 percent immersion figure is units.", "O16 the Investor Day 2030 revenue bracket of 44 to 60bn is now recorded in _forwardAnchor. It is ASML's own bear-to-bull span and is the anchor the revenue tree should be built to hit.", "E1 CLOSED v1.0, arithmetically: house GP 14,993.5 less sga 5,059.1 less depreciation 913.5 = 9,020.9 against disclosed income from operations of 9,022.0. Depreciation stripped out of cost of sales 501.5 plus out of opex 410.9 = 912.4 against the depreciation driver's 913.5. costOfSales is depreciation-free and the house mapping reconciles to reported operating income.", "O15 RESOLVED v1.0. gross_margin_pct now paths to the Investor Day range on a house basis.", "O18 the wedge between reported and house gross margin is held constant at 1.77pp. It will widen as PPE grows. Recompute it per year if the margin path becomes load-bearing for a published number.", "O17 CLOSING v1.1: revenue and margin now both vary by case, so the three cases are a coherent set. The six operating-ratio drivers (opex, dep, capex, owc, tax, otherOA) are still bear=base=bull; their tornado span stays zero until sourced spreads exist. The football field is now legitimate.", "O19 the revenue tree pins FY2025 actuals but every OTHER driver still anchors on FY2022-24. The model is therefore half-rebased: FY2025 revenue is real, FY2025 margin/capital ratios are FY2024 estimates. A full /collect re-base (O14) reconciles the two. Acceptable for a first football field; not for a stamped read.", "O20 High-NA is carried as a separate term from FY2026 while FY2025's 48 EUV systems include the 2-3 High-NA already recognised. No double-count (highna_units FY2025 = 0), but the euv_units path is EUV-inclusive-of-High-NA at the base and EUV-exclusive going forward. Clean once /collect splits them at source."], "_baseYearReconciliation": {"year": 2024, "unit": "EUR millions", "modelRevenue": 28262.9, "source": "ASML 2024 fourth-quarter and full-year results, In ": 0.0}]}}}, "scenarioSet": {"base_case": {"definition": "no recorded threat bites", "p": 0.3976}, "branches": [{"bite_indicator": {"observable": "Export-control listings and quarterly China share of system sales (engine trigger china_mix)", "threshold": "Any new listing covering ArFi immersion systems, or China share of system sales declining for four consecutive quarters"}, "branch_id": "BR-ASML-01", "default_prior_used": true, "drivers_perturbed": [{"driver": "arfi_units", "params": {"bite_date": "2027-01-01", "shift_pct": -10.0}, "shape": "level_shift"}], "falsifier": {"condition": "No new export-control listing extending to ArFi immersion tool classes is published by the resolution date, and the China share of system sales reported quarterly has not declined for four consecutive quarters", "resolution_date": "2027-12-31", "source_tier": 1}, "p_analyst": 0.15, "p_base": 0.202, "p_railed": 0.1708, "probability_modifiers": [], "source": {"evidence_ref": "ASML FY2025 Form 20-F (EDGAR 0001628280-26-011378): Risk Factors, 'Our business is subject to a range of export control restrictions, sanctions, tariffs, and broader international trade regulations'; 'Changes in export controls may have a material impact on our business, for example on the sales volume, mix and timing.' Golden file arfi_units case paths.", "label": "China revenue share bites: export regime and local substitution cut DUV immersion units", "locus": "mixed", "locus_note": "The export regime is sector-wide, but ASML is the only vendor whose China exposure sits in DUV immersion, where local substitution is furthest advanced; peers carry the regime risk on a different unit mix.", "moat": "regulatory_position", "provenance_tier": 1, "type": "structural_threat"}}, {"bite_indicator": {"observable": "High-NA systems shipped per period (engine trigger highna_ship)", "threshold": "Cumulative shipments at or below 3 systems at 2026-12-31, at or below the bear pace"}, "branch_id": "BR-ASML-02", "default_prior_used": true, "drivers_perturbed": [{"driver": "highna_units", "params": {"target": 8.0}, "shape": "ramp"}], "falsifier": {"condition": "Cumulative High-NA (EXE) shipments reach at least 10 systems by the resolution date, per ASML quarterly results \u2014 the base-path pace", "resolution_date": "2027-12-31", "source_tier": 1}, "p_analyst": 0.25, "p_base": 0.202, "p_railed": 0.2308, "probability_modifiers": [], "source": {"evidence_ref": "ASML FY2025 Form 20-F: Business Overview, TWINSCAN EXE platform section. Golden file highna_units case paths (cumulative FY2029: bear 8, base 20, bull 36); largest EV span in the tornado (16,301). Lens entry LR-ASML-C01.", "label": "High-NA adoption slips right: EXE ramp lands later than the base path", "locus": "firm", "locus_note": null, "moat": "process_technology", "provenance_tier": 2, "type": "structural_threat"}}, {"bite_indicator": {"observable": "Second-source qualification activity and net system bookings (engine trigger bookings)", "threshold": "Any disclosed qualification or volume order of a competing EUV system at a leading-edge customer"}, "branch_id": "BR-ASML-04", "default_prior_used": true, "drivers_perturbed": [{"driver": "gross_margin_pct", "params": {"sector_mean": 0.5348}, "shape": "fade_path"}], "falsifier": {"condition": "No competing EUV-class lithography system is qualified at a leading-edge logic or memory customer by the resolution date, and house gross margin holds at or above 52% for four consecutive quarters", "resolution_date": "2028-12-31", "source_tier": 2}, "p_analyst": 0.2, "p_base": 0.202, "p_railed": 0.2008, "probability_modifiers": [], "source": {"evidence_ref": "ASML FY2025 Form 20-F: Business Overview (world's only manufacturer of EUV lithography systems). Peer gross margins from latest 10-K XBRL: Applied Materials 48.67% (FY ended 2025-10-26, acc 0001628280-25-056742), Lam Research 50.47% (FY ended 2026-06-28, acc 0000707549-26-000037), KLA 61.30% (FY ended 2026-06-30, acc 0000319201-26-000027); simple mean 53.48%. Basis caveat (convention E1): peer COGS includes depreciation while ASML house GM is depreciation-free, so the like-for-like peer mean is higher and the implied advantage smaller still.", "label": "Monopoly gross margin fades toward the sector as second sources qualify", "locus": "firm", "locus_note": null, "moat": "process_technology", "provenance_tier": 1, "type": "structural_threat"}}], "coherence": {"conservation_tolerance": 0.02, "envelope_status": "pass", "erosion_envelope": 0.6061, "override_justification": null, "prior_sum": 0.6024}, "excluded_threats": [{"label": "WFE downcycle: sector capex contracts and EUV placements slip", "reason": "sector_wide_demeaned"}], "hash_sha256": null, "horizon_years": 5, "lambda": 0.4, "methodology_version": "v16", "provenance": [{"object_id": "asml_golden_schema_v3_2026-07-23", "product_name": "constellation_valuation_track_b", "schema_version": "constellation_model_schema_v3"}, {"object_id": "asml_threat_register_DRAFT", "product_name": "moat_curation", "schema_version": "threat_register_v1"}, {"object_id": "p4_fade_atlas_prototype_v0_1", "product_name": "p4_fade_atlas", "schema_version": "fade_atlas_v0_1"}, {"object_id": "asml_scenario_config_2026-08-11", "product_name": "scenario_derive_config", "schema_version": "scenario_config_v0_1"}], "schema_version": "scenario_set_v0_1", "sector_map": {"atlas_sector": "Business equipment / tech", "grade": "working", "hold": 0.83, "n": 196, "panel": "simfin_2020_2024", "phi": 0.84, "pooled_phi_substituted": false}, "spec_version": "scenario_derivation_spec_v0_1", "subject": {"drivers_file": "asml_drivers.json", "drivers_sha256": "92daa60c41df1560a238a17821dc6bfc154839dd3a6fa2e88b5e8ec2a852adf4", "engine_version": "track_b_0.4", "firm": "ASML Holding NV", "ticker": "ASML"}, "_path": "/Users/stegue/constellation/reads/00_methodology/scenario_sets/scenario_set_v0_1_ASML_r02.json"}, "reading": {"_authored": "Authored 14 Aug 2026, replacing the version hardcoded in console.html. Migrating it to data removes the last company-specific branch from the page renderer.", "title": "ASML, as this model holds it", "lede": ["ASML is the world's only manufacturer of EUV lithography systems, selling into a customer base so concentrated that two buyers take 38% of net sales, through a supply chain that runs on a single optics source, and funded in part by its own customers' prepayments. Revenue ran 13,979 to 28,263 (EUR millions) over FY2020-24.", "The engine's base case values the enterprise at 94,082 in a range of 81,351 to 107,780, or 243.45 per share against 211.08 and 278.28, discounted at a CONSTRUCTED W1 band of 11.28 / 12.70 / 13.75 per cent. That band replaced a 10.0 per cent placeholder on 14 Aug 2026 and took the base case down from 330.53."], "sections": [{"heading": "Main findings", "items": [{"title": "1 \u00b7 Two thirds of the value is beyond the forecast", "body": "66 per cent of enterprise value sits in the terminal: the explicit five years carry 31,711 and the terminal 62,371. This is a valuation carried mostly by what happens after FY2029, which is why the discount rate matters more here than for any other subject in the set, and why the earlier 10.0 per cent placeholder was the most consequential unexamined number in the system."}, {"title": "2 \u00b7 The cost of capital was wrong, and by a lot", "body": "The W1 band is built to wacc_note_v0_1.md \u00a72: peer betas computed from 59 monthly returns against the STOXX Europe 600 over 2021-10 to 2026-08, median arena unlevered beta 1.9594 across Applied Materials, Lam Research, KLA, Teradyne and Onto Innovation, relevered at ASML's own gross debt-to-equity. The risk-free rate is the German 10-year Bund at 2.97 per cent from FRED, matched to the euro cash flows. Moving from 10.0 to 12.70 per cent cut the base case by 26 per cent."}, {"title": "3 \u00b7 Customer concentration and a single optics source", "body": "Two buyers take 38% of net sales and the supply chain runs through one optics supplier. The lens register carries seven claims against this subject, all still draft, and the derived scenario set puts the base case at 39.76 per cent with branches at 17.08 / 23.08 / 20.08."}]}, {"heading": "What a reviewer should contest", "items": [{"title": "An all-US peer basis for a euro-reporting subject", "body": "Every peer in the basis is US-listed and measured against a European index. Tokyo Electron and the Amsterdam names, ASM International and BESI, are the obvious omissions; they were left out because their debt is not in EDGAR and adding a second index would make the median a median of incommensurable numbers. The currency mismatch is held deliberately - betas measured in USD-denominated listings, a risk-free in euro - and recorded in the parameter file rather than hidden."}, {"title": "The band does not widen around beta", "body": "It spans 247 basis points because the note bands the risk-free rate and the equity risk premium only. The regression r-squared runs 0.16 to 0.39 across this basis, so most of each name's monthly variance is unexplained by the index. The arena beta of 1.96 is the softest number in the construction and the band says nothing about it."}, {"title": "Seven lens claims, all signed", "body": "All seven claims on the Lenses tab were signed by St\u00e9phane Guerraz on 14 Aug 2026, so the concordance now rests on attested claims. The derivation specification is still unratified and no scenario set is OTS-stamped, so this remains uncitable in client work for that reason alone."}]}]}, "lensRegister": {"schema_version": "lens_register_v0_1", "subject": {"firm": "ASML Holding NV", "ticker": "ASML"}, "provenance": {"product_name": "lens_register", "object_id": "asml_lens_register_2026-08-11", "schema_version": "lens_register_v0_1"}, "ledger_mapping": {"teece": "moat", "value_curve": "value", "porter": "industry", "capital_recovery": "financial", "fragility": "fragility", "culture": "culture"}, "r_convention": "r = min(S, O) / (S + O); S = mass supporting the registered thesis, O = mass opposing it, per branch over the entries that land on that branch", "entries": [{"entry_id": "LR-ASML-F01", "lens": "fragility", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "All three cases, including bear, hold owc_pct_revenue at -2.15%: the model is funded by customer prepayments in every state of the world. In a real downcycle bookings stall, prepayments unwind, and OWC flips from funding source to cash drain. The bear case understates the swing exactly where it would bite.", "direction": "opposes_thesis", "drivers": ["owc_pct_revenue"], "mass": 3, "magnitude_basis": "owc_pct_revenue identical at -0.0215 across bear/base/bull in the golden file; otherNonInterestLiab (carrying prepayments) grew 5,210 to 15,541 FY2020-FY2024 while revenue doubled; ROUTED 2026-08-11 to convention O3 (owner: valuation engine) \u2014 the trigger is sector demand, so this is bear-case construction, not a derivation branch. Entry retained as the evidence trail.", "evidence_ref": "asml_golden_source.json scenarios.cases.*.paths.owc_pct_revenue; balance.otherNonInterestLiab", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ASML-F02", "lens": "fragility", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "System sales concentrate in very few customers and the concentration is rising: the largest customer took 23.9% of FY2025 total net sales (up from 16.6% in FY2024), and the two largest took 38.0%. Unit paths inherit the capex decisions of two boards; the smooth unit progressions in all three cases assume no single-customer air pocket.", "direction": "opposes_thesis", "drivers": ["euv_units", "arfi_units"], "mass": 3, "magnitude_basis": "Disclosed FY2025 figures: largest customer EUR 7,796.7m = 23.9% of total net sales (FY2024: EUR 4,682.4m = 16.6%); two largest customers = 38.0% of FY2025 total net sales. Cross-checks the golden file: 7,796.7 / 0.239 implies total net sales ~32.6bn, matching the engine's 32,625.", "evidence_ref": "ASML FY2025 Form 20-F, filed 2026-02-25, EDGAR accession 0001628280-26-011378: Risk Factors, heading 'We sell our lithography systems to a relatively small number of customers, making our business vulnerable to customer concentration risk'.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ASML-F03", "lens": "fragility", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "Carl Zeiss SMT is the sole supplier of all critical optics (lenses, mirrors, illuminators, collectors), under an exclusive arrangement. The filing states that a prolonged loss of Zeiss optics production would effectively end ASML's ability to conduct its business. Margin and throughput paths in every case assume uninterrupted single-supplier execution.", "direction": "opposes_thesis", "drivers": ["gross_margin_pct", "euv_units"], "mass": 2, "magnitude_basis": "Issuer's own characterisation is existential, stronger than this entry's proposed mass 2 assumed at drafting; mass is the curator's call at signing. Partial mitigant disclosed in the same filing: ASML holds a 24.9% equity interest in Carl Zeiss SMT Holding GmbH & Co. KG (since 29 June 2017), aligning incentives without removing the single-point-of-failure.", "evidence_ref": "ASML FY2025 Form 20-F, filed 2026-02-25, EDGAR accession 0001628280-26-011378: Risk Factors, heading 'The number of lithography systems we are able to produce is limited by the production capacity of one of our key suppliers, Carl Zeiss SMT'; and Notes to the Consolidated Financial Statements, Equity method investments (24.9% interest, FY2025 profit EUR 216.7m).", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ASML-C01", "lens": "capital_recovery", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "High-NA capacity and R&D are committed ahead of demonstrated adoption: the bear path puts cumulative High-NA shipments at 8 systems by FY2029 against 36 in bull. Capital recovery on the EXE program depends on an adoption ramp the evidence does not yet anchor.", "direction": "opposes_thesis", "drivers": ["highna_units"], "mass": 2, "magnitude_basis": "highna_units terminal-year spread 8/20/36 across cases is the widest relative spread of any unit driver; highna_units carries the largest EV span in the tornado (16,301)", "evidence_ref": "asml_golden_source.json scenarios.cases.*.paths.highna_units; scenarios.computed.tornado", "provenance_tier": 2, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ASML-T01", "lens": "teece", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "The installed base is a complementary asset a margin attacker cannot replicate: Installed Base Management ran 8.2bn in FY2025 (about a quarter of net sales), annuity-like and growing in every case. Even if a second source qualifies on tools, service economics on the existing fleet stay with ASML and cushion the margin fade.", "direction": "supports_thesis", "drivers": ["ibm_revenue"], "target_branch_ids": ["BR-ASML-04"], "mass": 3, "magnitude_basis": "ibm_revenue 8,200 FY2025 anchor, growing to 11,156/12,903/14,342 by FY2029 across bear/base/bull; the fastest-growing revenue term in the bear case (+36.0% vs +15-22% for every system term), because it rides the installed fleet rather than new-system demand", "evidence_ref": "asml_golden_source.json scenarios.cases.*.paths.ibm_revenue; FY2025 actuals in scenarios._forwardAnchor.fy2025Actual", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ASML-V01", "lens": "value_curve", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "The offer curve sits far above the industry on resolution-critical capability: EUV ASP of 241.67 against dry-DUV at 13.33 is an eighteen-fold premium the customer pays voluntarily. Differentiation is carried by the EUV and High-NA terms, not by the mature DUV lines.", "direction": "supports_thesis", "drivers": ["euv_asp", "highna_asp"], "target_branch_ids": ["BR-ASML-04"], "mass": 2, "magnitude_basis": "ASP ratio computed from base-case year-one anchors: euv_asp 241.67, highna_asp 260.00, duv_dry_asp 13.33, arfi_asp 76.54. NOTE: this is price-ladder evidence across ASML's own portfolio, not a Blue Ocean strategy canvas; a canvas in the Kim-Mauborgne sense plots firm vs industry across the factors buyers weigh and needs competitor factor scoring the model does not carry.", "evidence_ref": "asml_golden_source.json scenarios.cases.base.paths (ASP anchors)", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed af erim_default": "W1 mid band held constant across bear/base/bull; WACC swings only in the tornado, to avoid double-counting risk in both cash flows and the rate.", "resolution_path": "Set scenarios.discount.waccByCase in the golden file, then re-run the engine.", "resolution": null, "decided_on": null}, {"id": "C6", "title": "Discounting timing", "owner": "valuation_engine", "status": "open", "interim_default": "End-year discounting.", "resolution_path": "Set scenarios.discount.midYearDiscounting, then re-run the engine.", "resolution": null, "decided_on": null}, {"id": "E3", "title": "Operating vs excess cash", "owner": "collect_extraction", "status": "open", "interim_default": "balance.operatingCash carries the total cash balance; a parameterised cash policy stands in for the split.", "resolution_path": "Have /collect emit operating and excess cash as separate fields in a later schema version.", "resolution": null, "decided_on": null}, {"id": "T1", "title": "Tax basis: statutory vs effective", "owner": "track_a_convention", "status": "open", "interim_default": "assumptions.taxRate (statutory 25.8%) drives slices 1-4 on the historical block; the forward tax_rate driver is set per case per year and is free of this.", "resolution_path": "Decide statutory-vs-effective as a Track A convention applying to every name, then re-extract and re-run.", "resolution": null, "decided_on": null}, {"id": "O1", "title": "Other operating assets as a single ratio", "owner": "valuation_engine", "status": "decided", "interim_default": null, "resolution_path": null, "resolution": "Superseded by drivers.otherOpAssetsModel in engine v0.4: a non-scaling stock plus a scaling remainder. Retained on the face for the record.", "decided_on": "2026-07-23"}, {"id": "O2", "title": "Anchor window", "owner": "valuation_engine", "status": "decided", "interim_default": null, "resolution_path": null, "resolution": "FY2020 is an outlier on OWC and other operating assets and carries no capex or depreciation anchor by construction; driver paths anchor on FY2022-FY2024.", "decided_on": "2026-07-23"}, {"id": "X2", "title": "Slice-4 vs Track B terminal value", "owner": "valuation_engine", "status": "decided", "interim_default": null, "resolution_path": null, "resolution": "Deliberate recorded departure: slice 4 capitalises NOPLAT, Track B capitalises FOCF after five explicit years. The two headline numbers must not be compared naively.", "decided_on": "2026-07-23"}, {"id": "E1", "title": "Depreciation-free cost of sales", "owner": "collect_extraction", "status": "open", "interim_default": "House costOfSales must be depreciation-free since depreciation is stated separately; lifting reported COGS as-is double-counts depreciation and understates EBIT.", "resolution_path": "Add an eval assertion to the /collect agent's extraction checks.", "resolution": null, "decided_on": null}, {"id": "E2", "title": "Projected block coverage", "owner": "valuation_engine", "status": "decided", "interim_default": null, "resolution_path": null, "resolution": "The projected block populates revenue, costOfSales, depreciation and sga only; slices 1-3 must not be pointed at projected years, slice 5 reads scenarios.computed only.", "decided_on": "2026-07-23"}, {"id": "O3", "title": "Bear case holds OWC flat", "owner": "valuation_engine", "status": "open", "interim_default": "owc_pct_revenue is -2.15% of revenue in all three cases: even the bear case retains full customer-prepayment funding.", "resolution_path": "Give the bear case an unwinding OWC path (owc_pct_revenue rising toward positive as bookings stall), then re-run the engine. Routed from lens entry LR-ASML-F01 on 2026-08-11: the trigger is sector demand, so per the locus discipline this is bear-case construction, not a derivation branch.", "resolution": null, "decided_on": null}, {"id": "E4", "title": "No reported cash flow statement in schema v3", "owner": "collect_extraction", "status": "open", "interim_default": "The console derives a cash flow statement by identity from the income statement and balance-sheet deltas. It ties to the change in cash exactly, but the buyback/dividend split and any non-cash reclassifications are not recoverable from deltas.", "resolution_path": "Have /collect emit the reported consolidated statement of cash flows in a later schema version, with a reconciliation assertion against the derived version.", "resolution": null, "decided_on": null}, {"id": "S1", "title": "No one-time margin shock in the v0.1 shape set", "owner": "scenario_derivation_spec", "status": "open", "interim_default": "Spec \u00a73.2 assigns level_shift to volume/unit/share drivers and fade_path to margin drivers. A provisions charge is a one-time margin shift, which neither covers. BR-NVDA-03 uses the mechanism-correct level_shift on gross_margin_pct; the generator accepts it because params are validated per shape, not per driver-shape pair.", "resolution_path": "Either widen \u00a73.2's level_shift applicability to any driver, add a margin_shock shape, or rule that one-time margin events belong in the bear case rather than a branch. Spec-level decision.", "resolution": null, "decided_on": null}, {"id": "V1", "title": "Stock-based compensation: expensed, never added back", "owner": "curator", "status": "decided", "interim_default": "V1: the model charges stock-based compensation in full. The extraction's sga line is the residual that holds EBIT exact (stance E1), so GAAP operating expense including SBC flows into the opex_pct_revenue driver, and every NOPLAT, free cash flow, enterprise value and per-share figure downstream is therefore AFTER stock compensation. There is no add-back anywhere in the chain.", "resolution_path": "Raised 14 Aug 2026 because it is the single largest cause of the gap between these reads and market prices, across every subject in the set. Market and sell-side practice is generally to value these businesses on cash flow with SBC added back. The magnitudes are not marginal: SBC is 24.7% of revenue at Zscaler and 25.0% at Rubrik, and at Zscaler it is sixteen times the reported net loss. NVIDIA last traded at 225.30 against a 52.16 base case; Zscaler's base case implies roughly 1.0bn of equity against a market capitalisation more than an order of magnitude larger. If this convention is wrong, every valuation in the system is wrong in the same direction and by a large factor.", "resolution": "KEEP EXPENSING. Stock compensation is a real transfer of value from owners to employees, and adding it back values a business as though its labour were partly free. THE TREATMENT IS INTERNALLY CONSISTENT AS IT STANDS, and that consistency is the substance of the decision: the model charges the cost through the income statement AND holds shares outstanding flat at the last actual count, so the cost is counted exactly once. Adding SBC back while growing the share count would also count it once; doing both, or neither, would be wrong. WHAT THIS COSTS: subjects with heavy SBC look severely cheap-to-worthless against their market prices, and this model will keep saying so. That is the intended behaviour, not a defect to be tuned away. REVIEW TRIGGERS, any one of which reopens this: (1) a dilution or share-count path is added to the projection \u2014 at that point expensing SBC as well would double-count it, and one of the two must go; (2) the model is used for any claim relative to a market price or a market multiple, rather than as a standalone read, since the comparison is then between two different definitions of earnings; (3) a subject's SBC falls below about 5% of revenue, where the choice stops changing the answer and the convention can be retired for that name; (4) the derivation specification is ratified, at which point every open convention is re-taken anyway.", "decided_on": "2026-08-14"}]}, "deriveConfig": {"subject": {"firm": "ASML Holding NV", "ticker": "ASML", "engine_version": "track_b_0.4", "drivers_file": "asml_drivers.json"}, "horizon_yea }

}

function derivedCF() {
  // Cash flow by IDENTITY from the two statements: every balance line is used
  // exactly once, so the total ties to the change in cash by construction.
  // Not the reported statement — that is absent from schema v3 (convention E4).
  const inc = G.income, bal = G.balance, ys = G.years;
  const ni = ys.map((_, t) => inc.revenue[t] - inc.costOfSales[t] - inc.depreciation[t]
    - inc.sga[t] + inc.interestIncome[t] - inc.interestExpense[t] - inc.incomeTaxes[t]);
  const d = (arr, t) => arr[t] - arr[t - 1];
  const rows = [];
  const push = (label, fn, cls) => rows.push({label, vals: ys.slice(1).map((_, i) => fn(i + 1)), cls});
  push("Net income", t => ni[t]);
  push("+ Depreciation & amortisation", t => inc.depreciation[t]);
  push("− Δ other current operating assets", t => -d(bal.otherCurrentAssets, t));
  push("+ Δ accounts payable & accrued", t => d(bal.accountsPayable, t));
  push("+ Δ other non-interest liabilities (incl. prepayments)", t => d(bal.otherNonInterestLiab, t));
  push("Cash from operations", t => ni[t] + inc.depreciation[t] - d(bal.otherCurrentAssets, t)
    + d(bal.accountsPayable, t) + d(bal.otherNonInterestLiab, t), "tot");
  push("− Capex incl. (Δ net PPE + depreciation)", t => -(d(bal.ppe, t) + inc.depreciation[t]));
  push("− Δ R&D / other operating assets, net", t => -d(bal.otherOperatingAssets, t));
  push("Cash from investing", t => -(d(bal.ppe, t) + inc.depreciation[t]) - d(bal.otherOperatingAssets, t), "tot");
  push("Δ interest-bearing debt", t => d(bal.longTermDebt, t));
  push("Net shareholder flows (Δ equity − net income)", t => d(bal.equity, t) - ni[t]);
  push("Cash from financing", t => d(bal.longTermDebt, t) + d(bal.equity, t) - ni[t], "tot");
  const dcash = t => ni[t] + inc.depreciation[t] - d(bal.otherCurrentAssets, t)
    + d(bal.accountsPayable, t) + d(bal.otherNonInterestLiab, t)
    - (d(bal.ppe, t) + inc.depreciation[t]) - d(bal.otherOperatingAssets, t)
    + d(bal.longTermDebt, t) + d(bal.equity, t) - ni[t];
  push("Δ cash (derived)", dcash, "tot");
  push("Check: derived Δ cash − reported Δ cash", t => dcash(t) - d(bal.operatingCash, t));
  return rows;
}
