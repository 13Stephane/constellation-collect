      ${rows.map(r => `<tr>
        <td class="mono">${r.rank}</td>
        <td><b>${esc(r.ticker)}</b><br><span class="note" style="margin:0">${
          esc((P.declared_basis.find(m => m.ticker === r.ticker) || {}).label || "")}</span></td>
        <td class="num">${big(r.enterprise_value)}</td>
        <td class="num">${n2(r.ev_gross_profit)}</td>
        <td class="num">${n2(r.ln_ev_gross_profit, 4)}</td>
        <td class="num"><b>${sgn(r.position)}</b></td>
        ${(POS.cross_checks_are_never_conserved || []).map(c =>
          `<td class="num">${n2(r[c === "ev_revenue" ? "evRevenue" : c] ?? r[c])}</td>`).join("")}
        <td class="mono">${esc(r.balance_sheet_asof)}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="note">Sum of positions <span class="mono">${sgn(POS.position_sum, 12)}</span>.
      ${esc(POS._identity)}</p>
      <p class="note"><b>Cross-checks are reported and never conserved.</b> Conserving two
      metrics at once would let a forecast satisfy one identity while violating the other,
      and the page would show whichever agreed.</p></div>`;

    out += `<div class="panel"><h2>Order under a defensible convention change</h2>
      <p class="note">Recomputed with operating leases out, which is the one genuinely
      defensible alternative post-ASC 842. An order the convention chose is an order the
      convention can take away.</p>
      <dl class="kv">
        <dt>as declared</dt><dd class="mono">${esc(POS.order.join(" > "))}</dd>
        <dt>ex op-leases</dt><dd class="mono">${esc(POS.order_ex_operating_leases.join(" > "))}</dd>
      </dl>`;
    out += POS.near_ties.length
      ? POS.near_ties.map(f => `<div class="conv"><b class="warn">NEAR-TIE
          ${esc(f.pair.join(" / "))}</b> — gap ${sgn(f.gap)} as declared,
          ${sgn(f.gap_ex_operating_leases)} with operating leases out, against a band of
          ±${P.tolerance.band}. ${f.order_survives
            ? "The order survives the change but the margin does not clear the band."
            : `<span class="flag">The order FLIPS.</span>`}
          Carried as a flagged near-tie, never as a forced order.</div>`).join("")
      : `<p class="note ok">No adjacent pair is convention-sensitive at this band.</p>`;
    return out + `</div>`;
  },

  "Events": () => {
    if (!SET) return `<div class="panel"><h2>No set derived</h2><p class="note">Positions
      exist; no adjacent-pair events have been derived against them. Run
      <span class="mono">program_derive.py</span>.</p></div>`;
    let out = banner + `<div class="panel"><h2>Adjacent-pair events</h2>
      <p class="note">One event per adjacent pair: the lower name overtakes the one above
      it within the horizon. That is the unit because it resolves cleanly —
      <span class="mono">pos(lo) &gt; pos(hi)</span> at T+h, with no threshold to argue
      about — and because it is the one the panel can supply an empirical base rate for.</p>
      <div class="scroll"><table>
      <thead><tr><th>Event</th><th class="num">gap</th><th class="num">base</th>
        <th class="num">p analyst</th><th class="num">S/O</th><th class="num">r</th>
        <th class="num">railed</th><th class="num">mod</th><th class="num">final</th>
      </tr></thead><tbody>
      ${SET.events.map(e => {
        const c = e.concordance, so = (c.S + c.O) ? `${c.S}/${c.O}` : "none";
        return `<tr>
          <td class="mono">${esc(e.event_id)}${e.base_rate.illustrative
            ? ` <span class="flag">⚠</span>` : ""}</td>
          <td class="num">${n2(e.gap, 3)}</td>
          <td class="num">${n2(e.base_rate.value, 3)}</td>
          <td class="num">${n2(e.p_analyst, 3)}</td>
          <td class="num ${(c.S + c.O) ? "" : "warn"}">${so}</td>
          <td class="num">${n2(c.r)}</td>
          <td class="num">${n2(e.p_railed, 3)}</td>
          <td class="num">${e.modifier ? sgn(e.modifier, 2) : "—"}</td>
          <td class="num"><b>${n2(e.p_final, 3)}</b></td></tr>`;
      }).join("")}
      </tbody></table></div>
      <p class="note"><b>S/O sits beside r because a computed 0.50 and a fallback 0.50 rail
      identically and mean opposite things.</b> One is a pair at maximum contestedness; the
      other is a pair nobody has looked at.</p></div>`;

    for (const e of SET.events) {
      const c = e.concordance, br = e.base_rate;
      out += `<div class="panel"><h2>${esc(e.event_id)} — ${n2(e.p_final, 3)}</h2>
        <p class="note">${esc(e.event)}</p>
        ${br.illustrative ? `<div class="conv flag"><b>UNMEASURED BAND.</b>
          ${esc(br.illustrative)}</div>` : ""}
        <dl class="kv">
          <dt>base rate</dt><dd>${n2(br.value, 3)} on the band
            [${br.band[0]}, ${br.band[1]}), n = ${esc(String(br.n))}${
            br.ci95 ? `, 95% CI ${br.ci95[0]}–${br.ci95[1]}` : ""}</dd>
          <dt>estimator</dt><dd>${esc(br.estimator || "—")}</dd>
          ${br.recorded ? `<dt>recorded</dt><dd>${esc(br.recorded)}</dd>` : ""}
          ${(br.cross_checks || []).length ? `<dt>cross-checks</dt><dd>${
            (br.cross_checks || []).map(x => esc(x)).join("<br>")}</dd>` : ""}
          <dt>panel</dt><dd class="mono">${esc((br.panel || {}).file || "—")}</dd>
          <dt>panel caveat</dt><dd>${esc((br.panel || {}).caveat || "—")}</dd>
          <dt>rail</dt><dd class="mono">${esc(e.rail.formula)}</dd>
          <dt>λ, r used</dt><dd>${e.rail.lambda}, ${n2(e.rail.r_used)} →
            factor ${n2(e.rail.factor)} · reading <b>${esc(e.rail.reading)}</b></dd>
          ${e.falsifier ? `<dt>falsifier</dt><dd>${esc(e.falsifier.condition)}
            <br><span class="mono">resolves ${esc(e.falsifier.resolution_date)}</span></dd>` : ""}
        </dl>
        <p class="note">${esc(c.r_source)}</p>
        ${c.landing.length ? `<div class="scroll"><table>
          <thead><tr><th>Claim</th><th>Member</th><th>Lens</th><th class="num">mass</th>
            <th>Side</th><th>Reads as</th></tr></thead><tbody>
          ${c.landing.map(x => `<tr><td class="mono">${esc(x.entry_id)}</td>
            <td>${esc(x.member)}</td><td>${esc(x.lens)}</td>
            <td class="num">${x.mass}</td>
            <td class="${x.side === "S" ? "ok" : "flag"}">${x.side}</td>
            <td>${esc(x.says)}</td></tr>`).join("")}
          </tbody></table></div>` : ""}
        ${c.parked.length ? `<p class="note">Parked: ${
          c.parked.map(x => `<span class="mono">${esc(x.entry_id)}</span>`).join(", ")}
          — ${esc(c.parked[0].why)}. In a closed basis a sector fact is by construction the
          thing that cannot move a relative position: every member is exposed to it.</p>` : ""}
      </div>`;
    }
    return out;
  },

  "Coherence": () => {
    if (!COH) return `<div class="panel"><h2>No coherence reading</h2></div>`;
    const v = COH.verdict;
    let out = `<div class="panel"><h2>Coherence — ${esc(COH.mode)}, ${esc(v)}</h2>
      <p class="note"><b>The mode is derived, never asserted.</b> ${esc(COH.mode_derivation)}
      A register that asserted its own mode would be a register that had decided its own
      gate.</p>
      <dl class="kv">
        <dt>coverage</dt><dd>${COH.carded.length}/${P.declared_basis.length}
          ${COH.uncarded.length ? `· uncarded ${esc(COH.uncarded.join(", "))}` : ""}</dd>
        <dt>Σ expected Δ</dt><dd class="mono">${sgn(COH.sum_expected_delta, 4)}
          against a band of ±${COH.band}</dd>
        <dt>verdict</dt><dd class="${v === "PASS" ? "ok" : v === "RECORDED" ? "warn" : "flag"}">
          <b>${esc(v)}</b></dd>
      </dl>
      <p class="note">${v === "PASS"
        ? "The forecast changes net to zero inside the band, so the set is coherent and the attestation may be stamped at closure. The gate fires at SET CLOSURE, not at any individual card."
        : v === "RECORDED"
        ? "Diagnostic. Below full coverage the un-carded names absorb the residual, so the check is slack. Incoherent partial sets are permitted and are expected to calibrate worse, which is itself the falsifiable test."
        : "The forecasts do not net to zero: some of them have every name out-performing its own basis, which cannot happen."}</p>
      ${SET ? `<p class="note warn">${esc(SET._not_rescaled)}</p>` : ""}</div>`;

    if (SET) out += `<div class="panel"><h2>Where each member is expected to go</h2>
      <p class="note">The three-way vector is conditional on where the name STARTS: a
      ceiling name has room to rise that a floor name does not, so a flat base rate would be
      two different errors in opposite directions. The expected change is
      <span class="mono">(rise − fall) × median |12m move|</span>.</p>
      <div class="scroll"><table>
      <thead><tr><th>Member</th><th>Role</th><th class="num">position</th>
        <th class="num">nearest gap</th><th class="num">rise</th><th class="num">hold</th>
        <th class="num">fall</th><th class="num">E[Δ]</th><th>Band</th></tr></thead><tbody>
      ${SET.members.map(m => `<tr><td><b>${esc(m.ticker)}</b></td>
        <td>${esc(m.role)}</td><td class="num">${sgn(m.position)}</td>
        <td class="num">${n2(m.nearest_gap, 3)}</td>
        <td class="num">${n2(m.three_way.rise)}</td>
        <td class="num">${n2(m.three_way.hold)}</td>
        <td class="num">${n2(m.three_way.fall)}</td>
        <td class="num"><b>${sgn(m.expected_delta, 4)}</b></td>
        <td class="mono">[${m.three_way_source.band[0]}, ${m.three_way_source.band[1]})
          n=${esc(String(m.three_way_source.n))}${
          m.three_way_source.illustrative ? ` <span class="flag">⚠ unmeasured</span>` : ""}</td>
      </tr>`).join("")}
      </tbody></table></div></div>`;

    if (SET) out += `<div class="panel"><h2>Carried limitation</h2>
      <div class="conv warn">${esc(SET._carried_limitation)}</div></div>`;
    return out;
  },

  "Conventions": () => {
    let out = `<div class="panel"><h2>The gross-profit basis</h2>
      <p class="note">Gross profit is the least standardised line in this comparison, and
      the basis floor can otherwise be an accounting policy. It is decided once, applied
      basis-wide, and never mixed.</p>
      <dl class="kv"><dt>gp_basis</dt><dd><b>${esc(P.gp_basis)}</b></dd></dl>
      <p class="note">${esc(P.gp_basis_reasoning)}</p></div>`;

    out += `<div class="panel"><h2>The enterprise-value convention</h2>
      <p class="note">${esc(P.ev_convention.statement)}</p>
      <p class="note">Enterprise value is computed from components and never read from a
      provider's own field, which is what makes the members comparable to each other rather
      than each comparable only to itself.</p></div>`;

    out += `<div class="panel"><h2>The band, and why it is a floor</h2>
      <dl class="kv">
        <dt>tolerance</dt><dd>±${P.tolerance.band} ${esc(P.tolerance.units)}</dd>
        <dt>income window</dt><dd>${esc(P.income_window.basis)}, members within
          ${P.income_window.max_spread_months} month(s) of one another</dd>
      </dl>
      <p class="note">${esc(P.tolerance.derivation)}</p>
      <p class="note warn">A tolerance chosen to make a set cohere is a fitted parameter,
      and setting it after seeing the forecasts is the failure the register exists to
      prevent.</p></div>`;

    out += `<div class="panel"><h2>What this basis is not</h2>
      <p class="note">A basis with no rejected alternative was not chosen; it was arrived
      at.</p>
      ${(P.rejected_alternatives || []).map(r => `<div class="conv"><b>${
        esc(r.alternative)}</b><br>${esc(r.reason)}</div>`).join("")}
      ${(P.satellites || []).length ? `<p class="note">Satellites, carried and carded but
        excluded from the conserved metric: ${(P.satellites || []).map(s =>
        `<b>${esc(s.ticker)}</b> (${esc(s.reason)})`).join("; ")}</p>` : ""}</div>`;

    const prov = STATE.provenance;
    if (prov) out += `<div class="panel"><h2>Where the components came from</h2>
      <p class="note">A transcribed line never passes as a fetched one. No free provider
      publishes operating lease liabilities reliably, its lease rows do not mean what this
      convention means, and its balance sheet is the latest annual column whatever T is —
      so most of an enterprise value is transcribed, and the file says which parts.</p>
      <div class="scroll"><table>
      <thead><tr><th>Member</th><th class="num">fetched</th><th class="num">transcribed</th>
        <th>Transcribed fields</th></tr></thead><tbody>
      ${Object.entries(prov).map(([t, p]) => `<tr><td><b>${esc(t)}</b></td>
        <td class="num">${p.provider}</td><td class="num">${p.curator}</td>
        <td class="mono">${esc(p.fields.join(", ")) || "—"}</td></tr>`).join("")}
      </tbody></table></div></div>`;

    const cav = STATE.componentCaveats;
    if (cav && cav.length) out += `<div class="panel"><h2>Components known to be wrong, and which way</h2>
      <p class="note">A line can be the best read the filing supports and still be
      wrong in a known direction. Each one below carries its direction and its bound,
      because a multiple built on an understated component looks exactly like a clean
      one, and the reader cannot tell unless the page says so.</p>
      <div class="scroll"><table>
      <thead><tr><th>Member</th><th>Field</th><th>Effect</th><th>What is known</th></tr></thead><tbody>
      ${cav.map(c => `<tr><td><b>${esc(c.member)}</b></td>
        <td class="mono">${esc(c.field)}</td>
        <td><span class="flag">${esc(c.effect)}</span></td>
        <td>${esc(c.note)}</td></tr>`).join("")}
      </tbody></table></div></div>`;
    return out;
  },

  "Method": () => {
    let out = `<div class="panel"><h2>Inputs, by hash</h2>
      <p class="note">Same hashes, same page. This is the reproducibility anchor.</p>
      <div class="scroll"><table>
      <thead><tr><th>Role</th><th>File</th><th>sha256</th></tr></thead><tbody>
      ${(STATE.manifest || []).map(m => `<tr><td>${esc(m.role)}</td>
        <td class="mono">${esc(m.file)}</td>
        <td class="mono" style="color:${m.sha256 ? "var(--ink-soft)" : "var(--block)"}">${
          m.sha256 ? esc(m.sha256.slice(0,16)) + "…" : "missing"}</td></tr>`).join("")}
      </tbody></table></div></div>`;

    out += `<div class="panel"><h2>The identity, and what it costs to keep</h2>
      <div class="scroll"><table><tbody>
      <tr><td>Position</td><td class="mono">ln(EV/GP) − mean(ln(EV/GP)) across the basis</td></tr>
      <tr><td>Conservation</td><td class="mono">Σ position = 0 at every date, by construction</td></tr>
      <tr><td>The gate</td><td class="mono">Σ E[Δposition] = 0 ± tolerance, at full coverage</td></tr>
      <tr><td>Overtake</td><td class="mono">pos_lo(T+h) &gt; pos_hi(T+h), i.e. lo out-moves hi by more than gap g</td></tr>
      <tr><td>Rail</td><td class="mono">p_railed = p_base + (p_analyst − p_base)(1 − λ·2r)</td></tr>
      <tr><td>Concordance</td><td class="mono">r = min(S, O) / (S + O) over the pair's lens masses</td></tr>
      </tbody></table></div>
      <p class="note">At r → 0.5 the rail collapses to λ·p_base + (1−λ)·p_analyst, which is
      spec §4.2 exactly and is what <span class="mono">scenario_derive.py</span> evaluates
      for every branch. A scenario branch carries no lens deltas of its own; a PAIR does,
      because both its members have registers. Using the computed r is therefore a DECLARED
      reading${SET ? ` — this set ran <b>${esc((SET.readings || {}).rail_dispersion)}</b>` : ""},
      never a side effect of running a tool.</p></div>`;

    out += `<div class="panel"><h2>Status</h2>
      <p class="note">${P.stamp
        ? `Stamped ${esc(P.stamp.stamped_on)} by ${esc(P.stamp.stamped_by)}.`
        : `<span class="flag">NOT STAMPED.</span> The register fixes the denominator only
           once it is stamped before the first read, so nothing here is citable.`}
      ${SET ? ` Lens entries: ${esc(SET.lens_entries)}. Derived ${esc(SET.derived_at)} as
        ${esc(SET.revision)}; a new revision sits beside the old and never replaces it.` : ""}</p>
      ${P._stamp_note ? `<p class="note">${esc(P._stamp_note)}</p>` : ""}
      <p class="note">This page is a static export. It carries whatever labels the
      underlying objects carry; the exporter never strips them.</p></div>`;
    return out;
  },
};

const tabNames = Object.keys(TABS);
$("tabs").innerHTML = tabNames.map((t,i) =>
  `<button role="tab" aria-selected="${i===0}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
function show(name) {
  $("view").innerHTML = TABS[name]();
  [...$("tabs").children].forEach(b => b.setAttribute("aria-selected", b.dataset.t === name));
  window.scrollTo({top: 0});
}
$("tabs").addEventListener("click", e => { if (e.target.dataset.t) show(e.target.dataset.t); });
show(tabNames[0]);
</script>
</body>
</html>
