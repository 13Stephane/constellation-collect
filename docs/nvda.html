<!doctype html>
<!-- Constellation console. Served by serve_console.py, which injects state and
     proxies chat to the configured provider. The page never holds an API key. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation console</title>
<style>
  :root {
    --ground:#0F2426; --surface:#17383B; --raised:#1D4145; --rule:#2B5054;
    --ink:#F4F0E9; --ink-soft:#AFC3C0; --ink-faint:#7E9895;
    --brass:#C6A553; --brass-bg:#2B3B33;
    --pass:#8FCE9A; --block:#E0A3A3; --wait:#C6A553;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display:grid; grid-template-columns: minmax(0,1fr) 420px;
  }
  /* The narrow-viewport rules live at the END of this stylesheet, not here.
     A media query adds no specificity, so a mobile override written above the
     rule it overrides simply loses the cascade. See the last block in this
     sheet. (And never write a closing style tag inside a CSS comment: the HTML
     parser ends the element on it whatever the CSS says, which silently drops
     every rule below.) */

  /* ---- left: the numbers ---- */
  main { overflow-y:auto; padding:26px 30px 60px; }
  h1 { font-family:var(--serif); font-size:22px; font-weight:600; margin:0; }
  h2 { font-family:var(--serif); font-size:16px; font-weight:600; margin:0 0 12px; }
  .eyebrow { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
             text-transform:uppercase; color:var(--ink-faint); }
  .sub { color:var(--ink-soft); margin:8px 0 0; font-size:13.5px; }
  header { border-bottom:2px solid var(--brass); padding-bottom:16px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:3px;
          border:1px solid var(--rule); color:var(--ink-soft); }
  .chip.pass{ color:var(--pass); border-color:transparent; background:#1E3B2C; }
  .chip.block{ color:var(--block); border-color:transparent; background:#3B2325; }
  .chip.wait{ color:var(--wait); border-color:transparent; background:#33301F; }

  nav { display:flex; gap:2px; margin:22px 0 18px; flex-wrap:wrap; }
  nav button {
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:transparent; color:var(--ink-faint); border:1px solid var(--rule);
    padding:7px 13px; cursor:pointer; border-radius:3px;
  }
  nav button:hover { color:var(--ink); border-color:var(--brass); }
  nav button[aria-selected="true"] { color:var(--ground); background:var(--brass);
                                     border-color:var(--brass); font-weight:600; }
  nav button:focus-visible, .ask button:focus-visible, textarea:focus-visible {
    outline:2px solid var(--brass); outline-offset:2px; }

  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
       text-transform:uppercase; color:var(--ink-faint); font-weight:500;
       padding:0 10px 7px 0; border-bottom:1px solid var(--rule); white-space:nowrap; }
  td { padding:7px 10px 7px 0; border-bottom:1px solid rgba(43,80,84,.5);
       font-variant-numeric: tabular-nums; white-space:nowrap; }
  td:first-child, th:first-child { white-space:normal; min-width:190px; }
  td.n { text-align:right; }
  tr.tot td { font-weight:600; border-top:1px solid var(--rule); }

  .panel { background:var(--surface); border:1px solid var(--rule); border-radius:4px;
           padding:16px 18px; margin-bottom:16px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:13px; }
  .kv dt { color:var(--ink-faint); font-family:var(--mono); font-size:11px;
           letter-spacing:.06em; text-transform:uppercase; }
  .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  .note { color:var(--ink-soft); font-size:12.5px; line-height:1.6; margin:10px 0 0; }
  .conv { border-left:2px solid var(--brass); padding:8px 0 8px 12px; margin:12px 0;
          font-size:12.5px; color:var(--ink-soft); }
  .conv b { color:var(--brass); font-family:var(--mono); font-size:11px; }
  .bar { height:6px; background:var(--brass-bg); border-radius:3px; overflow:hidden; min-width:80px; }
  .bar i { display:block; height:100%; background:var(--brass); }
  .empty { color:var(--ink-faint); font-style:italic; font-size:13px; }

  /* ---- right: the conversation ---- */
  #chat { border-left:1px solid var(--rule); background:var(--surface);
          display:flex; flex-direction:column; height:100vh; position:sticky; top:0; }
  #chat header { padding:16px 18px; border-bottom:1px solid var(--rule); border-bottom-width:1px; }
  #log { flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
  .msg { font-size:13.5px; line-height:1.6; }
  .msg .who { font-family:var(--mono); font-size:10px; letter-spacing:.12em;
              text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:5px; }
  .msg.you .body { background:var(--raised); padding:9px 12px; border-radius:4px; }
  .msg.err .body { color:var(--block); font-family:var(--mono); font-size:12px;
                   background:#3B2325; padding:10px 12px; border-radius:4px; white-space:pre-wrap; }
  .msg .body { white-space:pre-wrap; }
  .msg .body table { margin:8px 0; }
  .seed { display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 12px; }
  .seed button { font-size:11.5px; text-align:left; background:transparent; color:var(--ink-soft);
                 border:1px solid var(--rule); padding:6px 10px; border-radius:3px; cursor:pointer; }
  .seed button:hover { border-color:var(--brass); color:var(--ink); }
  .ask { border-top:1px solid var(--rule); padding:12px 18px 16px; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:var(--ground); color:var(--ink);
             border:1px solid var(--rule); border-radius:4px; padding:9px 11px;
             font:inherit; font-size:13.5px; min-height:40px; max-height:160px; }
  .ask button { background:var(--brass); color:var(--ground); border:none; border-radius:4px;
                padding:10px 16px; font-weight:600; cursor:pointer; font-size:13px; }
  .ask button:disabled { opacity:.45; cursor:default; }
  .dots::after { content:"·"; animation: d 1.2s steps(3,end) infinite; }
  @keyframes d { 0%{content:"·"} 33%{content:"· ·"} 66%{content:"· · ·"} }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation:none; content:"· · ·" } }
  .c-bear { color:var(--block); } .c-base { color:var(--brass); } .c-bull { color:var(--pass); }
  .porter { display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:8px; margin-top:6px; }
  .pbox { border:1px solid var(--rule); border-radius:4px; padding:10px 12px; font-size:12px;
          line-height:1.5; color:var(--ink-soft); }
  .pbox b { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
            text-transform:uppercase; margin-bottom:5px; color:var(--ink-faint); }
  .pbox.sup { border-color:var(--pass); }  .pbox.opp { border-color:var(--block); }
  .pbox.none { border-style:dashed; opacity:.65; }
  .flow { display:flex; align-items:stretch; gap:0; flex-wrap:wrap; margin-top:6px; }
  .fnode { flex:1; min-width:150px; border:1px solid var(--rule); border-radius:4px;
           padding:10px 12px; font-size:12px; line-height:1.5; color:var(--ink-soft); }
  .fnode b { display:block; font-size:12.5px; color:var(--ink); margin-bottom:4px; font-family:var(--serif); }
  .farrow { display:flex; flex-direction:column; justify-content:center; padding:0 8px;
            color:var(--brass); font-size:16px; text-align:center; }
  .farrow small { font-size:9.5px; color:var(--ink-faint); font-family:var(--mono); max-width:96px; }
  .status-chip { font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 8px;
                 border-radius:3px; text-transform:uppercase; margin-left:8px; }
  .st-open { background:#33301F; color:var(--wait); }
  .st-decided { background:#1E3B2C; color:var(--pass); }
  .lnks { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; }
  .lnk { font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; padding:4px 9px;
         border-radius:3px; border:1px solid var(--rule); background:transparent;
         color:var(--brass); cursor:pointer; }
  .lnk:hover { border-color:var(--brass); }
  .lnk.broken { color:var(--block); border-style:dashed; cursor:default;
                text-decoration:line-through; }

  /* ---- review (local only) ----
     The asymmetry is deliberate and it lives in the markup, not only in the
     copy: rejecting is one control, accepting is four. */
  .rv-field { display:block; width:100%; background:var(--ground); color:var(--ink);
              border:1px solid var(--rule); border-radius:3px; padding:8px 10px;
              font:13px/1.5 inherit; margin-top:6px; }
  .rv-field:focus-visible { outline:2px solid var(--brass); outline-offset:1px; }
  .rv-label { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
              text-transform:uppercase; color:var(--ink-faint); }
  .rv-act { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 0; }
  .rv-act button { font-family:var(--mono); font-size:11px; letter-spacing:.06em;
                   text-transform:uppercase; padding:8px 14px; border-radius:3px;
                   border:1px solid var(--rule); background:transparent;
                   color:var(--ink-soft); cursor:pointer; }
  .rv-act button:hover { border-color:var(--brass); color:var(--ink); }
  .rv-act button[aria-pressed="true"] { background:var(--raised); color:var(--ink);
                                        border-color:var(--brass); }
  .rv-go { margin-top:14px; }
  .rv-go button { font-family:var(--mono); font-size:11.5px; letter-spacing:.06em;
                  text-transform:uppercase; padding:9px 16px; border-radius:3px;
                  border:1px solid var(--brass); background:var(--brass);
                  color:var(--ground); font-weight:600; cursor:pointer; }
  .rv-go button[disabled] { background:transparent; color:var(--ink-faint);
                            border-color:var(--rule); cursor:not-allowed; }
  .rv-check { display:block; margin:8px 0; color:var(--ink-soft); font-size:13px; }
  .rv-check input { margin-right:8px; }
  .rv-ev { border-left:2px solid var(--brass); padding:8px 0 8px 12px; margin:12px 0;
           color:var(--ink-soft); font-size:13px; }
  .rv-err { color:var(--block); border:1px solid var(--block); border-radius:3px;
            padding:10px 12px; margin-top:12px; font-size:13px; }
  .rv-bar { height:4px; background:var(--rule); border-radius:2px; overflow:hidden;
            margin:10px 0 4px; }
  .rv-bar i { display:block; height:100%; background:var(--brass); }

  /* ---- narrow viewports, LAST so these actually win --------------------
     One column, and the page scrolls as a DOCUMENT rather than as two
     independent panes. Switching the column count alone was not enough, and
     the failure was invisible on a desktop: html/body carry height:100%,
     #chat carries height:100vh, and main carries overflow-y:auto, which
     resolves its min-height to 0. Stacked, the chat claimed the entire
     viewport and squeezed main down to its header, so a phone opening a
     published page saw the inert conversation pane and nothing else. Every
     height assumption has to be released together.

     These rules sit at the end of the sheet on purpose. A media query adds no
     specificity, so the same block written above #chat's own rule lost the
     cascade and left the pane a full 100vh tall. */
  @media (max-width: 980px) {
    html, body { height:auto; }
    body { grid-template-columns:1fr; }
    /* min-width:0 is the load-bearing one. A grid item defaults to
       min-width:auto, so one wide table inside a panel stretches the whole
       track past the viewport, and then the chips row and the tab bar have
       room they should not have and stop wrapping. The page then overflows
       sideways as a whole instead of the table scrolling inside its own card. */
    main { min-width:0; overflow-y:visible; padding:20px 18px 48px; }
    .panel { overflow-x:auto; }
    #chat { border-left:none; border-top:1px solid var(--rule);
            height:auto; position:static; }
    #log { flex:none; overflow-y:visible; }
  }
</style>
</head>
<body>

<main>
  <header>
    <div class="eyebrow">Constellation · console</div>
    <h1 id="firm">—</h1>
    <p class="sub" id="strap">—</p>
    <div class="chips" id="chips"></div>
  </header>

  <nav id="tabs" role="tablist"></nav>
  <div id="view"></div>
</main>

<aside id="chat">
  <header>
    <div class="eyebrow">Conversation</div>
    <div class="sub" id="provider" style="margin-top:6px">—</div>
  </header>
  <div id="log"></div>
  <div class="seed" id="seed"></div>
  <form class="ask" id="ask">
    <textarea id="q" rows="1" placeholder="Ask about these numbers…" aria-label="Ask about these numbers"></textarea>
    <button type="submit" id="send">Ask</button>
  </form>
</aside>

": {}, "source": "W1 MARKET WACC, constructed per fundamentals-engine/notes/wacc_note_v0_1.md \u00a72, basis frozen at 2026-08-12. CAPM on an arena beta: peer raw betas unlevered at each peer's own structure (AMD 2.4948, AVGO 1.4372, TSM 1.4148, MRVL 2.2892, INTC 2.2664), median unlevered arena beta 2.2664, relevered at the subject's net debt / equity of 0.0017 to 2.2695. Cost of equity 0.1603 at the point; after-tax cost of debt 0.0228; market weights equity 0.9983 / debt 0.0017. Risk-free: US 10-year Treasury constant maturity (FRED series DGS10, Federal Reserve Bank of St Louis), spot 4.68% at 2026-08-12. BAND: the trailing twelve-month range of the same series, 3.97% to 4.75% across 251 observations to 2026-08-12 - an observed range rather than an assumed spread, so the band edge is sourced like the point. Official series, no vendor intermediation. (2026-08-12). ERP: Program-register declaration of 14 Aug 2026: the midpoint of the note's 4.5-5.5% band, taken as the neutral first declaration for the basis. One convention per basis, not per firm (note \u00a72), so this same point applies to ASML and to every later subject until the register is re-declared., point 0.05 within [0.045, 0.055]. Cost of debt: computed from the extraction: FY2026 interest expense 259.0 / average gross debt 8965.0 across FY2025-FY2026 longTermDebt. Debt-only, not lease-inclusive; the note asks for a cross-check against a traded yield where a listed curve exists, which NVIDIA has \u2014 CROSS-CHECK BEFORE LOCKING.. BAND: low and high are rf and ERP at their band edges, 304.4bp wide; beta is not banded, because widening on three parameters at once overstates the interval. Honesty rule (note \u00a75.1): a ROIC-WACC spread inside this band is indistinguishable from zero and must be reported as such.", "_w1": {"as_of": "2026-08-12", "arena_beta_unlevered": 2.2664, "peer_unlevered": [{"ticker": "AMD", "unlevered_beta": 2.4948, "net_debt_over_equity": -0.0093}, {"ticker": "AVGO", "unlevered_beta": 1.4372, "net_debt_over_equity": 0.0256}, {"ticker": "TSM", "unlevered_beta": 1.4148, "net_debt_over_equity": -0.0278}, {"ticker": "MRVL", "unlevered_beta": 2.2892, "net_debt_over_equity": 0.0092}, {"ticker": "INTC", "unlevered_beta": 2.2664, "net_debt_over_equity": 0.0167}], "relevered_beta": 2.2695, "weight_basis": "gross_debt", "subject_debt_over_equity": 0.0017, "subject_net_debt": -1138.0, "weight_equity": 0.9983, "weight_debt": 0.0017, "cost_of_equity_point": 0.1603, "cost_of_debt_after_tax": 0.0228, "waccLow": 0.1416, "waccMid": 0.16, "waccHigh": 0.1721, "band_width_bp": 304.4}, "_superseded": "RECO INTERIM, NOT A W1 CONSTRUCTION: 12.0% flat, no band \u2014 set above the ASML reference 10.0% for higher equity beta, as a reviewable proposal only. The W1 CAPM band per fundamentals-engine/notes/wacc_note_v0_1.md has not been built for NVDA; when it is, it replaces this number and the change is a successor run. No band has been invented: low = mid = high, so the WACC tornado line has zero span by construction. Terminal growth 0.02 = zero long-run real growth at the inflation target; no company-specific basis. C5 settled as one rate across cases; C6 as end-year discounting, both per the ASML precedent."}, "netDebt": {"value": null, "asOf": null, "source": null, "_note": "OPTIONAL OVERRIDE, left null: the engine derives net debt as longTermDebt minus excess cash under the cash policy."}, "computed": {"engineVersion": "0.4", "computedAt": "2026-08-15", "conventions": {"grossProfit": "revenue - costOfSales", "ebitda": "grossProfit - sga", "ebit": "ebitda - depreciation", "noplat": "ebit * (1 - taxRate)", "operatingCash": "revenue * drivers.cashPolicy.operatingCashPctRevenue", "excessCash": "balance.operatingCash - operatingCash", "owc": "(operatingCash + otherCurrentAssets) - (accountsPayable + otherNonInterestLiab)", "investedCapital": "owc + ppe + otherOperatingAssets", "capexIncl": "delta(net ppe) + depreciation", "ppeRoll": "ppe[t] = ppe[t-1] + capexIncl[t] - depreciation[t]", "focf": "noplat + depreciation - deltaOWC - capexIncl - deltaOtherOperatingAssets", "focfIdentity": "equivalently noplat - delta(investedCapital)", "roic": "noplat / prior-year investedCapital", "eva": "(roic - wacc) * prior-year investedCapital", "netDebt": "longTermDebt - excessCash", "ev": "sum(PV of explicit FOCF) + PV of terminal value", "equity": "ev - netDebt"}, "conventionsSource": "constellation-valuation/SKILL.md section 2, plus the v0.3 cash policy", "cashPolicy": {"operatingCashPctRevenue": 0.0, "baseYear": {"year": 2026, "revenue": 215938.0, "ppe": 10383.0, "owc": 74957.0, "cashTotal": 10605.0, "cashOperating": 0.0, "cashExcess": 10605.0, "otherOperatingAssets": 70815.0, "investedCapital": 156155.0, "investedCapitalLegacy": 166760.0}}, "unresolvedConventions": ["C5 WACC across cases. Not addressed by SKILL section 2. Default holds the W1 mid band constant across bear/base/bull and swings WACC only in the tornado, to avoid double-counting risk in both the cash flows and the rate. Set scenarios.discount.waccByCase to override.", "C6 discounting timing. Not addressed by SKILL section 2. End-year by default. Set scenarios.discount.midYearDiscounting to switch.", "X2 departure recorded, deliberate. The slice-4 headline capitalises NOPLAT: NOPLAT * (1+g) / (WACC-g). Track B capitalises FOCF after five explicit years. The two numbers will not agree and must not be compared naively. This is the B3 upgrade.", "E2 the projected block populates revenue, costOfSales, depreciation and sga only. interestIncome, interestExpense and incomeTaxes are not driven, so slices 1 to 3 must not be pointed at projected years. Slice 5 reads scenarios.computed only.", "E1 Cost-of-sales basis [owner: collect_extraction]. Interim default: costOfSales is as reported and may include production depreciation (unlike the depreciation-free ASML reference basis); sga is the residual keeping EBIT exact, so EBIT/NOPLAT and derived cash flows are exact while the gross-margin level is not cross-basis comparable.", "E3 Operating vs excess cash [owner: collect_extraction]. Interim default: operatingCash carries the total cash balance; no operating/excess split exists in XBRL.", "E4 No reported cash flow statement [owner: collect_extraction]. Interim default: no reported cash flow statement emitted; the identity-derived one ties by construction on this mapping.", "T1 Tax basis: statutory vs effective [owner: collect_extraction]. Interim default: assumptions.taxRate = 0.1512 is the EFFECTIVE rate of the latest fiscal year (taxes/pretax); statutory-vs-effective stays open.", "V0 WACC unset [owner: collect_extraction]. Interim default: assumptions.wacc = null: valuation input, never extracted.", "A1 Atlas sector mapping for arena ai-compute-systems [owner: track_a_convention]. Interim default: NVDA maps to Business equipment / tech (phi 0.84, hold 0.83, n 196), the nearest cell and the same one ASML uses; the atlas has no ai-compute-systems cell. Resolution path: Either accept the tech-cell mapping, substitute pooled phi 0.73 if the cell is judged unrepresentative of an accelerated-compute platform, or build an arena cell when the EDGAR 2009+ panel lands. Recorded in inputs/nvda/nvda_config.json atlas_mapping_basis.", "F1 Absolute shocks bounded by a sector-relative envelope [owner: scenario_derivation_spec]. Interim default: Spec \u00a74.3 bounds the sum of branch probabilities by 1 - hold^H, where hold is the atlas top-tercile survival of a RELATIVE ROIC advantage. Three of the four NVDA branches perturb absolute revenue or margin drivers: a top-customer air pocket or an export-control tranche can leave NVDA's position versus the tech sector unchanged while cutting absolute value. Honest marginal reads summed to 1.30 and had to be scaled by 0.53 to fit. The scaling is applied and recorded rather than the envelope being overridden. Resolution path: Either (a) rule that only relative-advantage-erosion branches are bounded by the atlas envelope and absolute shocks are bounded some other way or not at all, (b) build a threat-materialisation base-rate panel per \u00a79 item 3 so p_base stops being the envelope divided, or (c) accept the envelope as a joint-plausibility discipline on marginal reads and say so explicitly in \u00a74.3.", "D1 ROIC against WACC is the spine; ROE and DuPont reintroduce leverage [owner: track_a_convention]. Interim default: The valuation spine is ROIC against the constructed W1 WACC band, which excludes capital structure by construction: it asks whether the operations earn more than the capital costs, whoever supplied it. The Valuation tab also carries a five-step DuPont decomposition, whose equity multiplier puts leverage back in, and return on equity beside it. Both are legitimate and they answer different questions, but presenting them on one face invites reading them as one measure. Interim stance: where the two disagree the valuation follows ROIC, and the page says so in those words. Resolution path: Decide whether return on equity belongs on a valuation face at all, or only in a separate credit-and-returns view. This is a Track A convention: it binds every subject, not the one it was first noticed on. Added 15 Aug 2026 when the Valuation tab was built.", "G1 ROIC is measured on an accounting capital base, which is biased against a company still building [owner: track_a_convention]. Interim default: Invested capital is the accounting base \u2014 operating working capital plus PP&E plus other operating assets \u2014 so growth spending routed through the income statement (customer acquisition, research and development, stock-based compensation) builds an asset the measure cannot see. In the investment phase both terms are understated and the biases do not cancel: the capital charge understates the capital genuinely at risk while NOPLAT understates the earning power being built. The interim stance is to measure on the accounting base for every subject, so the definition is uniform, and to state the bias on the face wherever ROIC is shown rather than adjust for it. Resolution path: Decide whether to carry a second, capitalise-and-amortise basis for growth spending (R&D and sales-and-marketing customer acquisition capitalised over a stated life, amortisation replacing the expense in NOPLAT, the unamortised balance added to invested capital). It would raise both ROIC's numerator and its denominator on ZS and RBRK and leave ASML and NVDA largely unmoved, so it changes cross-subject comparability in both directions and must be decided once for every name. Note the interaction with convention V1: SBC is expensed and shares are held flat so the cost is counted exactly once, and capitalising any part of it reopens that. Raised 15 Aug 2026 when historical ROIC against WACC reached the Valuation tab."], "unresolvedConventionsSource": {"log": "conventions_log.json", "logSubject": "NVIDIA CORP", "engineDefaultsCarried": 4, "engineDefaultsSupersededByLog": [], "subjectEntriesOpen": 9, "rule": "engine-level conventions are subject-agnostic statements about this engine; everything else comes from the subject's own conventions log, and a decided entry drops out."}, "driversSkippedInTornado": [], "cases": {"bear": {"valuation": {"wacc": 0.16, "terminalGrowth": 0.02, "terminalMethod": "gordon", "pvExplicit": 328867.9615876748, "pvFade": 0.0, "terminalValue": 843808.8997997163, "pvTerminal": 401748.39971698355, "terminalSharePct": 0.5498759964799902, "ev": 730616.3613046583, "netDebt": -1138.0, "netDebtBasis": "derived: longTermDebt - excessCash, cash policy 0.0000 of revenue", "equity": 731754.3613046583, "perShare": 30.108392087913856}, "proforma": [{"t": 1, "year": 2027, "revenue": 245991.0, "costOfSales": 73797.30000000002, "grossProfit": 172193.69999999998, "sga": 27059.01, "ebitda": 145134.68999999997, "depreciation": 4360.86, "ebit": 140773.83, "ebitMarginPct": 0.5722722782540824, "noplat": 118250.01719999999, "capexIncl": 8609.685000000001, "ppe": 1 "params": {"sector_mean": 0.5077}, "shape": "fade_path"}], "falsifier": {"condition": "RECO - No competing accelerator or customer-designed silicon reaches disclosed volume deployment at either of the two largest customers, and gross margin holds above 65%, through the resolution date", "resolution_date": "2029-12-31", "source_tier": 2}, "p_analyst": 0.132, "p_base": 0.1515, "p_railed": 0.1398, "probability_modifiers": [], "source": {"evidence_ref": "NVIDIA FY2026 Form 10-K, filed 2026-02-25, EDGAR accession 0001045810-26-000021: Item 1 architecture description of the CUDA platform and its library/SDK stack (the complementary asset the fade would erode; lens entry LR-NVDA-T01, opposed by the competitive reading). Sector mean must be sourced from peer accelerator/compute gross margins at signing, on the same as-reported basis (E1). | RECO SECTOR MEAN: 50.77%, simple mean of four accelerator/compute peers on the same as-reported basis (E1) from latest 10-K XBRL: AMD 49.52% (FY2025-12-27), Broadcom 67.77% (FY2025-11-02), Intel 34.77% (FY2025-12-27), Marvell 51.02% (FY2026-01-31). Spread 34.8-67.8% is wide; the mean is a weak central estimate and the branch is sensitive to it. | SCALED TO THE ENVELOPE 2026-08-13. The first RECO reads (0.25) railed to a sum of 1.0224 against a 0.6561 ceiling, and failed conservation as well (base case -0.0224): four branches cannot sum past 100%. All four were scaled by 0.5303 to the largest set the envelope admits, preserving the relative ordering. THIS IS MECHANICAL, NOT JUDGEMENT: the ordering is asserted, the level is imposed by the rail. The alternative reading is that these are absolute revenue and margin shocks being bounded by a sector-RELATIVE erosion envelope, which is a frame mismatch rather than an over-confident read. Recorded as convention F1. | Trimmed 0.133->0.132: the scaled set exceeded the ceiling by 0.0003 on rounding. The envelope is binding to three basis points here.", "label": "Platform margin fades toward the sector as competing accelerators and customer silicon erode the CUDA switching cost", "locus": "firm", "locus_note": null, "moat": "process_technology", "provenance_tier": 2, "type": "structural_threat"}}], "coherence": {"conservation_tolerance": 0.02, "envelope_status": "pass", "erosion_envelope": 0.6061, "override_justification": null, "prior_sum": 0.6558}, "excluded_threats": [{"label": "Supply-chain constraint: foundry, HBM or CoWoS packaging capacity limits shipments", "reason": "sector_wide_demeaned"}], "hash_sha256": null, "horizon_years": 5, "lambda": 0.4, "methodology_version": "v16", "provenance": [{"object_id": "nvda_golden_schema_v3_2026-08-12", "product_name": "constellation_valuation_track_b", "schema_version": "constellation_model_schema_v3"}, {"object_id": "nvda_threat_register_DRAFT_2026-08-12", "product_name": "moat_curation", "schema_version": "threat_register_v1"}, {"object_id": "p4_fade_atlas_prototype_v0_1", "product_name": "p4_fade_atlas", "schema_version": "fade_atlas_v0_1"}, {"object_id": "nvda_scenario_config_2026-08-12", "product_name": "scenario_derive_config", "schema_version": "scenario_config_v0_1"}], "schema_version": "scenario_set_v0_1", "sector_map": {"atlas_sector": "Business equipment / tech", "grade": "working", "hold": 0.83, "n": 196, "panel": "simfin_2020_2024", "phi": 0.84, "pooled_phi_substituted": false}, "spec_version": "scenario_derivation_spec_v0_1", "subject": {"drivers_file": "nvda_drivers.json", "drivers_sha256": "7fef90fbf7351e4b32496012155f5527e345eaffa209fa16522165023081ad31", "engine_version": "track_b_0.4", "firm": "NVIDIA CORP", "ticker": "NVDA"}, "_path": "/Users/stegue/constellation/reads/00_methodology/scenario_sets/scenario_set_v0_1_NVDA_r03.json"}, "reading": {"_authored": "Authored 14 Aug 2026 from this subject's recorded findings and derived scenario set r01 (generated 13 Aug 2026). Not derivable, and not generated by any tool.", "title": "NVIDIA, as this model holds it", "lede": ["NVIDIA sells accelerated-computing platforms into a market it largely created, through a customer base of extraordinary concentration. Revenue reached 215,938 (USD millions) in FY2026 across five disclosed end markets, of which Data Center is 193,737, or 90%.", "The engine's base case values the enterprise at 1,266,610 in a range of 730,616 to 1,651,492, or 52.16 per share against 30.11 and 68.00. Those figures are DISCOUNTED AT A CONSTRUCTED W1 BAND of 14.16 / 16.00 / 17.21 per cent, not at the 12.0 per cent placeholder this subject carried until 14 Aug 2026. The change cut enterprise value by 31 per cent on its own."], "sections": [{"heading": "Main findings", "items": [{"title": "1 \u00b7 One end market is the company", "body": "datacenter_revenue carries an enterprise-value span of 1,094,417 in the tornado, roughly six times gross margin's 189,271 and fifteen times the opex ratio's 70,470. Every other driver is noise beside it. This is not a diversified platform being valued; it is one demand curve with four rounding errors attached.", "links": [{"tab": "Drivers", "label": "The revenue tree"}, {"tab": "Scenarios", "label": "Case paths"}]}, {"title": "2 \u00b7 The concentration is the fragility, and it is rising", "body": "One direct customer took 22% of FY2026 revenue and another 14%, both primarily in Compute and Networking. The largest was 13% in FY2024. A revenue path here inherits the capital-allocation decisions of two counterparties, and the filing states the trend may continue. Branch BR-NVDA-01 sizes a top-customer air pocket at -12% of Data Center.", "links": [{"tab": "Lenses", "label": "Fragility load path"}]}, {"title": "3 \u00b7 The export regime is a standing condition, not an event", "body": "The FY2026 filing refers to export controls 46 times and names NVIDIA's own A100 and H100 parts as specifically restricted. No case in this model assumes a China Data Center recovery, in any direction. That is a deliberate floor on the bull case as much as the bear.", "links": [{"tab": "Derived scenarios", "label": "Branch probabilities"}]}]}, {"heading": "How this read was railed", "items": [{"title": "The probabilities were scaled, and the scaling is mechanical", "body": "The first analyst reads summed to 1.0224 against an erosion ceiling of 0.6561 and failed conservation as well: four branches cannot sum past 100%. All four were scaled by 0.5303 to the largest set the envelope admits, preserving their relative ordering. The ordering is asserted; the level is imposed by the rail. This is recorded as convention F1, and it is the clearest case in the whole set of a tool refusing an analyst's first answer.", "links": [{"tab": "Derived scenarios", "label": "Envelope and rail"}]}, {"title": "Two branches sit at maximum contestedness", "body": "The concordance puts r = 0.50 on both gross-margin branches, meaning supporting and opposing lens mass are equal. That is the highest disagreement anywhere in these four subjects, and it is a signal to look harder rather than a defect.", "links": [{"tab": "Lenses", "label": "Concordance r per branch"}]}], "note": "Base case 34.42%; four branches at 15.60 / 17.22 / 18.78 / 13.98%; envelope pass. All DRAFT, none stamped."}, {"heading": "Where this model departs from the market, and why", "items": [{"title": "The gap is large and it is method, not arithmetic", "body": "NVIDIA last traded at 225.30 (Yahoo Finance, 14 Aug 2026) against a base case of 52.16. This model expenses stock-based compensation rather than adding it back, measures investment capex-inclusive, and now discounts at a constructed cost of capital of 16.00 per cent rather than the 12.0 per cent interim. Each of those choices moves the answer down, and none of them was chosen to. No input here has been tuned toward the market price.", "links": [{"tab": "Valuation", "label": "Model vs market"}]}, {"title": "The discount rate is no longer a placeholder, and it cost 31 per cent", "body": "The W1 band is built per wacc_note_v0_1.md \u00a72: peer raw betas computed here from 59 monthly returns against the S&P 500 over 2021-10 to 2026-08, unlevered at each peer's own structure, median arena beta 2.2664 across AMD, AVGO, TSM, MRVL and INTC, relevered at NVIDIA's gross debt-to-equity of 0.0017. Cost of equity 16.03 per cent on a risk-free rate of 4.68 per cent from FRED DGS10. Moving from the 12.0 per cent interim to 16.00 per cent took the base case from 75.70 to 52.16 per share. Anyone who read the earlier number read a placeholder.", "links": [{"tab": "Valuation", "label": "Scenario values"}, {"tab": "Method", "label": "W1 construction"}]}, {"title": "What the band does NOT widen", "body": "The band spans 304 basis points because the note bands only the risk-free rate and the equity risk premium. Beta is not banded, and beta is the parameter carrying the most uncertainty here: the regression r-squared is 0.48 for NVIDIA and between 0.26 and 0.35 for every peer, so two thirds or more of each name's monthly variance is unexplained by the index. A reviewer should treat the arena beta of 2.27 as the softest number in this construction.", "links": [{"tab": "Scenarios", "label": "Sensitivity by driver"}]}, {"title": "Where the value sits", "body": "61 per cent of enterprise value is in the terminal: the explicit five years carry 498,202 and the terminal 768,408. That is a normal shape for a going concern and unlike Zscaler and Rubrik, whose explicit periods have negative present value. It does mean the discount rate and the 2 per cent terminal growth assumption carry most of the answer, which is why the placeholder mattered so much and why the band's 304 basis points are the honest width rather than a formality.", "links": [{"tab": "Valuation", "label": "Explicit vs terminal"}]}]}, {"heading": "What this model does not contain", "items": [{"title": "Six lens claims, all signed", "body": "All six claims on the Lenses tab were signed by St\u00e9phane Guerraz on 14 Aug 2026. THE DERIVATION SPECIFICATION WAS RATIFIED on 14 Aug 2026, so this read is citable in client work: the spec permits citation and stamping, and the remaining label on the set is simply that no OTS timestamp has been applied to it yet. Probabilities assume maximum dispersion for every branch, the conservative corner ruled on at \u00a710.1.", "links": [{"tab": "Lenses", "label": "All six claims"}]}]}]}, "specStatus": {"status": "RATIFIED", "detail": "14 August 2026, S", "document": "scenario_derivation_spec_v0_1.md"}, "lensRegister": {"schema_version": "lens_register_v0_1", "subject": {"firm": "NVIDIA CORP", "ticker": "NVDA"}, "provenance": {"product_name": "lens_register", "object_id": "nvda_lens_register_2026-08-12", "schema_version": "lens_register_v0_1"}, "ledger_mapping": {"teece": "moat", "value_curve": "value", "porter": "industry", "capital_recovery": "financial", "fragility": "fragility", "culture": "culture"}, "r_convention": "r = min(S, O) / (S + O); S = mass supporting the registered thesis, O = mass opposing it, per branch over the entries that land on that branch", "entries": [{"entry_id": "LR-NVDA-F01", "lens": "fragility", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "Revenue concentrates in very few direct customers: one took 22% of FY2026 total revenue and another 14%, both primarily attributable to the Compute & Networking segment. Any data-center revenue path inherits the purchasing decisions of a handful of counterparties, and the filing states the trend may continue.", "direction": "opposes_thesis", "drivers": ["datacenter_revenue"], "mass": 3, "magnitude_basis": "Disclosed FY2026 figures: top direct customer 22% of total revenue, second 14% (top two = 36%); concentration is rising fast \u2014 FY2024 disclosed only 13% for the largest. Driver id datacenter_revenue is the anticipated registry id, now named in the registry skeleton.", "evidence_ref": "NVIDIA FY2026 Form 10-K, filed 2026-02-25, EDGAR accession 0001045810-26-000021: risk factor on customer concentration ('sales to one direct customer represented 22% of total revenue and sales to another direct customer represented 14%').", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-NVDA-F02", "lens": "fragility", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "NVIDIA manufactures nothing itself and its supply chain is, per the filing, mainly concentrated in Asia: wafers from TSMC and Samsung, HBM memory from SK Hynix, Micron and Samsung, CoWoS packaging capacity, and assembly at Hon Hai, Wistron and Fabrinet. Dual-sourced at most stages, so weaker than a sole-source dependence, but margin and volume paths assume this chain executes without constraint.", "direction": "opposes_thesis", "drivers": ["gross_margin_pct", "datacenter_revenue"], "mass": 2, "magnitude_basis": "Named-vendor chain disclosed in Item 1; geographic concentration stated by the issuer. Mass 2 rather than 3 because wafers and memory are dual/triple-sourced, unlike the ASML/Zeiss sole-source precedent.", "evidence_ref": "NVIDIA FY2026 Form 10-K, EDGAR accession 0001045810-26-000021: Item 1 manufacturing discussion ('We utilize foundries, such as Taiwan Semiconductor Manufacturing Company Limited... and Samsung... We purchase memory from SK Hynix Inc., Micron Technology, Inc., and Samsung. We utilize CoWoS technology for semiconductor packaging').", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-NVDA-C01", "lens": "capital_recovery", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "Supply is committed ahead of demand at a scale the auditor flags: provisions for excess or obsolete inventory and excess product purchase commitments are the critical audit matter, and those provisions charge cost of sales. If demand steps down, committed supply converts directly into margin damage.", "direction": "opposes_thesis", "drivers": ["gross_margin_pct"], "mass": 3, "magnitude_basis": "The mechanism has fired TWICE at scale: GM fell 64.9% to 56.9% in the FY2023 provisions year, and FY2026 GM (71.1%, down from 75.0%) carries a disclosed $4.5bn charge for H20 excess inventory and purchase obligations. Auditor critical-audit-matter designation per the FY2026 report; commitments in Note 12.", "evidence_ref": "NVIDIA FY2026 Form 10-K, EDGAR accession 0001045810-26-000021: Report of Independent Registered Public Accounting Firm, critical audit matter 'Valuation of Inventories - Provisions for Excess or Obsolete Inventories and Excess Product Purchase Commitments' (Notes 1, 9, 12); internal: inputs/nvda/nvda_golden_source.json income lines.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-NVDA-F03", "lens": "fragility", "channel": "driver", "locus": "mixed", "locus_note": "Export-control regimes are a geopolitical condition, but the controls named in the filing target NVIDIA's specific products (A100 and H100 integrated circuits and systems incorporating them), and licensing decisions are made per company and per part. The firm-specific component is which NVIDIA parts are listed and licensed, not the existence of the regime.", "claim": "A shifting and expanding series of export-control restrictions impacts NVIDIA's ability to serve customers outside the United States, with the company's own A100 and H100 parts specifically named. The data-center revenue path assumes the controlled-market share it embeds remains sellable.", "direction": "opposes_thesis", "drivers": ["datacenter_revenue"], "mass": 3, "magnitude_basis": "46 references to export controls in the FY2026 10-K; the filing's own framing is 'a series of shifting and expanding export control restrictions'. Quantifying the controlled-market share requires the segment/geography disclosure at registry-build time.", "evidence_ref": "NVIDIA FY2026 Form 10-K, EDGAR accession 0001045810-26-000021: risk factors, export-control discussion ('specifically impact our A100 and H100 integrated circuits, DGX or any other systems or boards which incorporate A100 or H100').", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-NVDA-T01", "lens": "teece", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "CUDA is the complementary asset a hardware challenger cannot replicate by building a chip: the filing describes the CUDA development platform running on all NVIDIA GPUs plus hundreds of domain-specific libraries, frameworks, SDKs and APIs. The switching cost sits in the software stack and installed developer base, cushioning both pricing and share against competing accelerators.", "direction": "supports_thesis", "drivers": ["datacenter_revenue", "gross_margin_pct"], "mass": 3, "magnitude_basis": "Issuer's own architecture description: platform plus 'hundreds of domain-specific software libraries, frameworks, algorithms, SDKs, and APIs'. Developer-base and ecosystem-size figures should be pinned from the filing or investor materials at signing to give this mass a quantitative footing.", "evidence_ref": "NVIDIA FY2026 Form 10-K, EDGAR accession 0001045810-26-000021: Item 1, Our Company ('the foundational NVIDIA CUDA development platform that runs on all NVIDIA GPUs, as well as hundreds of domain-specific software libraries, frameworks, algorithms, software development kits...').", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-NVDA-V01", "lens": "value_curve", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "The offer commands software-like margins on silicon: as-reported gross margin of 71.1% in FY2026, having run as high as 75.0%, is far above merchant-semiconductor norms and is direct evidence that buyers pay for the platform, not the part. The differentiation is carried jointly with the CUDA stack (LR-NVDA-T01).", "direction": "supports_thesis", "drivers": ["gross_margin_pct"], "mass": 2, "magnitude_basis": "Own extraction, as-reported basis (E1 stance: COGS includes depreciation, so not comparable with depreciation-free-basis models): GM 64.9 / 56.9 / 72.7 / 75.0 / 71.1% FY2022-26. A Blue Ocean strategy canvas vs named competitors (AMD, custom hyperscaler silicon) would need factor scoring not yet done; this is level evidence, not a canvas.", "evidence_ref": "inputs/nvda/nvda_golden_source.json income.revenue and income.costOfSales, extracted from EDGAR XBRL (manifest sha in the console Method tab).", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}]}, "concordance": eworks, SDKs and APIs. The switching cost sits in the software stack and installed developer base, cushioning both pricing and share against competing accelerators."}, {"entry_id": "LR-NVDA-V01", "lens": "value_curve", "direction": "supports_thesis", "mass": 2, "tier": 1, "status": "signed", "claim": "The offer commands software-like margins on silicon: as-reported gross margin of 71.1% in FY2026, having run as high as 75.0%, is far above merchant-semiconductor norms and is direct evidence that buyers pay for the platform, not the part. The differentiation is carried jointly with the CUDA stack (LR-NVDA-T01)."}]}], "unmatched": [], "drafts": 0, "total": 6}, "conventionsLog": {"schema_version": "conventions_log_v0_1", "subject": {"firm": "NVIDIA CORP", "ticker": "NVDA"}, "provenance": {"product_name": "conventions_log", "object_id": "collect_0001045810", "schema_version": "conventions_log_v0_1"}, "_discipline": "Seeded by collect_statements.py with the stances the extraction took. Only the curator moves a convention to decided.", "conventions": [{"id": "E1", "title": "Cost-of-sales basis", "owner": "collect_extraction", "status": "open", "interim_default": "E1: costOfSales is as reported and may include production depreciation (unlike the depreciation-free ASML reference basis); sga is the residual keeping EBIT exact, so EBIT/NOPLAT and derived cash flows are exact while the gross-margin level is not cross-basis comparable.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "E3", "title": "Operating vs excess cash", "owner": "collect_extraction", "status": "open", "interim_default": "E3: operatingCash carries the total cash balance; no operating/excess split exists in XBRL.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "E4", "title": "No reported cash flow statement", "owner": "collect_extraction", "status": "open", "interim_default": "E4: no reported cash flow statement emitted; the identity-derived one ties by construction on this mapping.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "T1", "title": "Tax basis: statutory vs effective", "owner": "collect_extraction", "status": "open", "interim_default": "T1: assumptions.taxRate = 0.1512 is the EFFECTIVE rate of the latest fiscal year (taxes/pretax); statutory-vs-effective stays open.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "V0", "title": "WACC unset", "owner": "collect_extraction", "status": "open", "interim_default": "assumptions.wacc = null: valuation input, never extracted.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "A1", "title": "Atlas sector mapping for arena ai-compute-systems", "owner": "track_a_convention", "status": "open", "interim_default": "NVDA maps to Business equipment / tech (phi 0.84, hold 0.83, n 196), the nearest cell and the same one ASML uses; the atlas has no ai-compute-systems cell.", "resolution_path": "Either accept the tech-cell mapping, substitute pooled phi 0.73 if the cell is judged unrepresentative of an accelerated-compute platform, or build an arena cell when the EDGAR 2009+ panel lands. Recorded in inputs/nvda/nvda_config.json atlas_mapping_basis.", "resolution": null, "decided_on": null}, {"id": "S1", "title": "No one-time margin shock in the v0.1 shape set", "owner": "curator", "status": "decided", "interim_default": "Spec \u00a73.2 assigns level_shift to volume/unit/share drivers and fade_path to margin drivers. A provisions charge is a one-time margin shift, which neither covers. BR-NVDA-03 uses the mechanism-correct level_shift on gross_margin_pct; the generator accepts it because params are validated per shape, not per driver-shape pair.", "resolution_path": "Raised because level_shift was used on margin and cost-ratio drivers, outside \u00a73.2's stated applicability. Surfaced as a ratification blocker on 14 Aug 2026: \u00a710.5 asks to ratify the shape set as closed, which could not be done honestly while a third of the live corpus breached the applicability column.", "resolution": "CLOSED AT RATIFICATION, 14 Aug 2026. Ratification of scenario_derivation_spec_v0_1 widened \u00a73.2's applicability column for level_shift to include ratio drivers (margin, cost, working-capital and tax ratios). The shape's definition - a one-time shift of X% at the bite date, held thereafter - already described this mechanism exactly; the restriction to volume, unit and share drivers predated the existence of margin-threat branches. Six live branches across NVDA, ZS and RBRK were affected and are now compliant as written. No shape was added, removed or redefined, so \u00a73.2 remains closed at four shapes.", "decided_on": "2026-08-14"}, {"id": "F1", "title": "Absolute shocks bounded by a sector-relative envelope", "owner": "scenario_derivation_spec", "status": "open", "interim_default": "Spec \u00a74.3 bounds the sum of branch probabilities by 1 - hold^H, where hold is the atlas top-tercile survival of a RELATIVE ROIC advantage. Three of the four NVDA branches perturb absolute revenue or margin drivers: a top-customer air pocket or an export-control tranche can leave NVDA's position versus the tech sector unchanged while cutting absolute value. Honest marginal reads summed to 1.30 and had to be scaled by 0.53 to fit. The scaling is applied and recorded rather than the envelope being overridden.", "resolution_path": "Either (a) rule that only relative-advantage-erosion branches are bounded by the atlas envelope and absolute shocks are bounded some other way or not at all, (b) build a threat-materialisation base-rate panel per \u00a79 item 3 so p_base stops being the envelope divided, or (c) accept the envelope as a joint-plausibility discipline on marginal reads and say so explicitly in \u00a74.3.", "resolution": null, "decided_on": null}, {"id": "V1", "title": "Stock-based compensation: expensed, never added back", "owner": "curator", "status": "decided", "interim_default": "V1: the model charges stock-based compensation in full. The extraction's sga line is the residual that holds EBIT exact (stance E1), so GAAP operating expense including SBC flows into the opex_pct_revenue driver, and every NOPLAT, free cash flow, enterprise value and per-share figure downstream is therefore AFTER stock compensation. There is no add-back anywhere in the chain.", "resolution_path": "Raised 14 Aug 2026 because it is the single largest cause of the gap between these reads and market prices, across every subject in the set. Market and sell-side practice is generally to value these businesses on cash flow with SBC added back. The magnitudes are not marginal: SBC is 24.7% of revenue at Zscaler and 25.0% at Rubrik, and at Zscaler it is sixteen times the reported net loss. NVIDIA last traded at 225.30 against a 52.16 base case; Zscaler's base case implies roughly 1.0bn of equity against a market capitalisation more than an order of magnitude larger. If this convention is wrong, every valuation in the system is wrong in the same direction and by a large factor.", "resolution": "KEEP EXPENSING. Stock compensation is a real transfer of value from owners to employees, and adding it back values a business as though its labour were partly free. THE TREATMENT IS INTERNALLY CONSISTENT AS IT STANDS, and that consistency is the substance of the decision: the model charges the cost through the income statement AND holds shares outstanding flat at the last actual count, so the cost is counted exactly once. Adding SBC back while growing the share count would also count it once; doing both, or neither, would be wrong. WHAT THIS COSTS: subjects with heavy SBC look severely cheap-to-worthless against their market prices, and this model will keep saying so. That is the intended behaviour, not a defect to be tuned away. REVIEW TRIGGERS, any one of which reopens this: (1) a dilution or share-count path is added to the projection \u2014 at that point expensing SBC as well would double-count it, and one of the two must go; (2) the model is used for any claim relative to a market price or a market multiple, rather than as a standalone read, since the comparison is then between two different definitions of earnings; (3) a subject's SBC falls below about 5% of revenue, where the choice stops changing the answer and the convention can be retired for that name; (4) the derivation specification is ratified, at which point every open convention is re-taken anyway.", "decided_on": "2026-08-14"}, {"id": "D1", "title": "ROIC against WACC is the spine; ROE and DuPont reintroduce leverage", "owner": "track_a_convention", "status": "open", "interim_default": "The valuation spine is ROIC against the constructed W1 WACC band, which excludes capital structure by construction: it asks whether the operations earn more than the capital costs, whoever supplied it. The Valuation tab also carries a five-step DuPont decomposition, whose equity multiplier puts leverage back in, and return on equity beside it. Both are legitimate and they answer different questions, but presenting them on one face invites reading them as one measure. Interim stance: where the two disagree the valuation follows ROIC, and the page says so in those words.", "resolution_path": "Decide whether return on equity belongs on a valuation face at all, or only in a separate credit-and-returns view. This is a Track A convention: it binds every subject, not the one it was first noticed on. Added 15 Aug 2026 when the Valuation tab was built.", "resolution": null, "decided_on": null}, {"id": "G1", "title": "ROIC is measured on an accounting capital base, which is biased against a company still building", "owner": "track_a_convention", "status": "open", "interim_default": "Invested capital is the accounting base \u2014 operating working capital plus PP&E plus other operating assets \u2014 so growth spending routed through the income statement (customer acquisition, research and development, stock-based compensation) builds an asset the measure cannot see. In the investment phase both terms are understated and the biases do not cancel: the capital charge understates the capital genuinely at risk while NOPLAT understates the earning power being built. The interim stance is to measure on the accounting base for every subject, so the definition is uniform, and to state the bias on the face wherever ROIC is shown rather than adjust for it.", "resolution_path": "Decide whether to carry a second, capitalise-and-amortise basis for growth spending (R&D and sales-and-marketing customer acquisition capitalised over a stated life, amortisation replacing the expense in NOPLAT, the unamortised balance added to invested capital). It would raise both ROIC's numerator and its denominator on ZS and RBRK and leave ASML and NVDA largely unmoved, so it changes cross-subject comparability in both directions and must be decided once for every name. Note the interaction with convention V1: SBC is expensed and shares are held flat so the cost is counted exactly once, and capitalising any part of it reopens that. Raised 15 Aug 2026 when historical ROIC against WACC reached the Valuation tab.", "resolution": null, "decided_on": null}]}, "marketSnapshot": {"_what": "The market's price for this subject, for comparison against the model's enterprise value. NOT an input to any computation in the pipeline: nothing is tuned toward it.", "_tier": "TIER 3. Yahoo Finance is an unofficial endpoint with no service guarantee. It is not a filing and is not filing-grade. Every figure here carries its retrieval date and must be labelled tier 3 wherever it is shown beside filing-derived numbers.", "provider": "Yahoo Finance via yfinance 1.6.0", "retrieved_at": "2026-08-15", "ticker": "NVDA", "firm": "NVIDIA CORP", "currency": "USD", "modelUnit": "USD millions", "currencyMatchesModel": true, "currencyNote": "listing prices in USD, model reports in USD millions: matched.", "lastPrice": {"value":
