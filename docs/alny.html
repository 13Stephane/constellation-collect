  CONSTELLATION CARD RENDERER  (v0.9 layout · concordance rail · v0.7 taxonomy)
  ------------------------------------------------------------------------
  HOW TO USE
  1. This file renders ONE locked read into the v0.9 poster, from the READ
     object below. To render another name, replace READ and reload.
  2. The poster is DERIVED. The stamp binds the locked .md, never this HTML.
     Re-rendering enriches the HTML without changing the stamped file or hash.
  3. Curator-judgment fields are marked  // CURATOR  . The renderer does no
     judgment: it lays out what the curator locked, and DERIVES the concordance
     (S, O, r) deterministically from the locked deltas so it cannot drift.

  CALIBRATION MERGE (baked in, per amzn_card_calibration_merge_spec.md)
  - base rate comes from the v0.7 ledger for the PINNED resolution, not a prior
  - de-hype is held SIGN-ONLY (no calibrated magnitude)
  - each moat dot carries its own {evidence, tier} tag (thread 5)
  - v1.0 (cn-ext-2026-08-28, E2): a moat dot scored reinforcing claims a FENCE and
    carries fence_origin {built|granted} + clock_type {technical|commercial|regulatory-political}
    on face. Any granted fence puts the standing limitation on face, never in a footnote.
    Magnitudes withheld: no half-life is rendered, computed, or stored.
  - headline is labelled P(call correct), a confidence not a magnitude

  CONCORDANCE RAIL (v0.9, per calibration_ledger_spec_v0_9.md §3)
  - the renderer parses the seven locked deltas, sums with-call mass S and
    against-call mass O, and derives the opposing share r = O / (S + O)
  - effective lens net = lensNetRaw · g · (1 − λ · 2r), with RAIL = {λ, g} below
  - probability = baseRate + dehype + effective lens net (the rail shrinks a
    contested net toward the base rate; it never flips the call)
  - r and the support/oppose mass are shown in a Concordance panel beside de-hype
  - a console warning fires if the locked probability and the railed probability
    disagree by more than half a point, so a pre-rail read is flagged to relock
-->

      "src": "segment margin, first-profit disclosure (T1)"
    }
  ],
  "stamp": {
    "sha": "sha256(locked .md) — computed at lock",
    "ots": "locked_read.md.ots — OpenTimestamps anchor to Bitcoin (non-retroactive)",
    "author": "S. Guerraz, CFA, MBA",
    "note": "The stamp binds the locked .md, never this poster. The poster is a derived rendering; re-rendering enriches the HTML without changing the stamped file or its hash. Corrections are successor cards, never edits."
  }
};
// __READ_END__

/* =====================================================================
   RENDERER  —  no judgment, only layout.
   ===================================================================== */
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const tier=n=>{let s='<span class="tier">';for(let i=1;i<=4;i++)s+=`<b class="${i<=n?'on':''}"></b>`;return s+'</span>';};
const dircls={up:'up',neu:'neu',dn:'dn'}, dirglyph={up:'▲',neu:'■',dn:'▼'};

// FENCE FIELDS (v1.0, E2) — enums, gate, and on-face rendering. No judgment.
// The authoritative gate is render_card.py; this mirrors it so a hand-opened
// poster cannot silently show a card that would have failed the pipeline.
const FENCE_ORIGINS = ["built","granted"];
const CLOCK_TYPES   = ["technical","commercial","regulatory-political"];

// A moat dot scored reinforcing claims a fence (E1: a claim that names a broken
// condition is a fence; one that cannot is scored "no fence").
const claimsFence = d => d.dir === "up";

// Full null-field list — every violation, not the first.
function fenceNulls(R){
  const out=[]; const dots=(R.moat && R.moat.dots) || [];
  dots.forEach((d,i)=>{
    if(!claimsFence(d)) return;
    const at=`moat.dots[${i}] (${d.label || "unlabelled"})`;
    if(d.fence_origin==null || d.fence_origin==="") out.push(`${at}: fence_origin is null`);
    else if(!FENCE_ORIGINS.includes(d.fence_origin))
      out.push(`${at}: fence_origin "${d.fence_origin}" outside enum {built | granted}`);
    if(d.clock_type==null || d.clock_type==="") out.push(`${at}: clock_type is null`);
    else if(!CLOCK_TYPES.includes(d.clock_type))
      out.push(`${at}: clock_type "${d.clock_type}" outside enum {technical | commercial | regulatory-political}`);
  });
  return out;
}

function fenceLine(d){
  if(!claimsFence(d)) return '';
  return `<span class="fence"><span class="flab">fence</span>`+
         `<span class="fchip origin ${d.fence_origin}">${d.fence_origin}</span>`+
         `<span class="fchip clock">${d.clock_type}</span></span>`;
}

const GRANTED_LIMITATION = "Granted fence. Decays discontinuously. "+
  "Falsifier is a political or docket event, not a market event.";

// CONCORDANCE RAIL (v0.9) — derivation only, no judgment.
const RAIL={lambda:0.4, g:1, version:"v0.9"};                  // priors
const pd=s=>{const m=String(s).replace(/[−–—]/g,'-').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):0;};
function concordance(R){
  const deltas=R.lenses.map(l=>pd(l.tag)).concat([pd(R.moat.tag)]); // six lenses + the moat = seven
  const raw=deltas.reduce((a,b)=>a+b,0);
  const dir=raw>=0?1:-1; let S=0,O=0;
  deltas.forEach(d=>{const w=d*dir; if(w>0)S+=Math.abs(d); else if(w<0)O+=Math.abs(d);});
  const r=(S+O)>0?O/(S+O):0;
  const factor=1-RAIL.lambda*2*r;
  const eff=raw*RAIL.g*factor;
  const label=r<0.15?'clean':(r<=0.30?'mixed':'contested');
  const prob=Math.round(R.build.baseRate+R.build.dehype+eff);
  return {deltas,raw,S,O,r,factor,eff,label,prob};
}

function render(R){
  const c=document.getElementById('card'); c.innerHTML='';

  // E2 FAIL discipline — no card is drawn while a claimed fence is incomplete.
  // No silent default to "built". No interpolation.
  const nulls=fenceNulls(R);
  if(nulls.length){
    c.appendChild(E('div','failbox',
      `<h3>RENDER FAILED &middot; ${nulls.length} null or out-of-enum fence field${nulls.length>1?'s':''}</h3>`+
      `<ul>${nulls.map(n=>`<li>${n}</li>`).join('')}</ul>`+
      `<div class="why">Every L3 sub-dimension scored reinforcing claims a fence and must carry both `+
      `fence_origin and clock_type (cn-ext-2026-08-28, E2). No default to built; no interpolation.</div>`));
    console.error("RENDER FAILED — fence fields:\n"+nulls.join("\n"));
    return;
  }

  const K=concordance(R);                                       // derived from locked deltas
  if(Math.abs(K.prob - R.build.probability) > 0.5)
    console.warn(`Concordance reconcile: locked probability ${R.build.probability}% vs railed ${K.prob}% — relock the read at the railed value.`);

  // HEADER
  const head=E('div','head');
  head.innerHTML=`<svg class="mark" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <circle cx="300" cy="300" r="220" stroke="var(--gold)" stroke-width="5" fill="none"/>
    <circle cx="300" cy="300" r="155" stroke="rgba(198,165,83,0.45)" stroke-width="1.5" fill="none"/>
    <circle cx="300" cy="300" r="90" stroke="rgba(198,165,83,0.45)" stroke-width="1.5" fill="none"/>
    <circle cx="300" cy="300" r="38" fill="rgb(105,110,70)"/></svg>
    <div><div class="word">Constellation</div>
      <div class="firm">${R.meta.firm} &middot; ${R.meta.ticker}</div>
      <div class="basis">${R.meta.basis}</div></div>
    <div class="right"><span class="pill ${R.meta.stamped?'':'unst'}">${R.meta.stamped?'Predicted: '+R.meta.predicted:'Unstamped · '+R.meta.predicted}</span></div>`;
  c.appendChild(head);

  // HERO
  const hero=E('div','hero');
  let rungs='';
  R.ladder.rungs.forEach(r=>{rungs+=`<div class="rung ${r.floor?'floor':'tgt'}">
    <div class="nm">${r.nm}</div><div class="bar"><div class="fill" style="width:${r.width}%"></div></div>
    <div class="pos"><b>${r.turns}</b><i>${r.vsavg}</i></div></div>`;});
  hero.appendChild(E('div','ladder',
    `<h4>${R.ladder.h4}</h4><div class="cap">${R.ladder.cap}</div>${rungs}
     <div class="moveline"><span class="arrowup">&#8593;</span> ${R.ladder.moveline}</div>`));
  hero.appendChild(E('div','heroR',
    `<div class="metricRow"><div class="bignum">${R.hero.bignum}<span>${R.hero.unit}</span></div>
       <div class="mlabel">${R.hero.mlabel}</div></div>
     <div class="rank"><b>${R.hero.rank}</b> &mdash; ${R.hero.rankNote}</div>
     <div class="conf"><span class="pl">${R.meta.probLabel}</span><b>${K.prob}%</b> &nbsp;${R.hero.confText}</div>
     <div class="plain">${R.hero.plain}</div>`));
  c.appendChild(hero);

  // READ GRID
  const read=E('div','read');
  let lc='<p class="secT">The six outside-in lenses · signed up the basis</p>';
  R.lenses.forEach(l=>{lc+=`<div class="lens"><div class="lensTop">
    <span class="ln">${l.n}</span><span class="ltitle">${l.title}</span>
    <span class="lq">${l.q}</span><span class="tag ${l.dir}">${l.tag}</span></div>
    <div class="lread">${l.read}</div></div>`;});
  read.appendChild(E('div','lenscol',lc));

  const right=E('div');
  let dots='';
  R.moat.dots.forEach(d=>{dots+=`<div class="dot"><span class="dir ${dircls[d.dir]}">${dirglyph[d.dir]}</span>
    <span class="dl">${d.label}</span><span class="de">${d.de}</span>${tier(d.tier)}${fenceLine(d)}</div>`;});
  // Any granted fence puts the standing limitation ON FACE, not in a footnote.
  const grantLim=(R.moat.dots||[]).some(d=>claimsFence(d)&&d.fence_origin==="granted")
    ? `<div class="grantlim">${GRANTED_LIMITATION}</div>` : '';
  right.appendChild(E('div','moat',
    `<div class="hd"><span class="ln">${R.moat.n}</span><span class="ltitle">${R.moat.title}</span>
       <span class="tag ${R.moat.dir}">${R.moat.tag}</span></div>
     <div class="q">${R.moat.q}</div>${dots}${grantLim}
     <div class="net3">${R.moat.net}</div>`));
  right.appendChild(E('div','dehype',
    `<div class="hd"><span class="ltitle">De-hype · firewall</span><span class="z">${R.dehype.value}</span></div>
     <p>${R.dehype.text}</p>`));
  const sPct=(K.S+K.O)>0?(K.S/(K.S+K.O)*100):50;
  right.appendChild(E('div','dehype conc',
    `<div class="hd"><span class="ltitle">Concordance</span><span class="z">r ${K.r.toFixed(2)} · ${K.label}</span></div>
     <div class="massbar"><span class="s" style="width:${sPct.toFixed(1)}%">support ${K.S}</span><span class="o" style="width:${(100-sPct).toFixed(1)}%">oppose ${K.O}</span></div>
     <p>${R.concordance.text}</p>`));
  read.appendChild(right);
  c.appendChild(read);

  // BRIDGE
  const b=R.build;
  c.appendChild(E('div','build',
    `<div class="flow">
       <div class="step"><div class="v">${b.baseRate}%</div><div class="l">base rate</div></div>
       <div class="op">+</div>
       <div class="step"><div class="v">${b.dehype>=0?'+':''}${b.dehype}</div><div class="l">de-hype (sign-only)</div></div>
       <div class="op">+</div>
       <div class="step"><div class="v">${K.eff>=0?'+':''}${K.eff.toFixed(1)}</div><div class="l">lens net</div><div class="sub">${K.raw>=0?'+':''}${K.raw} raw × ${K.factor.toFixed(2)} concordance</div></div>
       <div class="op">=</div>
       <div class="step g"><div class="v">${K.prob}%</div><div class="l">${READ.meta.probLabel}</div></div>
     </div>
     <div class="baseexp">${b.baseexp}</div>
     <div class="calib">${b.calibClaim}</div>
     <div class="calib" style="margin-top:8px"><b>Calibration ledger.</b> Three-way call rise / hold / fall: <b>${R.ledger.vector}</b>. Rail ${R.ledger.railVersion}. ${R.ledger.calibFalsifier}</div>`));

  c.appendChild(E('div','fals',R.falsifier));

  // EV/GP
  const ev=E('div','evgp','<h5>The measure</h5>');
  R.evgp.forEach(p=>ev.appendChild(E('p',null,p)));
  c.appendChild(ev);

  // GAP + SOURCES + STAMP
  c.appendChild(E('div','gap',R.gap));
  let s='<b>Sources by lens.</b> ';
  s+=R.sources.map(x=>`${x.lens}: ${x.src}`).join(' &nbsp;·&nbsp; ');
  c.appendChild(E('div','srcs',s));
  c.appendChild(E('div','foot',
    `<div><span class="st">${R.meta.stamped?'STAMPED':'UNSTAMPED'}</span>
       &nbsp; ${R.stamp.sha} &nbsp;·&nbsp; ${R.stamp.ots}</div>
     <div style="margin-top:5px">${R.meta.version} &middot; ${R.stamp.author}</div>
     <div style="margin-top:5px;font-style:italic">${R.stamp.note}</div>`));
}
render(READ);
</script>
</body>
</html>
