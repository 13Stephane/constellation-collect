<!doctype html>
<!-- Constellation console. Served by serve_console.py, which injects state and
     proxies chat to the configured provider. The page never holds an API key. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation console</title>
<style>
  :root {
    --ground:#0F2426; --surface:#17383B; --raised:#1D4145; --rule:#2B5054;
    --ink:#F4F0E9; --ink-soft:#AFC3C0; --ink-faint:#7E9895;
    --brass:#C6A553; --brass-bg:#2B3B33;
    --pass:#8FCE9A; --block:#E0A3A3; --wait:#C6A553;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display:grid; grid-template-columns: minmax(0,1fr) 420px;
  }
  @media (max-width: 980px) { body { grid-template-columns: 1fr; } #chat { border-left:none; border-top:1px solid var(--rule); } }

  /* ---- left: the numbers ---- */
  main { overflow-y:auto; padding:26px 30px 60px; }
  h1 { font-family:var(--serif); font-size:22px; font-weight:600; margin:0; }
  h2 { font-family:var(--serif); font-size:16px; font-weight:600; margin:0 0 12px; }
  .eyebrow { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
             text-transform:uppercase; color:var(--ink-faint); }
  .sub { color:var(--ink-soft); margin:8px 0 0; font-size:13.5px; }
  header { border-bottom:2px solid var(--brass); padding-bottom:16px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:3px;
          border:1px solid var(--rule); color:var(--ink-soft); }
  .chip.pass{ color:var(--pass); border-color:transparent; background:#1E3B2C; }
  .chip.block{ color:var(--block); border-color:transparent; background:#3B2325; }
  .chip.wait{ color:var(--wait); border-color:transparent; background:#33301F; }

  nav { display:flex; gap:2px; margin:22px 0 18px; flex-wrap:wrap; }
  nav button {
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:transparent; color:var(--ink-faint); border:1px solid var(--rule);
    padding:7px 13px; cursor:pointer; border-radius:3px;
  }
  nav button:hover { color:var(--ink); border-color:var(--brass); }
  nav button[aria-selected="true"] { color:var(--ground); background:var(--brass);
                                     border-color:var(--brass); font-weight:600; }
  nav button:focus-visible, .ask button:focus-visible, textarea:focus-visible {
    outline:2px solid var(--brass); outline-offset:2px; }

  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
       text-transform:uppercase; color:var(--ink-faint); font-weight:500;
       padding:0 10px 7px 0; border-bottom:1px solid var(--rule); white-space:nowrap; }
  td { padding:7px 10px 7px 0; border-bottom:1px solid rgba(43,80,84,.5);
       font-variant-numeric: tabular-nums; white-space:nowrap; }
  td:first-child, th:first-child { white-space:normal; min-width:190px; }
  td.n { text-align:right; }
  tr.tot td { font-weight:600; border-top:1px solid var(--rule); }

  .panel { background:var(--surface); border:1px solid var(--rule); border-radius:4px;
           padding:16px 18px; margin-bottom:16px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:13px; }
  .kv dt { color:var(--ink-faint); font-family:var(--mono); font-size:11px;
           letter-spacing:.06em; text-transform:uppercase; }
  .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  .note { color:var(--ink-soft); font-size:12.5px; line-height:1.6; margin:10px 0 0; }
  .conv { border-left:2px solid var(--brass); padding:8px 0 8px 12px; margin:12px 0;
          font-size:12.5px; color:var(--ink-soft); }
  .conv b { color:var(--brass); font-family:var(--mono); font-size:11px; }
  .bar { height:6px; background:var(--brass-bg); border-radius:3px; overflow:hidden; min-width:80px; }
  .bar i { display:block; height:100%; background:var(--brass); }
  .empty { color:var(--ink-faint); font-style:italic; font-size:13px; }

  /* ---- right: the conversation ---- */
  #chat { border-left:1px solid var(--rule); background:var(--surface);
          display:flex; flex-direction:column; height:100vh; position:sticky; top:0; }
  #chat header { padding:16px 18px; border-bottom:1px solid var(--rule); border-bottom-width:1px; }
  #log { flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
  .msg { font-size:13.5px; line-height:1.6; }
  .msg .who { font-family:var(--mono); font-size:10px; letter-spacing:.12em;
              text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:5px; }
  .msg.you .body { background:var(--raised); padding:9px 12px; border-radius:4px; }
  .msg.err .body { color:var(--block); font-family:var(--mono); font-size:12px;
                   background:#3B2325; padding:10px 12px; border-radius:4px; white-space:pre-wrap; }
  .msg .body { white-space:pre-wrap; }
  .msg .body table { margin:8px 0; }
  .seed { display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 12px; }
  .seed button { font-size:11.5px; text-align:left; background:transparent; color:var(--ink-soft);
                 border:1px solid var(--rule); padding:6px 10px; border-radius:3px; cursor:pointer; }
  .seed button:hover { border-color:var(--brass); color:var(--ink); }
  .ask { border-top:1px solid var(--rule); padding:12px 18px 16px; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:var(--ground); color:var(--ink);
             border:1px solid var(--rule); border-radius:4px; padding:9px 11px;
             font:inherit; font-size:13.5px; min-height:40px; max-height:160px; }
  .ask button { background:var(--brass); color:var(--ground); border:none; border-radius:4px;
                padding:10px 16px; font-weight:600; cursor:pointer; font-size:13px; }
  .ask button:disabled { opacity:.45; cursor:default; }
  .dots::after { content:"·"; animation: d 1.2s steps(3,end) infinite; }
  @keyframes d { 0%{content:"·"} 33%{content:"· ·"} 66%{content:"· · ·"} }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation:none; content:"· · ·" } }
  .c-bear { color:var(--block); } .c-base { color:var(--brass); } .c-bull { color:var(--pass); }
  .porter { display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:8px; margin-top:6px; }
  .pbox { border:1px solid var(--rule); border-radius:4px; padding:10px 12px; font-size:12px;
          line-height:1.5; color:var(--ink-soft); }
  .pbox b { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
            text-transform:uppercase; margin-bottom:5px; color:var(--ink-faint); }
  .pbox.sup { border-color:var(--pass); }  .pbox.opp { border-color:var(--block); }
  .pbox.none { border-style:dashed; opacity:.65; }
  .flow { display:flex; align-items:stretch; gap:0; flex-wrap:wrap; margin-top:6px; }
  .fnode { flex:1; min-width:150px; border:1px solid var(--rule); border-radius:4px;
           padding:10px 12px; font-size:12px; line-height:1.5; color:var(--ink-soft); }
  .fnode b { display:block; font-size:12.5px; color:var(--ink); margin-bottom:4px; font-family:var(--serif); }
  .farrow { display:flex; flex-direction:column; justify-content:center; padding:0 8px;
            color:var(--brass); font-size:16px; text-align:center; }
  .farrow small { font-size:9.5px; color:var(--ink-faint); font-family:var(--mono); max-width:96px; }
  .status-chip { font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 8px;
                 border-radius:3px; text-transform:uppercase; margin-left:8px; }
  .st-open { background:#33301F; color:var(--wait); }
  .st-decided { background:#1E3B2C; color:var(--pass); }
  .lnks { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; }
  .lnk { font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; padding:4px 9px;
         border-radius:3px; border:1px solid var(--rule); background:transparent;
         color:var(--brass); cursor:pointer; }
  .lnk:hover { border-color:var(--brass); }
  .lnk.broken { color:var(--block); border-style:dashed; cursor:default;
                text-decoration:line-through; }

  /* ---- review (local only) ----
     The asymmetry is deliberate and it lives in the markup, not only in the
     copy: rejecting is one control, accepting is four. */
  .rv-field { display:block; width:100%; background:var(--ground); color:var(--ink);
              border:1px solid var(--rule); border-radius:3px; padding:8px 10px;
              font:13px/1.5 inherit; margin-top:6px; }
  .rv-field:focus-visible { outline:2px solid var(--brass); outline-offset:1px; }
  .rv-label { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
              text-transform:uppercase; color:var(--ink-faint); }
  .rv-act { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 0; }
  .rv-act button { font-family:var(--mono); font-size:11px; letter-spacing:.06em;
                   text-transform:uppercase; padding:8px 14px; border-radius:3px;
                   border:1px solid var(--rule); background:transparent;
                   color:var(--ink-soft); cursor:pointer; }
  .rv-act button:hover { border-color:var(--brass); color:var(--ink); }
  .rv-act button[aria-pressed="true"] { background:var(--raised); color:var(--ink);
                                        border-color:var(--brass); }
  .rv-go { margin-top:14px; }
  .rv-go button { font-family:var(--mono); font-size:11.5px; letter-spacing:.06em;
                  text-transform:uppercase; padding:9px 16px; border-radius:3px;
                  border:1px solid var(--brass); background:var(--brass);
                  color:var(--ground); font-weight:600; cursor:pointer; }
  .rv-go button[disabled] { background:transparent; color:var(--ink-faint);
                            border-color:var(--rule); cursor:not-allowed; }
  .rv-check { display:block; margin:8px 0; color:var(--ink-soft); font-size:13px; }
  .rv-check input { margin-right:8px; }
  .rv-ev { border-left:2px solid var(--brass); padding:8px 0 8px 12px; margin:12px 0;
           color:var(--ink-soft); font-size:13px; }
  .rv-err { color:var(--block); border:1px solid var(--block); border-radius:3px;
            padding:10px 12px; margin-top:12px; font-size:13px; }
  .rv-bar { height:4px; background:var(--rule); border-radius:2px; overflow:hidden;
            margin:10px 0 4px; }
  .rv-bar i { display:block; height:100%; background:var(--brass); }
</style>
</head>
<body>

<main>
  <header>
    <div class="eyebrow">Constellation · console</div>
    <h1 id="firm">—</h1>
    <p class="sub" id="strap">—</p>
    <div class="chips" id="chips"></div>
  </header>

  <nav id="tabs" role="tablist"></nav>
  <div id="view"></div>
</main>

<aside id="chat">
  <header>
    <div class="eyebrow">Conversation</div>
    <div class="sub" id="provider" style="margin-top:6px">—</div>
  </header>
  <div id="log"></div>
  <div class="seed" id="seed"></div>
  <form class="ask" id="ask">
    <textarea id="q" rows="1" placeholder="Ask about these numbers…" aria-label="Ask about these numbers"></textarea>
    <button type="submit" id="send">Ask</button>
  </form>
</aside>

"locus": "firm", "locus_note": null, "moat": "customer_relationship", "provenance_tier": 1, "type": "structural_threat"}}, {"bite_indicator": {"observable": "Total contract liabilities, revenue recognition note, against revenue growth", "threshold": "RECO - Contract liability growth trails revenue growth in both years"}, "branch_id": "BR-ZS-04", "default_prior_used": true, "drivers_perturbed": [{"driver": "owc_pct_revenue", "params": {"bite_date": "2028-08-01", "shift_pct": 40.0}, "shape": "level_shift"}], "falsifier": {"condition": "RECO - Contract liabilities grow at least as fast as revenue in FY2027 and FY2028", "resolution_date": "2028-09-30", "source_tier": 1}, "p_analyst": 0.095, "p_base": 0.1515, "p_railed": 0.1176, "probability_modifiers": [], "source": {"evidence_ref": "Zscaler FY2025 10-K: contract liabilities 2,468.0 total and 2,054.4 current, funding operating working capital of -15.51% of revenue (lens LR-ZS-C02). A move toward zero working capital removes a financing source the base case assumes persists.", "label": "Customer prepayment weakens: deferred balances grow slower than revenue and the negative working capital unwinds", "locus": "firm", "locus_note": null, "moat": "financial_structure", "provenance_tier": 1, "type": "structural_threat"}}], "coherence": {"conservation_tolerance": 0.02, "envelope_status": "pass", "erosion_envelope": 0.6061, "override_justification": null, "prior_sum": 0.5334}, "excluded_threats": [], "hash_sha256": null, "horizon_years": 5, "lambda": 0.4, "methodology_version": "v16", "provenance": [{"object_id": "zs_golden_schema_v3_2026-08-14", "product_name": "constellation_valuation_track_b", "schema_version": "constellation_model_schema_v3"}, {"object_id": "p4_fade_atlas_prototype_v0_1", "product_name": "p4_fade_atlas", "schema_version": "fade_atlas_v0_1"}, {"object_id": "zs_scenario_config_2026-08-14", "product_name": "scenario_derive_config", "schema_version": "scenario_config_v0_1"}, {"object_id": "zs_threat_register_DRAFT_2026-08-14", "product_name": "threat_register", "schema_version": "threat_register_v0_1"}], "schema_version": "scenario_set_v0_1", "sector_map": {"atlas_sector": "Business equipment / tech", "grade": "working", "hold": 0.83, "n": 196, "panel": "simfin_2020_2024", "phi": 0.84, "pooled_phi_substituted": false}, "spec_version": "scenario_derivation_spec_v0_1", "subject": {"drivers_file": "zs_drivers.json", "drivers_sha256": "52b367fc9ffff07b240bce0b524ebbc64422c5945af456f37c77adef3fa60a9b", "engine_version": "track_b_0.4", "firm": "ZSCALER, INC.", "ticker": "ZS"}, "_path": "/Users/stegue/constellation/reads/00_methodology/scenario_sets/scenario_set_v0_1_ZS_r03.json"}, "reading": {"_authored": "Authored 14 Aug 2026 from this subject's recorded findings: the lens register, the conventions log, the threat register and the derived scenario set r01. Not derivable, and not generated by any tool.", "title": "Zscaler, as this model holds it", "lede": ["Zscaler sells cloud security as a subscription, routing enterprise traffic through its own platform rather than through appliances. Revenue ran 673.1 to 2,673.1 (USD millions) over FY2021-25, a 41% compound rate, and the company reached FY2025 with a GAAP net loss of 41.5.", "The engine's base case values the enterprise at 561 with a bear-bull range of -4,931 to 4,106, or 7.89 per share against -26.80 and 30.29, discounted at a CONSTRUCTED W1 band of 8.45 / 9.64 / 10.22 per cent. Read that range first: it crosses zero, and it does so because the entire valuation rests on one ratio."], "sections": [{"heading": "Main findings", "items": [{"title": "1 \u00b7 The value is a single bet on operating leverage", "body": "opex_pct_revenue carries an enterprise-value span of 9,073 USD millions in the tornado, against a base-case enterprise value of 561: swinging that one assumption between its bear and bull paths moves value by sixteen times the whole valuation. The next driver, gross margin, carries 2,389, and capex 1,086. Nothing else is close. (These spans were 7,520 / 1,983 / 908 when this paragraph was first written, at the 11.0% placeholder discount rate; the constructed W1 band of 14 August 2026 moved every one of them and the sentence was not re-read until 15 August. The ranking did not change.) The base case has the ratio falling from 78.0% of revenue to 62.0% by FY2030, which is a continuation of what the company has actually delivered: 88.7% in FY2023, 80.7% in FY2024, 78.0% in FY2025 \u2014 SG&A over revenue, the driver's own basis. An earlier version of this paragraph gave 92.1% and 83.6% for the first two years, which is SG&A plus depreciation over revenue: two of the three numbers were on one basis and the third on another, so the fall looked steeper than the driver's own history shows. If that trajectory continues, the equity is worth something; if it stalls, it is not. Branch BR-ZS-01 is that stall, at a railed 15.06%.", "links": [{"tab": "Scenarios", "label": "Where the forecast starts"}, {"tab": "Valuation", "label": "Scenario values"}, {"tab": "Derived scenarios", "label": "BR-ZS-01"}]}, {"title": "2 \u00b7 The reported loss is not the owner's cost", "body": "Stock-based compensation of 661.4 in FY2025 is sixteen times the reported net loss of 41.5, and the accumulated deficit stands at -1,189.6 against book equity of 1,799.3: the equity on the balance sheet is paid-in capital, not earnings retained. This model expenses that compensation, because it is a real transfer from owners to employees. That single choice is most of the distance between this valuation and the market's.", "links": [{"tab": "Valuation", "label": "Financial health"}, {"tab": "Conventions", "label": "Convention V1"}]}, {"title": "3 \u00b7 Customers fund the business", "body": "Contract liabilities of 2,468.0 exceed four times the annual cost of revenue, and operating working capital sits at -15.51% of revenue. Growth releases cash here rather than absorbing it, which is why a company with negative GAAP operating income is not a financing problem. Branch BR-ZS-04 asks what happens if that unwinds.", "links": [{"tab": "Valuation", "label": "Leverage and working capital"}, {"tab": "Statements", "label": "Balance sheet"}]}, {"title": "4 \u00b7 There is no customer to lose", "body": "The filing states plainly that no end customer contributed more than 10% of revenue in FY2023, FY2024 or FY2025. This is the exact inverse of NVIDIA, where two customers take 36% between them and dominate that subject's fragility reading. Zscaler's concentration risk, if it exists, sits in the channel, and the filing does not disclose it.", "links": [{"tab": "Lenses", "label": "LR-ZS-F01"}]}]}, {"heading": "Where this model departs from the market, and why", "items": [{"title": "The gap is structural, not a rounding error", "body": "A base case of 6.60 per share implies roughly 1.0 billion of equity value on 158.3 million shares. Zscaler's market capitalisation is more than an order of magnitude above that. This model is not attempting to reproduce the market price, and no input here has been tuned toward it.", "links": [{"tab": "Valuation", "label": "Model vs market"}]}, {"title": "Three choices explain almost all of it", "body": "First, stock-based compensation is expensed rather than added back; at 24.7 per cent of revenue that is the dominant term, and convention V1 records the decision to keep doing it. Second, investment is measured capex-inclusive from the PP&E roll-forward, and Zscaler spends roughly twice its depreciation on capex, so free cash flow is negative through most of the explicit window. Third, the discount rate is now a constructed W1 band at 9.64 per cent, which is LOWER than the 11.0 per cent placeholder it replaced and therefore raised the valuation. The gap to market survives all three.", "links": [{"tab": "Conventions", "label": "The open conventions"}]}, {"title": "The explicit five years have NEGATIVE present value", "body": "CORRECTED 14 Aug 2026: an earlier version of this page said terminal value was 2.3 per cent of enterprise value. That was a units error - the field is a fraction, not a percentage - and the truth is the opposite and more serious. The five explicit years carry a present value of MINUS 483; the terminal carries 1,044; the terminal is therefore 186 per cent of a 561 enterprise value. Everything this model says Zscaler is worth arrives after the forecast horizon, and the forecast period itself destroys value on these paths. A reader should treat the point estimate as far less informative than the range, and should treat the terminal assumption - 2 per cent growth in perpetuity on the final year's free cash flow - as the load-bearing input it is.", "links": [{"tab": "Valuation", "label": "Explicit vs terminal"}]}]}, {"heading": "What would change the read", "items": [{"title": "The falsifiers, in date order", "body": "By 30 Sep 2028: whether opex falls at least 3 percentage points in each of FY2027 and FY2028 (BR-ZS-01); whether gross margin holds at or above 76.0% (BR-ZS-02); whether EMEA or APAC revenue declines year over year (BR-ZS-03); whether contract liabilities keep pace with revenue (BR-ZS-04). Each is checkable in an annual filing, and each was written before the outcome is known.", "links": [{"tab": "Derived scenarios", "label": "Falsifiers and dates"}]}], "note": "Base case 46.66% that no recorded branch bites; branches at 15.06 / 13.86 / 12.66 / 11.76%; prior sum 0.5334 inside an erosion envelope of 0.6061. All DRAFT, none stamped."}, {"heading": "What this model does not contain", "items": [{"title": "The revenue tree carries no mechanism", "body": "Zscaler is a single-segment filer whose only disclosed disaggregation is geographic, so the revenue drivers here are regions. Regions do not express retention, seat expansion or platform attach, which are what actually move this business. The case paths allocate one total-revenue thesis across a fixed mix; they are not four independent regional views, and they should not be read as such.", "links": [{"tab": "Drivers", "label": "The revenue tree"}]}, {"title": "Eight lens claims, all signed", "body": "All eight claims on the Lenses tab were signed by St\u00e9phane Guerraz on 14 Aug 2026. THE DERIVATION SPECIFICATION WAS RATIFIED on 14 Aug 2026, so this read is citable in client work: the spec permits citation and stamping, and the remaining label on the set is simply that no OTS timestamp has been applied to it yet. Probabilities assume maximum dispersion for every branch, the conservative corner ruled on at \u00a710.1.", "links": [{"tab": "Lenses", "label": "All eight claims"}]}]}]}, "specStatus": {"status": "RATIFIED", "detail": "14 August 2026, S", "document": "scenario_derivation_spec_v0_1.md"}, "lensRegister": {"schema_version": "lens_register_v0_1", "subject": {"firm": "ZSCALER, INC.", "ticker": "ZS"}, "provenance": {"product_name": "lens_register", "object_id": "zs_lens_register_2026-08-13", "schema_version": "lens_register_v0_1"}, "ledger_mapping": {"teece": "moat", "value_curve": "value", "porter": "industry", "capital_recovery": "financial", "fragility": "fragility", "culture": "culture"}, "r_convention": "r = min(S, O) / (S + O); S = mass supporting the registered thesis, O = mass opposing it, per branch over the entries that land on that branch", "_build_note": "Opened 13 Aug 2026 against the 0.1-skeleton driver registry, before any threat register or scenario set exists. Every entry is drawn from the FY2025 Form 10-K (accession 0001713683-25-000158, filed 11 Sep 2025) and is tier 1 unless stated. Every entry was SIGNED by St\u00e9phane Guerraz on 14 Aug 2026 after review of the full register sheet: direction confirmed, mass set, citation owned. Note that the driver ids these claims land on are GEOGRAPHIC, because geography is the only revenue disaggregation Zscaler discloses; claims about retention and expansion have nowhere firm-specific to land until the revenue tree is upgraded, which is a known weakness of this register, not of the evidence.", "entries": [{"entry_id": "LR-ZS-C01", "lens": "capital_recovery", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "The near-breakeven GAAP result is reached while a large share of the value created is transferred to employees rather than owners. FY2025 stock-based compensation of 661.4 is 16 times the reported net loss of 41.5, and the accumulated deficit stands at -1,189.6 even though book equity is 1,799.3: the equity on the balance sheet is paid-in capital, not earnings retained. Any opex path that assumes the reported loss is the cost of running the business understates the owner's cost.", "direction": "opposes_thesis", "drivers": ["opex_pct_revenue"], "mass": 4, "magnitude_basis": "FY2025: SBC 661.4 = 24.7% of revenue 2,673.1; net loss 41.5; accumulated deficit -1,189.6 against equity 1,799.3. SBC rose 444.8 -> 527.7 -> 661.4 over FY2023-25, faster than revenue in FY2024 and roughly in line in FY2025. What is NOT quantified here: the buyback offset, and the dilution actually realised per share, which needs the share count roll-forward rather than the expense line.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158 (filed 2025-09-11): consolidated statements of cash flows (stock-based compensation), consolidated balance sheets (accumulated deficit, total stockholders' equity), consolidated statements of operations (net loss).", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-C02", "lens": "capital_recovery", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "Customers fund the working capital. Contract liabilities of 2,468.0 exceed four times the annual cost of revenue, and operating working capital anchors at -15.5% of revenue, so growth releases cash into the business instead of absorbing it. The capital recovery question for this firm is not whether growth is financeable but whether the deferred balance keeps pace with it.", "direction": "supports_thesis", "drivers": ["owc_pct_revenue"], "mass": 4, "magnitude_basis": "FY2025 contract liabilities 2,468.0 total, 2,054.4 current, against cost of revenue 618.2. The owc anchor of -0.1551 is computed by the registry from the extraction, under cashPolicy operatingCashPctRevenue = 0.0, so it excludes the cash balance entirely; a different cash policy moves the level but not the sign.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158: contract liabilities in the revenue recognition note; owc anchor computed in inputs/zs/zs_golden_source.json drivers.anchors.owc_pct_revenue.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-T01", "lens": "teece", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "Revenue is largely pre-contracted. Remaining performance obligations of 5,780.1 are 2.16 times FY2025 revenue, and the backlog grew faster than revenue did, so the appropriability of the platform's value is showing up as contract duration rather than only as price.", "direction": "supports_thesis", "drivers": ["us_revenue", "emea_revenue", "apac_revenue", "other_regions_revenue"], "mass": 4, "magnitude_basis": "RPO 3,513.6 -> 4,417.6 -> 5,780.1 over FY2023-25, a 30.8% increase in FY2025 against revenue growth of 23.3%; coverage rose from 2.04x to 2.16x. The claim lands on all four regional drivers because RPO is not disaggregated by region: this is the register inheriting the revenue tree's weakness, and the mass should not be read as regionally specific.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158: remaining performance obligation disclosure in the revenue recognition note.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-F01", "lens": "fragility", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "There is no end-customer concentration to inherit. The filing states plainly that no end customer contributed more than 10% of revenue in any of the last three fiscal years, so no revenue path here depends on the purchasing decision of a single counterparty. This is the direct opposite of the concentration that dominates the NVDA register, and it is the strongest structural point in Zscaler's favour on this lens.", "direction": "supports_thesis", "drivers": ["us_revenue", "emea_revenue", "apac_revenue", "other_regions_revenue"], "mass": 3, "magnitude_basis": "Filing statement covering fiscal 2025, 2024 and 2023. What this does NOT cover is channel concentration: Zscaler sells through a channel model, and the 10-K's customer-concentration statement is about end customers. Whether a small number of resellers intermediate a large share of revenue is a separate question this entry does not answer, and it is precisely where Rubrik's register finds its largest fragility.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158, business section: 'No end customer contributed more than 10% of our revenue in fiscal 2025, fiscal 2024 and fiscal 2023.'", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-F02", "lens": "fragility", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "Sales costs are capitalised and released over several years, so the reported operating expense ratio lags the bookings that drive it. A slowdown in new bookings would show up in opex slowly while the capitalised asset unwinds, making the opex path look better than the underlying sales motion for a year or more.", "direction": "opposes_thesis", "drivers": ["opex_pct_revenue", "other_op_assets_scaling_pct_revenue"], "mass": 3, "magnitude_basis": "Capitalised contract costs, net: 375.2 -> 445.4 -> 509.5 over FY2023-25, with 166.3 of amortisation of deferred contract acquisition costs charged in FY2025 (up from 130.1 and 98.7). The asset is roughly 19% of revenue. The lag length depends on the amortisation period, which this entry does not pin down.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158: deferred contract acquisition costs note, and the amortisation line in the consolidated statements of cash flows.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-F03", "lens": "fragility", "channel": "driver", "locus": "mixed", "locus_note": "Regional demand conditions, currency and public-sector budget cycles are sector-wide and would be demeaned away. The firm-specific component that survives is Zscaler's own regional mix, and more sharply, the fact that in THIS model the revenue drivers ARE regions: a regional shock lands directly on a named driver here in a way it would not in a model whose revenue tree was built on retention and seat expansion. The exposure is structural to the registry, not only to the market.", "claim": "Just under half of revenue is earned outside the United States, and the model's revenue terms are the regions themselves, so any regional demand or currency shock transmits straight into a driver path with no intermediate mechanism to absorb it.", "direction": "opposes_thesis", "drivers": ["emea_revenue", "apac_revenue", "other_regions_revenue"], "mass": 2, "magnitude_basis": "FY2025 mix: United States 51%, EMEA 30%, APAC 16%, other 3%; the filing states 49% of revenue was from customers outside the United States for all periods presented. Mass is held low deliberately: the exposure is real but the driver tree is a weak instrument for it, and inflating mass here would give a methodological artefact the standing of evidence.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158: revenue recognition note, disaggregation of revenue by geography, and the business section statement on non-US revenue.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-V01", "lens": "value_curve", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "The platform is priced far above its cost of delivery and the gap has held while research spending rose sharply. Gross margin anchors at 76.9% in a year when research and development reached 25.2% of revenue, so the value curve is being extended without being bought with margin.", "direction": "supports_thesis", "drivers": ["gross_margin_pct"], "mass": 3, "magnitude_basis": "FY2025: gross margin 0.7687 on the as-reported cost basis (stance E1 applies, so the LEVEL is not comparable with a depreciation-free basis); R&D 672.5 = 25.2% of revenue, up from 499.8 (23.1%) and 350.8 (21.7%). What is not established is whether the added R&D produced features buyers pay for: the filing describes the platform's breadth but discloses no attach or per-module pricing data.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158: consolidated statements of operations; gross margin anchor computed in inputs/zs/zs_golden_source.json drivers.anchors.gross_margin_pct.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-P01", "lens": "porter", "channel": "driver", "locus": "sector", "locus_note": null, "claim": "The filing's own competition section describes rivalry as categories rather than named firms: legacy on-premises appliance vendors, broad IT security vendors, large networking vendors bundling security into other products, and point solutions overlapping single features of the platform. On the filing's own account the competitive set is wide and partly made of firms whose security offer is an attachment to something else.", "direction": "opposes_thesis", "drivers": ["gross_margin_pct"], "mass": 2, "magnitude_basis": "PARKED BY CONSTRUCTION: locus is sector, so this entry is listed in the report and never counted in r. It is recorded because the absence of a named rival set is itself a finding \u2014 it means no tier-1 firm-specific rivalry claim can be built from this filing, and any named-competitor analysis would have to come from outside the record at a lower provenance tier. Bundling by a vendor whose security is an add-on is the mechanism that would compress price, but the filing names no such vendor as a competitor: Microsoft appears in this document as an integration target, not a rival.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158, business section, Competition.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}]}, "concordance": {"branches": [{"branch_id": "BR-ZS-01", "label": "Operating leverage stalls: the opex ratio stops falling while committed sales capacity keeps amortising", "S": 0, "O": 7, "r": 0.0, "entries": [{"entry_id": "LR-ZS-C01", "lens": "capital_recovery", "direction": "opposes_thesis", "mass": 4, "tier": 1, "status": "signed", "claim": "The near-breakeven GAAP result is reached while a large share of the value created is transferred to employees rather than owners. FY2025 stock-based compensation of 661.4 is 16 times the reported net loss of 41.5, and the accumulated deficit stands at -1,189.6 even though book equity is 1,799.3: the equity on the balance sheet is paid-in capital, not earnings retained. Any opex path that assumes the reported loss is the cost of running the business understates the owner's cost."}, {"entry_id": "LR-ZS-F02", "lens": "fragility", "direction": "opposes_thesis", "mass": 3, "tier": 1, "status": "signed", "claim": "Sales costs are capitalised and released over several years, so the reported operating expense ratio lags the bookings that drive it. A slowdown in new bookings would show up in opex slowly while the capitalised asset unwinds, making the opex path look better than the underlying sales motion for a year or more."}]}, {"branch_id": "BR-ZS-02", "label": "Price compression: security bundled into networking and platform contracts erodes the gross margin", "S": 3, "O": 0, "r": 0.0, "entries": [{"entry_id": "LR-ZS-V01", "lens": "value_curve", "direction": "supports_thesis", "mass": 3, "tier": 1, "status": "signed", "claim": "The platform is priced far above its cost of delivery and the gap has held while research spending rose sharply. Gross margin anchors at 76.9% in a year when research and development reached 25.2% of revenue, so the value curve is being extended without being bought with margin."}]}, {"branch_id": "BR-ZS-03", "label": "Non-US demand shock: just under half of revenue is earned outside the United States and the model's revenue terms are regions", "S": 7, "O": 2, "r": 0.2222222222222222, "entries": [{"entry_id": "LR-ZS-T01", "lens": "teece", "direction": "supports_thesis", "mass": 4, "tier": 1, "status": "signed", "claim": "Revenue is largely pre-contracted. Remaining performance obligations of 5,780.1 are 2.16 times FY2025 revenue, and the backlog grew faster than revenue did, so the appropriability of the platform's value is showing up as contract duration rather than only as price."}, {"entry_id": "LR-ZS-F01", "lens": "fragility", "direction": "supports_thesis", "mass": 3, "tier": 1, "status": "signed", "claim": "There is no end-customer concentration to inherit. The filing states plainly that no end customer contributed more than 10% of revenue in any of the last three fiscal years, so no revenue path here depends on the purchasing decision of a single counterparty. This is the direct opposite of the concentration that dominates the NVDA register, and it is the strongest structural point in Zscaler's favour on this lens."}, {"entry_id": "LR-ZS-F03", "lens": "fragility", "direction": "opposes_thesis", "mass": 2, "tier": 1, "status": "signed", "claim": "Just under half of revenue is earned outside the United States, and the model's revenue terms are the regions themselves, so any regional demand or currency shock transmits straight into a driver path with no intermediate mechanism to absorb it."}]}, {"branch_id": "BR-ZS-04", "label": "Customer prepayment weakens: deferred balances grow slower than revenue and the negative working capital unwinds", "S": 4, "O": 0, "r": 0.0, "entries": [{"entry_id": "LR-ZS-C02", "lens": "capital_recovery", "direction": "supports_thesis", "mass": 4, "tier": 1, "status": "signed", "claim": "Customers fund the working capital. Contract liabilities of 2,468.0 exceed four times the annual cost of revenue, and operating working capital anchors at -15.5% of revenue, so growth releases cash into the business instead of absorbing it. The capital recovery question for this firm is not whether growth is financeable but whether the deferred balance keeps pace with it."}]}], "unmatched": [], "drafts": 0, "total": 8}, "conventionsLog": {"schema_version": "conventions_log_v0_1", "subject": {"firm": "ZSCALER, INC.", "ticker": null}, "provenance": {"product_name": "conventions_log", "object_id": "collect_0001713683", "schema_version": "conventions_log_v0_1"}, "_discipline": "Seeded by collect_statements.py with the stances the extraction took. Only the curator moves a convention to decided.", "conventions": [{"id": "E1", "title": "Cost-of-sales basis", "owner": "collect_extraction", "status": "open", "interim_default": "E1: costOfSales is as reported and may include production depreciation (unlike the depreciation-free ASML reference basis); sga is the residual keeping EBIT exact, so EBIT/NOPLAT and derived cash flows are exact while the gross-margin level is not cross-basis comparable.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "E3", "title": "Operating vs excess cash", "owner": "collect_extraction", "status": "open", "interim_default": "E3: operatingCash carries the total cash balance; no operating/excess split exists in XBRL.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "E4", "title": "No reported cash flow statement", "owner": "collect_extraction", "status": "open", "interim_default": "E4: no reported cash flow statement emitted; the identity-derived one ties by construction on this mapping.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "T1", "title": "Tax basis: statutory vs effective", "owner": "curator", "status": "decided", "interim_default": "T1: assumptions.taxRate = 0.2100 is CURATOR-SUPPLIED (--tax-rate), not extracted. The latest fiscal year's effective rate is -1.2677, unusable as a NOPLAT rate. The basis for the supplied rate is the curator's to record here.", "resolution_path": "Curator decision of 13 Aug 2026, taken because the extraction gate refused: FY2025 tax expense of 23.2 on a pre-tax loss of -18.3 gives an effective rate of -126.77%, outside schema v3's [0,1] and meaningless as a NOPLAT rate. Same basis as the RBRK decision of the same date, so the two loss-makers stay comparable.", "resolution": "0.21, the US federal statutory rate, as the marginal rate a profitable Zscaler would pay. NOT a cash rate: Zscaler carries large NOL carryforwards and a valuation allowance, and its tax expense is mostly foreign and state tax on a GAAP loss. When that loss closes \u2014 pre-tax was -18.3 in FY2025 against -29.2 in FY2024, so it is closing \u2014 the effective rate becomes meaningful and this convention should be re-taken on evidence rather than left at statutory.", "decided_on": "2026-08-13"}, {"id": "V0", "title": "WACC unset", "owner": "collect_extraction", "status": "open", "interim_default": "assumptions.wacc = null: valuation input, never extracted.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "C1", "title": "Hand-transcribed statement line", "owner": "collect_extraction", "status": "open", "interim_default": "C1: depreciation, longTermDebt is CURATOR-SUPPLIED, read off the filing by hand because no annual 10-K XBRL fact exists for it. Source: Zscaler 10-K consolidated statements of cash flows, line 'Depreciation and amortization expense', in USD (filings state thousands). FY2023-FY2025 from the FY2025 10-K, accession 0001713683-25-000158 (filed 2025-09-11); FY2021-FY2022 from the FY2023 10-K, accession 0001713683-23-000113 (filed 2023-09-14). FY2023 appears in both filings at 55,756 thousand and agrees. TRANSCRIBED BY HAND because the companyfacts API carries only us-gaap and dei elements, and Zscaler tags this line with a custom extension, zs:DepreciationDepletionAndAmortizationExcludingAmortizationOfDeferredContractCosts, which the API therefore never returns. BASIS, AND WHAT A REVIEWER SHOULD CONTEST: this is the PP&E-consistent charge. It EXCLUDES amortisation of acquired intangibles (16,820 in FY2025), of deferred contract acquisition costs (166,310), and of debt issuance costs (4,293), each a separate cash-flow line. It was chosen over total D&A because the house identity derives capex as delta-PPE + depreciation, so an intangibles-inclusive figure would overstate implied capex. NOTE THE ASYMMETRY: NVDA's golden uses us-gaap:DepreciationDepletionAndAmortization, which DOES include intangibles amortisation, so the two subjects are not on the same D&A basis and their implied-capex series are not directly comparable. Zscaler consolidated balance sheets, convertible senior notes, current plus noncurrent, in USD. FY2025 and FY2024 from the FY2025 10-K, accession 0001713683-25-000158: 'Convertible senior notes, noncurrent' 1,700,727 at 2025-07-31 and 0 at 2024-07-31; 'Convertible senior notes' (current) 0 at 2025-07-31 and 1,142,275 at 2024-07-31. FY2021-FY2023 from us-gaap:LongTermDebt and us-gaap:ConvertibleLongTermNotesPayable in companyfacts, which agree. WHY THIS IS SUPPLIED RATHER THAN EXTRACTED: Zscaler refinanced during FY2025, and the new notes sit under us-gaap:ConvertibleLongTermNotesPayable, which this map's debt candidates do not carry. The extractor would otherwise have carried FY2024's 1,142.3 forward and understated FY2025 net debt by 558.4 million. Current-portion converts are included because the field feeds net debt, matching how NVDA's golden sums noncurrent and current.. Every other line on this file is extracted; this one is transcribed, so it carries transcription risk the XBRL lines do not.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "V1", "title": "Stock-based compensation: expensed, never added back", "owner": "curator", "status": "decided", "interim_default": "V1: the model charges stock-based compensation in full. The extraction's sga line is the residual that holds EBIT exact (stance E1), so GAAP operating expense including SBC flows into the opex_pct_revenue driver, and every NOPLAT, free cash flow, enterprise value and per-share figure downstream is therefore AFTER stock compensation. There is no add-back anywhere in the chain.", "resolution_path": "Raised 14 Aug 2026 because it is the single largest cause of the gap between these reads and market prices, across every subject in the set. Market and sell-side practice is generally to value these businesses on cash flow with SBC added back. The magnitudes are not marginal: SBC is 24.7% of revenue at Zscaler and 25.0% at Rubrik, and at Zscaler it is sixteen times the reported net loss. NVIDIA last traded at 225.30 against a 52.16 base case; Zscaler's base case implies roughly 1.0bn of equity against a market capitalisation more than an order of magnitude larger. If this convention is wrong, every valuation in the system is wrong in the same direction and by a large factor.", "resolution": "KEEP EXPENSING. Stock compensation is a real transfer of value from owners to employees, and adding it back values a business as though its labour were partly free. THE TREATMENT IS INTERNALLY CONSISTENT AS IT STANDS, and that consistency is the substance of the decision: the model charges the cost through the income statement AND holds shares outstanding flat at the last actual count, so the cost is counted exactly once. Adding SBC back while growing the share count would also count it once; doing both, or neither, would be wrong. WHAT THIS COSTS: subjects with heavy SBC look severely cheap-to-worthless against their market prices, and this model will keep saying so. That is the intended behaviour, not a defect to be tuned away. REVIEW TRIGGERS, any one of which reopens this: (1) a dilution or share-count path is added to the projection \u2014 at that point expensing SBC as well would double-count it, and one of the two must go; (2) the model is used for any claim relative to a market price or a market multiple, rather than as a standalone read, since the comparison is then between two different definitions of earnings; (3) a subject's SBC falls below about 5% of revenue, where the choice stops changing the answer and the convention can be retired for that name; (4) the derivation specification is ratified, at which point every open convention is re-taken anyway.", "decided_on": "2026-08-14"}, {"id": "S1", "title": "No one-time margin shock in the v0.1 shape set", "owner": "curator", "status": "decided", "interim_default": "S1: this subject's threat register perturbs margin, cost and working-capital ratios with level_shift, which \u00a73.2 permitted only for volume, unit and share drivers at the time the register was written.", "resolution_path": "Raised because level_shift was used on margin and cost-ratio drivers, outside \u00a73.2's stated applicability. Surfaced as a ratification blocker on 14 Aug 2026: \u00a710.5 asks to ratify the shape set as closed, which could not be done honestly while a third of the live corpus breached the applicability column.", "resolution": "CLOSED AT RATIFICATION, 14 Aug 2026. Ratification of scenario_derivation_spec_v0_1 widened \u00a73.2's applicability column for level_shift to include ratio drivers (margin, cost, working-capital and tax ratios). The shape's definition - a one-time shift of X% at the bite date, held thereafter - already described this mechanism exactly; the restriction to volume, unit and share drivers predated the existence of margin-threat branches. Six live branches across NVDA, ZS and RBRK were affected and are now compliant as written. No shape was added, removed or redefined, so \u00a73.2 remains closed at four shapes.", "decided_on": "2026-08-14"}, {"id": "D1", "title": "ROIC against WACC is the spine; ROE and DuPont reintroduce leverage", "owner": "track_a_convention", "status": "open", "interim_default": "The valuation spine is ROIC against the constructed W1 WACC band, which excludes capital structure by construction: it asks whether the operations earn more than the capital costs, whoever supplied it. The Valuation tab also carries a five-step DuPont decomposition, whose equity multiplier puts leverage back in, and return on equity beside it. Both are legitimate and they answer different questions, but presenting them on one face invites reading them as one measure. Interim stance: where the two disagree the valuation follows ROIC, and the page says so in those words.", "resolution_path": "Decide whether return on equity belongs on a valuation face at all, or only in a separate credit-and-returns view. This is a Track A convention: it binds every subject, not the one it was first noticed on. Added 15 Aug 2026 when the Valuation tab was built.", "resolution": null, "decided_on": null}, {"id": "G1", "title": "ROIC is measured on an accounting capital base, which is biased against a company still building", "owner": "track_a_convention", "status": "open", "interim_default": "Invested capital is the accounting base \u2014 operating working capital plus PP&E plus other operating assets \u2014 so growth spending routed through the income statement (customer acquisition, research and development, stock-based compensation) builds an asset the measure cannot see. In the investment phase both terms are understated and the biases do not cancel: the capital charge understates the capital genuinely at risk while NOPLAT understates the earning power being built. The interim stance is to measure on the accounting base for every subject, so the definition is uniform, and to state the bias on the face function derivedCF() {
  // Cash flow by IDENTITY from the two statements: every balance line is used
  // exactly once, so the total ties to the change in cash by construction.
  // Not the reported statement — that is absent from schema v3 (convention E4).
  const inc = G.income, bal = G.balance, ys = G.years;
  const ni = ys.map((_, t) => inc.revenue[t] - inc.costOfSales[t] - inc.depreciation[t]
    - inc.sga[t] + inc.interestIncome[t] - inc.interestExpense[t] - inc.incomeTaxes[t]);
  const d = (arr, t) => arr[t] - arr[t - 1];
  const rows = [];
  const push = (label, fn, cls) => rows.push({label, vals: ys.slice(1).map((_, i) => fn(i + 1)), cls});
  push("Net income", t => ni[t]);
  push("+ Depreciation & amortisation", t => inc.depreciation[t]);
  push("− Δ other current operating assets", t => -d(bal.otherCurrentAssets, t));
  push("+ Δ accounts payable & accrued", t => d(bal.accountsPayable, t));
  push("+ Δ other non-interest liabilities (incl. prepayments)", t => d(bal.otherNonInterestLiab, t));
  push("Cash from operations", t => ni[t] + inc.depreciation[t] - d(bal.otherCurrentAssets, t)
    + d(bal.accountsPayable, t) + d(bal.otherNonInterestLiab, t), "tot");
  push("− Capex incl. (Δ net PPE + depreciation)", t => -(d(bal.ppe, t) + inc.depreciation[t]));
  push("− Δ R&D / other operating assets, net", t => -d(bal.otherOperatingAssets, t));
  push("Cash from investing", t => -(d(bal.ppe, t) + inc.depreciation[t]) - d(bal.otherOperatingAssets, t), "tot");
  push("Δ interest-bearing debt", t => d(bal.longTermDebt, t));
  push("Net shareholder flows (Δ equity − net income)", t => d(bal.equity, t) - ni[t]);
  push("Cash from financing", t => d(bal.longTermDebt, t) + d(bal.equity, t) - ni[t], "tot");
  const dcash = t => ni[t] + inc.depreciation[t] - d(bal.otherCurrentAssets, t)
    + d(bal.accountsPayable, t) + d(bal.otherNonInterestLiab, t)
    - (d(bal.ppe, t) + inc.depreciation[t]) - d(bal.otherOperatingAssets, t)
    + d(bal.longTermDebt, t) + d(bal.equity, t) - ni[t];
  push("Δ cash (derived)", dcash, "tot");
  push("Check: derived Δ cash − reported Δ cash", t => dcash(t) - d(bal.operatingCash, t));
  return rows;
}

/* ---------- valuation & financial health ----------
   Everything here is arithmetic on lines the golden already carries. No new
   extraction, and nothing is fetched in the browser: the market snapshot is a
   file with a retrieval date, injected like every other input. */
const BASE_EV = ((((comp.cases || {}).base || {}).valuation) || {}).ev
  || (comp.footballField && comp.footballField.evBase) || 0;
const BASE_T = G.years.length - 1;
const BASE_YEAR = G.years[BASE_T];
const MKT = STATE.marketSnapshot || null;

const health = (() => {
  const i = G.income, b = G.balance, t = BASE_T;
  const revenue = i.revenue[t];
  const grossProfit = revenue - i.costOfSales[t];
  const ebitda = grossProfit - i.sga[t];
  const ebit = ebitda - i.depreciation[t];
  const pretax = ebit + i.interestIncome[t] - i.interestExpense[t];
  const netIncome = pretax - i.incomeTaxes[t];
  const assets = b.operatingCash[t] + b.otherCurrentAssets[t] + b.ppe[t] + b.otherOperatingAssets[t];
  const equity = b.equity[t], debt = b.longTermDebt[t];
  const intExp = i.interestExpense[t];
  return {
    year: BASE_YEAR, revenue, grossProfit, ebitda, ebit, pretax, netIncome,
    assets, equity, debt, intExp,
    // Guarded terms. A term is null when its denominator makes it meaningless,
    // never when it is merely unflattering: a negative operating margin is a
    // finding, a ratio of two negatives is an artefact.
    coverage: intExp > 0 && ebit > 0 ? ebit / intExp : null,
    coverageWhy: intExp <= 0 ? "There is no interest expense on the base-year income statement, "
                             + "so there is nothing to cover."
      : ebit <= 0 ? "There are no operating earnings to cover interest at all. EBIT / interest "
                  + "expense would return a negative number, and a negative coverage ratio cannot "
                  + "be ranked against a positive one: it does not mean thin cover, it means none."
      : null,
    debtToAssets: assets > 0 ? debt / assets : null,
    taxBurden: pretax > 0 ? netIncome / pretax : null,
    interestBurden: ebit > 0 ? pretax / ebit : null,
    operatingMargin: revenue > 0 ? ebit / revenue : null,
    assetTurnover: assets > 0 ? revenue / assets : null,
    equityMultiplier: equity > 0 ? assets / equity : null,
    roe: equity > 0 ? netIncome / equity : null,
    roeWhy: equity > 0 ? null
      : `Book equity is ${fmt(equity, 1)} ${G.unit}, negative. Return on equity and the equity `
        + `multiplier are suppressed: dividing a loss by negative equity returns a POSITIVE `
        + `number, and printing it would report a profitable return on a company that lost `
        + `money. This is not a display choice, it is the ratio breaking down.`,
  };
})();

// The interest line's own recorded caveat, read from the extraction rather than
// written here: on one subject the tag is debt interest only, so coverage is
// flattering even as a sign.
const INTEREST_NOTE = (((G._collect || {}).missing_optional) || [])
  .filter(s => typeof s === "string" && s.startsWith("interestExpense:"));

function valuationRows() {
  const cs = (comp.cases) || {};
  return CASE_ORDER.filter(c => cs[c]).map(c => ({case: c, v: cs[c].valuation}));
}

/* market implied EV = market capitalisation + the model's own net debt, so the
   two enterprise values are on one basis. Net debt is filing-derived; only the
   cap is tier 3. */
function marketBlock() {
  if (!MKT) return null;
  const rows = valuationRows();
  if (!rows.length) return null;
  const netDebt = rows.find(r => r.case === "base").v.netDebt;
  const cap = (MKT.marketCap || {}).value;
  return {
    ok: MKT.currencyMatchesModel === true && typeof cap === "number",
    cap, netDebt,
    impliedEV: typeof cap === "number" ? cap + netDebt : null,
    price: (MKT.lastPrice || {}).value,
    currency: MKT.currency,
    note: MKT.currencyNote,
  };
}
const MB = marketBlock();

/* The ratio drivers as actually reported, on the ENGINE's definitions — the same
   ones build_registry.py uses for the anchors — so the history and the forecast
   paths are the same measurement and the continuation is legible. */
const RATIO_HISTORY = (() => {
  const i = G.income, b = G.balance, ys = G.years;
  const cash = ((comp.cashPolicy || {}).operatingCashPctRevenue) || 0;
  const defs = [
    ["gross_margin_pct", "Gross margin", "(revenue − cost of sales) / revenue",
     t => (i.revenue[t] - i.costOfSales[t]) / i.revenue[t]],
    ["opex_pct_revenue", "Opex ratio", "SG&A / revenue (R&D sits inside SG&A — C2)",
     t => i.sga[t] / i.revenue[t]],
    ["capex_incl_pct_revenue", "Capex intensity", "(Δ net PP&E + depreciation) / revenue",
     t => t === 0 ? null : (b.ppe[t] - b.ppe[t - 1] + i.depreciation[t]) / i.revenue[t]],
    ["owc_pct_revenue", "Working capital", "OWC / revenue, OWC on the engine's cash policy",
     t => ((cash * i.revenue[t] + b.otherCurrentAssets[t])
           - (b.accountsPayable[t] + b.otherNonInterestLiab[t])) / i.revenue[t]],
  ];
  const ts = ys.map((_, t) => t).slice(-3);
  return defs.map(([id, label, rule, fn]) => ({
    id, label, rule,
    years: ts.map(t => ({year: ys[t], value: fn(t)})),
    base: (CASES.base && CASES.base.paths[id]) || null,
  }));
})();

/* ---------- economic value created, on the actuals ----------
   The model's spine is ROIC against WACC (convention D1) and the Scenarios tab
   carries it FORWARD, over the five projected years. Nothing carried it
   BACKWARD, so the page asserted a spine without ever showing whether the
   business has cleared its cost of capital in the years that actually happened.

   Same arithmetic as the engine: NOPLAT = EBIT x (1 - taxRate), invested capital
   = OWC + PP&E + other operating assets on the engine's cash policy, ROIC =
   NOPLAT / PRIOR-year invested capital. The base-year figure is checked against
   the engine's own, which is why the check row is on the face. */
const EVA_HISTORY = (() => {
  const i = G.income, b = G.balance, ys = G.years;
  const cash = ((comp.cashPolicy || {}).operatingCashPctRevenue) || 0;
  const tax = (G.assumptions || {}).taxRate;
  const d = (G.scenarios || {}).discount || {};
  if (typeof tax !== "number" || typeof d.waccMid !== "number") return null;

  const ic = ys.map((_, t) =>
    (cash * i.revenue[t] + b.otherCurrentAssets[t])
    - (b.accountsPayable[t] + b.otherNonInterestLiab[t])
    + b.ppe[t] + b.otherOperatingAssets[t]);

  const charge = (w, icp) => w * icp;
  const rows = [];
  for (let t = 1; t < ys.length; t++) {
    const ebit = i.revenue[t] - i.costOfSales[t] - i.depreciation[t] - i.sga[t];
    const noplat = ebit * (1 - tax);
    const icp = ic[t - 1];
    // The RATIO breaks when the denominator is not positive; the ECONOMIC PROFIT
    // does not. NOPLAT less a capital charge is well defined either way, and
    // where invested capital is negative the charge is a credit — the business
    // is being funded by its customers rather than funding them.
    rows.push({
      year: ys[t], icPrior: icp, ebit, noplat,
      roic: icp > 0 ? noplat / icp : null,
      eva: noplat - charge(d.waccMid, icp),
      evaLow: noplat - charge(d.waccLow, icp),
      evaHigh: noplat - charge(d.waccHigh, icp),
      // A return is a level; growth says whether that level is worth feeding.
      // Growth multiplies whatever the spread already is, in either direction.
      growth: i.revenue[t - 1] > 0 ? i.revenue[t] / i.revenue[t - 1] - 1 : null,
      reinvested: ic[t] - icp,
    });
  }
  // Every year the extraction reached, not a fixed three. The windows already
  // differ by subject (RBRK has two years by necessity) and truncating to three
  // would have hidden NVIDIA's FY2023, the one year in its record that sits
  // BELOW its own cost of capital — which is the single most informative row
  // this panel has.
  const window = rows;
  const engineIC = ((comp.cashPolicy || {}).baseYear || {}).investedCapital;
  return {
    rows: window,
    wacc: d,
    taxRate: tax,
    lossYears: window.filter(r => r.ebit < 0).length,
    cumulative: window.reduce((a, r) => a + r.eva, 0),
    // every year's verdict holds across the whole band, or it does not
    signStable: window.every(r => (r.evaLow > 0) === (r.evaHigh > 0)),
    checkComputed: ic[ic.length - 1],
    checkEngine: engineIC,
    checkTies: typeof engineIC === "number"
      && Math.abs(ic[ic.length - 1] - engineIC) < 0.05,
  };
})();

/* ---------- relative expensiveness ----------
   Every figure here is TIER 3, including the subject's own row, and that is the
   point: one provider, one moment, one definition, so the players are
   comparable to EACH OTHER. They are not comparable to the model's own
   multiples, which use house gross profit and the model's net debt — the two
   panels are different measurements and the page says so rather than letting a
   reader take a ratio between them. */
const PM = STATE.peerMultiples || null;

function peerRank(rows, key, id) {
  const vals = rows.filter(r => typeof r[key] === "number")
                   .sort((a, b) => a[key] - b[key]);
  const i = vals.findIndex(r => r.ticker === id);
  return i < 0 ? null : {rank: i + 1, of: vals.length};
}

const median = (xs) => {
  const v = xs.filter(x => typeof x === "number").sort((a, b) => a - b);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
};

/* The four cells of the value-driver grid. Growth is not a virtue and not a
   vice on its own: it scales the spread. The wording refuses to congratulate
   growth bought below the hurdle, which is the reading a growth rate printed on
   its own invites. */
function growthVerdict(r, wacc) {
  if (r.roic === null)
    return r.eva > 0 ? "created — ratio n/a" : "destroyed — ratio n/a";
  const above = r.roic > wacc;
  const growing = r.growth !== null && r.growth > 0.02;
  if (above && growing) return "compounding: growth feeds a positive spread";
  if (above) return "earning above the hurdle, but not scaling it";
  if (growing) return "growth on a negative spread: scale is making it worse";
  return "below the hurdle, and not growing into it";
}

const gapBoth = (model, market) => {
  if (!isFinite(model) || !isFinite(market) || model === 0 || market === 0) return "—";
  const a = (model - market) / Math.abs(market) * 100;
  const b = (market - model) / Math.abs(model) * 100;
  return `model ${a < 0 ? "below" : "above"} market by ${Math.abs(a).toFixed(1)}% · `
       + `market ${b < 0 ? "below" : "above"} model by ${Math.abs(b).toFixed(1)}%`;
};

function cfPanel() {
    const rows = derivedCF();
    return `<div class="panel"><h2>Statement of cash flows · derived by identity</h2>
      <p class="note" style="color:var(--wait)">Schema v3 carries no reported cash flow statement
      (open convention E4). This one is derived from the income statement and balance-sheet
      deltas: every balance line is used exactly once, so it ties to the change in cash by
      construction — the check row is the proof. What deltas cannot recover: the
      buyback/dividend split (shown net) and any non-cash reclassifications.</p>
      <div class="scroll"><table>
      <thead><tr><th></th>${G.years.slice(1).map(y => `<th style="text-align:right">${y}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr${r.cls ? ` class="${r.cls}"` : ""}><td>${esc(r.label)}</td>
        ${r.vals.map(v => `<td class="n">${fmt(v)}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>
      <p class="note">Read the financing and prepayment lines together: they show who is funding
      the business. A large customer-prepayment inflow means the customer base is financing
      working capital, which the fragility and capital-recovery lenses both speak to.</p></div>`;
  }

/* A reading item may carry links: [{tab, label}] pointing at the tab that holds
   its evidence. The old hardcoded ASML page had these as buttons and the
   data-driven readings lost them, so a claim citing LR-ZS-F02 left the reader to
   go and find LR-ZS-F02. A link naming a tab that does not exist is rendered
   BROKEN rather than dropped: a dead reference should be visible. */
function readingLinks(links) {
  if (!Array.isArray(links) || !links.length) return "";
  return `<div class="lnks">` + links.map(l => {
    const tab = l && l.tab, label = (l && l.label) || tab;
    if (!tab || !TAB_NAMES.includes(tab))
      return `<span class="lnk broken" title="no tab named ${esc(String(tab))}">${
        esc(String(label))} · broken link</span>`;
    return `<button class="lnk" data-goto="${esc(tab)}">${esc(label)} →</button>`;
  }).join("") + `</div>`;
}

const TABS = {

    return `<div class="panel"><h2>No reading yet for ${esc(G.company)}</h2>

    <div class="panel"><h2>Income statement</h2><div class="scroll"><table>

      <thead>${yearHead(G.years)}</thead><tbody>${rows(G.balance, G.labels)}</tbody></table></div>
      <p class="note">Tax rate ${pct(G.assumptions.taxRate)} · WACC ${pct(G.assumptions.wacc)}
      · shares ${fmt(G.sharesOutstanding[G.sharesOutstanding.length-1],1)}m</p></div>` + cfPanel(),

  "Valuation": () => {
    const rows = valuationRows();
    if (!rows.length) return `<div class="panel"><h2>No valuation yet</h2>

    const U = comp.footballField && comp.footballField.unit || G.unit;

    } else if (!MB.ok) {
      out += `<div class="panel"><h2>The market's price</h2>
        <p class="note" style="color:var(--block)">${esc(MB.note || "market data unusable")}</p>

        number. Retrieved ${esc(MKT.retrieved_at || "—")} from ${esc(MKT.provider || "—")}.</p></div>`;
    } else {
      out += `<div class="panel"><h2>The market's price
        <span class="status-chip st-open">tier 3</span></h2>
        <p class="note">${esc(MKT.provider)}, listing <b>${esc(MKT.ticker)}</b>, retrieved
        <b>${esc(MKT.retrieved_at)}</b>. <b style="color:var(--wait)">Not filing-grade.</b> An
        unofficial endpoint with no service guarantee, carried because no filing contains a share
        price. Every other number on this tab comes from the statements. Nothing in the model has

        <div class="scroll"><table><tbody>
        <tr><td>Last price</td><td class="n">${fmt(MB.price, 2)} ${esc(MB.currency)}</td></tr>

    }

    /* ---- 2. what each scenario means ------------------------------------- */
    const psGap = (v) => (MB && MB.ok && typeof v.perShare === "number")
      ? gapBoth(v.perShare, MB.price) : "—";
    out += `<div class="panel"><h2>What each scenario means</h2>
      <div class="scroll"><table>
      <thead><tr><th>Case</th><th style="text-align:right">WACC</th>
      <th style="text-align:right">Enterprise value (${esc(U)})</th>

      <th>Against the market</th></tr></thead><tbody>
      ${rows.map(({case: c, v}) => `<tr>
        <td class="${caseCls(c)}">${c}</td>
        <td class="n">${pct(v.wacc)}</td>

      ${MB && MB.ok ? `<tr class="tot"><td>market</td><td class="n">—</td>
        <td class="n">${fmt(MB.impliedEV)}</td><td class="n">${fmt(MB.cap)}</td>

      </tbody></table></div>
      ${shares ? `<p class="note">Per share divides equity by ${fmt(shares, 3)}m shares, the

    /* ---- 3. ratios on the same basis ------------------------------------- */
    const rev = health.revenue, gp = health.grossProfit;
    const rr = (ev, d) => d > 0 ? (ev / d).toFixed(2) + "x" : "—";
    out += `<div class="panel"><h2>Ratios on the same basis</h2>

      ${fmt(gp)} ${esc(U)} — the model's base year, the last actual, not a forward estimate.
      Gross profit is the house definition, revenue − cost of sales, with depreciation on its own
      line (convention E1). The same denominator is used for every case and for the market, so the
      column is a like-for-like comparison of numerators.</p>
      <div class="scroll"><table>
      <thead><tr><th>Case</th><th style="text-align:right">EV (${esc(U)})</th>
      <th style="text-align:right">EV / Revenue</th>
      <th style="text-align:right">EV / Gross profit</th></tr></thead><tbody>
      ${rows.map(({case: c, v}) => `<tr><td class="${caseCls(c)}">${c}</td>
        <td class="n">${fmt(v.ev)}</td><td class="n">${rr(v.ev, rev)}</td>
        <td class="n">${rr(v.ev, gp)}</td></tr>`).join("")}
      ${MB && MB.ok ? `<tr class="tot"><td>market</td><td class="n">${fmt(MB.impliedEV)}</td>
        <td class="n">${rr(MB.impliedEV, rev)}</td>
        <td class="n">${rr(MB.impliedEV, gp)}</td></tr>` : ""}
      </tbody></table></div></div>`;

    /* ---- 4. where the value sits ----------------------------------------- */
    out += `<div class="panel"><h2>Where the value sits</h2>
      <p class="note">Five explicit forecast years, then a Gordon terminal on the fifth year's free
      operating cash flow. The terminal share is <b>pvTerminal ÷ EV</b>, shown here as a percentage.
      Where the explicit years carry NEGATIVE present value the share exceeds 100%: the terminal is
      then paying for the explicit period as well as for itself, and the whole valuation rests on
      cash flows beyond year five.</p>
      <div class="scroll"><table>
      <thead><tr><th>Case</th><th style="text-align:right">PV explicit (5y)</th>
      <th style="text-align:right">PV terminal</th><th style="text-align:right">EV</th>
      <th style="text-align:right">Terminal share</th><th></th></tr></thead><tbody>
      ${rows.map(({case: c, v}) => {
        // A share of a negative whole is not a share. Where EV itself is below
        // zero the ratio is two negatives and says nothing about composition.
        const meaningless = v.ev <= 0;
        const sh = (!meaningless && typeof v.terminalSharePct === "number")
          ? v.terminalSharePct * 100 : null;
        const over = sh !== null && sh > 100;
        return `<tr><td class="${caseCls(c)}">${c}</td>
        <td class="n" style="${v.pvExplicit < 0 ? "color:var(--block)" : ""}">${fmt(v.pvExplicit)}</td>

        <td class="n" style="${v.ev < 0 ? "color:var(--block)" : ""}">${fmt(v.ev)}</td>

          meaningless ? "n/a" : sh === null ? "—" : sh.toFixed(1) + "%"}</td>
        <td style="width:150px;font-size:11px;color:var(--block)">${meaningless
          ? "enterprise value is not positive — a share of it is not a proportion"
          : `<div class="bar"><i style="width:${Math.min(100, Math.abs(sh || 0)).toFixed(1)}%"></i></div>`}</td></tr>`;
      }).join("")}
      </tbody></table></div>
      <p class="note" style="color:var(--wait)"><b>Units.</b> The stored field
      <code>terminalSharePct</code> is a FRACTION, not a percentage: 1.86 means 186%. Reading it as
      a percentage understated a terminal contribution by two orders of magnitude on two published
      pages before it was caught. The column above multiplies by 100 exactly once.</p></div>`;

    /* ---- 4b. relative expensiveness against the recorded peer set -------- */
    if (!PM) {
      out += `<div class="panel"><h2>Relative expensiveness · peers</h2>
        <p class="note" style="color:var(--wait)">No peer-multiples file for this subject. Run
        <code>tools/fetch_market_inputs.py --peer-multiples</code> on the market venv. Nothing is
        estimated in its place.</p></div>`;
    } else {
      const ok = PM.players.filter(p => p.usable);
      const bad = PM.players.filter(p => !p.usable);
      const subj = ok.find(p => p.isSubject);

      out += `<div class="panel"><h2>Relative expensiveness · the recorded peer set

        that is deliberate. One provider, one moment, one definition of enterprise value, so the
        players are comparable to each other. Enterprise value is market capitalisation plus total
        debt less cash and short-term investments, computed here rather than read from the
        provider's own field, so no player is on a different definition from the rest.</p>
        <div class="scroll"><table>
        <thead><tr><th>Player</th><th>Listing</th><th style="text-align:right">Fiscal year</th>

        <th style="text-align:right">ROIC proxy*</th></tr></thead><tbody>
        ${ok.map(p => `<tr${p.isSubject ? ' style="background:rgba(198,165,83,.07)"' : ""}>
          <td${p.isSubject ? ' style="color:var(--brass);font-weight:600"' : ""}>${esc(p.ticker)}${

          <td style="font-family:var(--mono);font-size:11px;color:var(--ink-faint)">${esc(p.listing)}${
            p.listing !== p.ticker ? " ⚑" : ""}</td>
          <td class="n" style="font-size:11px;color:var(--ink-faint)">${esc(p.fiscalYearEnd || "—")}
            <br>${esc(p.currency)}</td>
          ${COLS.map(([k, , dp]) => cell(p, k, dp)).join("")}
          <td class="n" style="${p.roicProxy === null ? "color:var(--block);font-size:11px"
            : p.roicProxyUnstable ? "color:var(--wait)" : ""}">${
            p.roicProxy === null ? "n/a" : (100 * p.roicProxy).toFixed(1) + "%"

        <tr class="tot"><td>Median of ${ok.length}</td><td></td><td></td>

          <td class="n">${(() => { const m = median(ok.map(p => p.roicProxy));
            return m === null ? "—" : (100 * m).toFixed(1) + "%"; })()}</td></tr>
        </tbody></table></div>

        ${subj ? `<p class="note">${COLS.map(([k, label]) => {
          const r = peerRank(ok, k, subj.ticker);
          if (!r) return `<b>${label}</b>: not ranked, the subject's own figure is n/a.`;
          return `<b>${label}</b>: ${esc(subj.ticker)} is ${r.rank} of ${r.of}, ${
            r.rank === 1 ? "the CHEAPEST in the set"
            : r.rank === r.of ? "the DEAREST in the set"

        }).join(" ")}</p>` : ""}

        ${bad.length ? `<p class="note" style="color:var(--block)"><b>${bad.length} player${
          bad.length > 1 ? "s" : ""} left out rather than part-filled.</b> ${bad.map(p =>

        <p class="note" style="color:var(--wait)"><b>*The ROIC proxy is the weakest column here,
        and it is not the ROIC on this page.</b> It is EBIT × (1 − 21%) over FINANCING-side
        invested capital — total debt plus equity less cash — while the model's ROIC strikes
        NOPLAT on OPERATING-side invested capital (working capital + PP&amp;E + other operating
        assets) and on the prior year. Two different measures of the same word.
        ${subj && subj.roicProxy !== null && EVA_HISTORY && EVA_HISTORY.rows.length
          && EVA_HISTORY.rows[EVA_HISTORY.rows.length - 1].roic !== null
          ? `On ${esc(subj.ticker)} the proxy reads
             <b>${(100 * subj.roicProxy).toFixed(1)}%</b> against the model's
             <b>${pct(EVA_HISTORY.rows[EVA_HISTORY.rows.length - 1].roic, 1)}</b> for the same

          : `The subject's own proxy is not computable, which is itself the calibration: read the

        <p class="note" style="color:var(--wait)"><b>Three reasons not to over-read this table.</b>

          : "the year-ends differ"}, so the multiples are priced today against trailing periods up

          ? `this subject's own model claims <b>${esc(PM.subjectGrossProfitBasis.claimed)}</b>,
             ${PM.subjectGrossProfitBasis.sameLineAsProvider
               ? `nominally the same line as the provider's — but the provider's cost of
                  revenue is its own normalisation of the filing and the house one is the
                  extraction's, so compare them rather than assuming they tie`
               : `a different measurement from the provider's, so a ratio between the two

             Nothing on this page is depreciation-free: the golden carries one

             basis`
          : `this file predates the basis being recorded, so what the house line is on is not

        ${ok.some(p => p.listing !== p.ticker) ? `<p class="note" style="color:var(--wait)">

          `${esc(p.ticker)} → ${esc(p.listing)}`).join(", ")} — and an enterprise value built from

          dimensionless, so they still compare across the set.</p>` : ""}
        </div>`;
    }

    /* ---- 5. did the last three years earn their cost of capital? -------- */
    if (EVA_HISTORY) {
      const E = EVA_HISTORY, w = E.wacc;
      const verdict = r => r.eva > 0 ? "created" : "destroyed";
      out += `<div class="panel"><h2>Economic value created · the last ${E.rows.length} reported
        year${E.rows.length > 1 ? "s" : ""}</h2>
        <p class="note">This is the model's spine, pointed backwards. ROIC against WACC on the
        years that actually happened, using the engine's own definitions: NOPLAT = EBIT ×
        (1 − ${pct(E.taxRate)}), invested capital = operating working capital + PP&amp;E + other

        Economic profit is NOPLAT less a capital charge at the W1 mid rate of
        <b>${pct(w.waccMid)}</b> — the same identity the engine uses forward, so the history and
        the forecast are one measure.</p>
        <div class="scroll"><table>
        <thead><tr><th>Year</th>
        <th style="text-align:right">Invested capital<br><span style="font-weight:400;font-size:10px;color:var(--ink-faint)">prior year</span></th>
