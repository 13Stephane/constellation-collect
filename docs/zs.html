<!doctype html>
<!-- Constellation console. Served by serve_console.py, which injects state and
     proxies chat to the configured provider. The page never holds an API key. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation console</title>
<style>
  :root {
    --ground:#0F2426; --surface:#17383B; --raised:#1D4145; --rule:#2B5054;
    --ink:#F4F0E9; --ink-soft:#AFC3C0; --ink-faint:#7E9895;
    --brass:#C6A553; --brass-bg:#2B3B33;
    --pass:#8FCE9A; --block:#E0A3A3; --wait:#C6A553;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display:grid; grid-template-columns: minmax(0,1fr) 420px;
  }
  @media (max-width: 980px) { body { grid-template-columns: 1fr; } #chat { border-left:none; border-top:1px solid var(--rule); } }

  /* ---- left: the numbers ---- */
  main { overflow-y:auto; padding:26px 30px 60px; }
  h1 { font-family:var(--serif); font-size:22px; font-weight:600; margin:0; }
  h2 { font-family:var(--serif); font-size:16px; font-weight:600; margin:0 0 12px; }
  .eyebrow { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
             text-transform:uppercase; color:var(--ink-faint); }
  .sub { color:var(--ink-soft); margin:8px 0 0; font-size:13.5px; }
  header { border-bottom:2px solid var(--brass); padding-bottom:16px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:3px;
          border:1px solid var(--rule); color:var(--ink-soft); }
  .chip.pass{ color:var(--pass); border-color:transparent; background:#1E3B2C; }
  .chip.block{ color:var(--block); border-color:transparent; background:#3B2325; }
  .chip.wait{ color:var(--wait); border-color:transparent; background:#33301F; }

  nav { display:flex; gap:2px; margin:22px 0 18px; flex-wrap:wrap; }
  nav button {
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:transparent; color:var(--ink-faint); border:1px solid var(--rule);
    padding:7px 13px; cursor:pointer; border-radius:3px;
  }
  nav button:hover { color:var(--ink); border-color:var(--brass); }
  nav button[aria-selected="true"] { color:var(--ground); background:var(--brass);
                                     border-color:var(--brass); font-weight:600; }
  nav button:focus-visible, .ask button:focus-visible, textarea:focus-visible {
    outline:2px solid var(--brass); outline-offset:2px; }

  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
       text-transform:uppercase; color:var(--ink-faint); font-weight:500;
       padding:0 10px 7px 0; border-bottom:1px solid var(--rule); white-space:nowrap; }
  td { padding:7px 10px 7px 0; border-bottom:1px solid rgba(43,80,84,.5);
       font-variant-numeric: tabular-nums; white-space:nowrap; }
  td:first-child, th:first-child { white-space:normal; min-width:190px; }
  td.n { text-align:right; }
  tr.tot td { font-weight:600; border-top:1px solid var(--rule); }

  .panel { background:var(--surface); border:1px solid var(--rule); border-radius:4px;
           padding:16px 18px; margin-bottom:16px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:13px; }
  .kv dt { color:var(--ink-faint); font-family:var(--mono); font-size:11px;
           letter-spacing:.06em; text-transform:uppercase; }
  .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  .note { color:var(--ink-soft); font-size:12.5px; line-height:1.6; margin:10px 0 0; }
  .conv { border-left:2px solid var(--brass); padding:8px 0 8px 12px; margin:12px 0;
          font-size:12.5px; color:var(--ink-soft); }
  .conv b { color:var(--brass); font-family:var(--mono); font-size:11px; }
  .bar { height:6px; background:var(--brass-bg); border-radius:3px; overflow:hidden; min-width:80px; }
  .bar i { display:block; height:100%; background:var(--brass); }
  .empty { color:var(--ink-faint); font-style:italic; font-size:13px; }

  /* ---- right: the conversation ---- */
  #chat { border-left:1px solid var(--rule); background:var(--surface);
          display:flex; flex-direction:column; height:100vh; position:sticky; top:0; }
  #chat header { padding:16px 18px; border-bottom:1px solid var(--rule); border-bottom-width:1px; }
  #log { flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
  .msg { font-size:13.5px; line-height:1.6; }
  .msg .who { font-family:var(--mono); font-size:10px; letter-spacing:.12em;
              text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:5px; }
  .msg.you .body { background:var(--raised); padding:9px 12px; border-radius:4px; }
  .msg.err .body { color:var(--block); font-family:var(--mono); font-size:12px;
                   background:#3B2325; padding:10px 12px; border-radius:4px; white-space:pre-wrap; }
  .msg .body { white-space:pre-wrap; }
  .msg .body table { margin:8px 0; }
  .seed { display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 12px; }
  .seed button { font-size:11.5px; text-align:left; background:transparent; color:var(--ink-soft);
                 border:1px solid var(--rule); padding:6px 10px; border-radius:3px; cursor:pointer; }
  .seed button:hover { border-color:var(--brass); color:var(--ink); }
  .ask { border-top:1px solid var(--rule); padding:12px 18px 16px; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:var(--ground); color:var(--ink);
             border:1px solid var(--rule); border-radius:4px; padding:9px 11px;
             font:inherit; font-size:13.5px; min-height:40px; max-height:160px; }
  .ask button { background:var(--brass); color:var(--ground); border:none; border-radius:4px;
                padding:10px 16px; font-weight:600; cursor:pointer; font-size:13px; }
  .ask button:disabled { opacity:.45; cursor:default; }
  .dots::after { content:"·"; animation: d 1.2s steps(3,end) infinite; }
  @keyframes d { 0%{content:"·"} 33%{content:"· ·"} 66%{content:"· · ·"} }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation:none; content:"· · ·" } }
  .c-bear { color:var(--block); } .c-base { color:var(--brass); } .c-bull { color:var(--pass); }
  .porter { display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:8px; margin-top:6px; }
  .pbox { border:1px solid var(--rule); border-radius:4px; padding:10px 12px; font-size:12px;
          line-height:1.5; color:var(--ink-soft); }
  .pbox b { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
            text-transform:uppercase; margin-bottom:5px; color:var(--ink-faint); }
  .pbox.sup { border-color:var(--pass); }  .pbox.opp { border-color:var(--block); }
  .pbox.none { border-style:dashed; opacity:.65; }
  .flow { display:flex; align-items:stretch; gap:0; flex-wrap:wrap; margin-top:6px; }
  .fnode { flex:1; min-width:150px; border:1px solid var(--rule); border-radius:4px;
           padding:10px 12px; font-size:12px; line-height:1.5; color:var(--ink-soft); }
  .fnode b { display:block; font-size:12.5px; color:var(--ink); margin-bottom:4px; font-family:var(--serif); }
  .farrow { display:flex; flex-direction:column; justify-content:center; padding:0 8px;
            color:var(--brass); font-size:16px; text-align:center; }
  .farrow small { font-size:9.5px; color:var(--ink-faint); font-family:var(--mono); max-width:96px; }
  .status-chip { font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 8px;
                 border-radius:3px; text-transform:uppercase; margin-left:8px; }
  .st-open { background:#33301F; color:var(--wait); }
  .st-decided { background:#1E3B2C; color:var(--pass); }
</style>
</head>
<body>

<main>
  <header>
    <div class="eyebrow">Constellation · console</div>
    <h1 id="firm">—</h1>
    <p class="sub" id="strap">—</p>
    <div class="chips" id="chips"></div>
  </header>

  <nav id="tabs" role="tablist"></nav>
  <div id="view"></div>
</main>

<aside id="chat">
  <header>
    <div class="eyebrow">Conversation</div>
    <div class="sub" id="provider" style="margin-top:6px">—</div>
  </header>
  <div id="log"></div>
  <div class="seed" id="seed"></div>
  <form class="ask" id="ask">
    <textarea id="q" rows="1" placeholder="Ask about these numbers…" aria-label="Ask about these numbers"></textarea>
    <button type="submit" id="send">Ask</button>
  </form>
</aside>

"2028-08-01", "shift_pct": -3.5}, "shape": "level_shift"}], "falsifier": {"condition": "RECO - Gross margin stays at or above 76.0% in FY2027 and FY2028", "resolution_date": "2028-09-30", "source_tier": 1}, "p_analyst": 0.13, "p_base": 0.1515, "p_railed": 0.1386, "probability_modifiers": [], "source": {"evidence_ref": "Zscaler FY2025 10-K, business section, Competition: the filing describes rivalry as categories rather than named firms, explicitly including vendors that incorporate security capabilities into networking products and other services (lens LR-ZS-P01, recorded there at sector locus and parked; this branch is the firm-located consequence, namely Zscaler's own realised margin).", "label": "Price compression: security bundled into networking and platform contracts erodes the gross margin", "locus": "firm", "locus_note": null, "moat": "value_proposition", "provenance_tier": 1, "type": "structural_threat"}}, {"bite_indicator": {"observable": "Revenue by geography, revenue recognition note, annual", "threshold": "RECO - Either region declines year over year in either fiscal year"}, "branch_id": "BR-ZS-03", "default_prior_used": true, "drivers_perturbed": [{"driver": "apac_revenue", "params": {"bite_date": "2027-08-01", "shift_pct": -9.0}, "shape": "level_shift"}, {"driver": "emea_revenue", "params": {"bite_date": "2027-08-01", "shift_pct": -9.0}, "shape": "level_shift"}], "falsifier": {"condition": "RECO - Neither EMEA nor APAC revenue declines year over year in FY2027 or FY2028", "resolution_date": "2028-09-30", "source_tier": 1}, "p_analyst": 0.11, "p_base": 0.1515, "p_railed": 0.1266, "probability_modifiers": [], "source": {"evidence_ref": "Zscaler FY2025 10-K, revenue recognition note, disaggregation by geography: US 51%, EMEA 30%, APAC 16%, other 3%; the filing states 49% of revenue was from customers outside the United States for all periods presented (lens LR-ZS-F03).", "label": "Non-US demand shock: just under half of revenue is earned outside the United States and the model's revenue terms are regions", "locus": "firm", "locus_note": null, "moat": "customer_relationship", "provenance_tier": 1, "type": "structural_threat"}}, {"bite_indicator": {"observable": "Total contract liabilities, revenue recognition note, against revenue growth", "threshold": "RECO - Contract liability growth trails revenue growth in both years"}, "branch_id": "BR-ZS-04", "default_prior_used": true, "drivers_perturbed": [{"driver": "owc_pct_revenue", "params": {"bite_date": "2028-08-01", "shift_pct": 40.0}, "shape": "level_shift"}], "falsifier": {"condition": "RECO - Contract liabilities grow at least as fast as revenue in FY2027 and FY2028", "resolution_date": "2028-09-30", "source_tier": 1}, "p_analyst": 0.095, "p_base": 0.1515, "p_railed": 0.1176, "probability_modifiers": [], "source": {"evidence_ref": "Zscaler FY2025 10-K: contract liabilities 2,468.0 total and 2,054.4 current, funding operating working capital of -15.51% of revenue (lens LR-ZS-C02). A move toward zero working capital removes a financing source the base case assumes persists.", "label": "Customer prepayment weakens: deferred balances grow slower than revenue and the negative working capital unwinds", "locus": "firm", "locus_note": null, "moat": "financial_structure", "provenance_tier": 1, "type": "structural_threat"}}], "coherence": {"conservation_tolerance": 0.02, "envelope_status": "pass", "erosion_envelope": 0.6061, "override_justification": null, "prior_sum": 0.5334}, "excluded_threats": [], "hash_sha256": null, "horizon_years": 5, "lambda": 0.4, "methodology_version": "v16", "provenance": [{"object_id": "zs_golden_schema_v3_2026-08-14", "product_name": "constellation_valuation_track_b", "schema_version": "constellation_model_schema_v3"}, {"object_id": "p4_fade_atlas_prototype_v0_1", "product_name": "p4_fade_atlas", "schema_version": "fade_atlas_v0_1"}, {"object_id": "zs_scenario_config_2026-08-14", "product_name": "scenario_derive_config", "schema_version": "scenario_config_v0_1"}, {"object_id": "zs_threat_register_DRAFT_2026-08-14", "product_name": "threat_register", "schema_version": "threat_register_v0_1"}], "schema_version": "scenario_set_v0_1", "sector_map": {"atlas_sector": "Business equipment / tech", "grade": "working", "hold": 0.83, "n": 196, "panel": "simfin_2020_2024", "phi": 0.84, "pooled_phi_substituted": false}, "spec_version": "scenario_derivation_spec_v0_1", "subject": {"drivers_file": "zs_drivers.json", "drivers_sha256": "52b367fc9ffff07b240bce0b524ebbc64422c5945af456f37c77adef3fa60a9b", "engine_version": "track_b_0.4", "firm": "ZSCALER, INC.", "ticker": "ZS"}, "_path": "/Users/stegue/constellation/reads/00_methodology/scenario_sets/scenario_set_v0_1_ZS_r03.json"}, "reading": {"_authored": "Authored 14 Aug 2026 from this subject's recorded findings: the lens register, the conventions log, the threat register and the derived scenario set r01. Not derivable, and not generated by any tool.", "title": "Zscaler, as this model holds it", "lede": ["Zscaler sells cloud security as a subscription, routing enterprise traffic through its own platform rather than through appliances. Revenue ran 673.1 to 2,673.1 (USD millions) over FY2021-25, a 41% compound rate, and the company reached FY2025 with a GAAP net loss of 41.5.", "The engine's base case values the enterprise at 561 with a bear-bull range of -4,931 to 4,106, or 7.89 per share against -26.80 and 30.29, discounted at a CONSTRUCTED W1 band of 8.45 / 9.64 / 10.22 per cent. Read that range first: it crosses zero, and it does so because the entire valuation rests on one ratio."], "sections": [{"heading": "Main findings", "items": [{"title": "1 \u00b7 The value is a single bet on operating leverage", "body": "opex_pct_revenue carries an enterprise-value span of 7,520 in the tornado. The next driver, gross margin, carries 1,983, and capex 908. Nothing else is close. The base case has the ratio falling from 78.0% of revenue to 62.0% by FY2030, which is a continuation of what the company has actually delivered: 92.1% in FY2023, 83.6% in FY2024, 78.0% in FY2025. If that trajectory continues, the equity is worth something; if it stalls, it is not. Branch BR-ZS-01 is that stall, at a railed 15.06%."}, {"title": "2 \u00b7 The reported loss is not the owner's cost", "body": "Stock-based compensation of 661.4 in FY2025 is sixteen times the reported net loss of 41.5, and the accumulated deficit stands at -1,189.6 against book equity of 1,799.3: the equity on the balance sheet is paid-in capital, not earnings retained. This model expenses that compensation, because it is a real transfer from owners to employees. That single choice is most of the distance between this valuation and the market's."}, {"title": "3 \u00b7 Customers fund the business", "body": "Contract liabilities of 2,468.0 exceed four times the annual cost of revenue, and operating working capital sits at -15.51% of revenue. Growth releases cash here rather than absorbing it, which is why a company with negative GAAP operating income is not a financing problem. Branch BR-ZS-04 asks what happens if that unwinds."}, {"title": "4 \u00b7 There is no customer to lose", "body": "The filing states plainly that no end customer contributed more than 10% of revenue in FY2023, FY2024 or FY2025. This is the exact inverse of NVIDIA, where two customers take 36% between them and dominate that subject's fragility reading. Zscaler's concentration risk, if it exists, sits in the channel, and the filing does not disclose it."}]}, {"heading": "Where this model departs from the market, and why", "items": [{"title": "The gap is structural, not a rounding error", "body": "A base case of 6.60 per share implies roughly 1.0 billion of equity value on 158.3 million shares. Zscaler's market capitalisation is more than an order of magnitude above that. This model is not attempting to reproduce the market price, and no input here has been tuned toward it."}, {"title": "Three choices explain almost all of it", "body": "First, stock-based compensation is expensed rather than added back; at 24.7 per cent of revenue that is the dominant term, and convention V1 records the decision to keep doing it. Second, investment is measured capex-inclusive from the PP&E roll-forward, and Zscaler spends roughly twice its depreciation on capex, so free cash flow is negative through most of the explicit window. Third, the discount rate is now a constructed W1 band at 9.64 per cent, which is LOWER than the 11.0 per cent placeholder it replaced and therefore raised the valuation. The gap to market survives all three."}, {"title": "The explicit five years have NEGATIVE present value", "body": "CORRECTED 14 Aug 2026: an earlier version of this page said terminal value was 2.3 per cent of enterprise value. That was a units error - the field is a fraction, not a percentage - and the truth is the opposite and more serious. The five explicit years carry a present value of MINUS 483; the terminal carries 1,044; the terminal is therefore 186 per cent of a 561 enterprise value. Everything this model says Zscaler is worth arrives after the forecast horizon, and the forecast period itself destroys value on these paths. A reader should treat the point estimate as far less informative than the range, and should treat the terminal assumption - 2 per cent growth in perpetuity on the final year's free cash flow - as the load-bearing input it is."}]}, {"heading": "What would change the read", "items": [{"title": "The falsifiers, in date order", "body": "By 30 Sep 2028: whether opex falls at least 3 percentage points in each of FY2027 and FY2028 (BR-ZS-01); whether gross margin holds at or above 76.0% (BR-ZS-02); whether EMEA or APAC revenue declines year over year (BR-ZS-03); whether contract liabilities keep pace with revenue (BR-ZS-04). Each is checkable in an annual filing, and each was written before the outcome is known."}], "note": "Base case 46.66% that no recorded branch bites; branches at 15.06 / 13.86 / 12.66 / 11.76%; prior sum 0.5334 inside an erosion envelope of 0.6061. All DRAFT, none stamped."}, {"heading": "What this model does not contain", "items": [{"title": "The revenue tree carries no mechanism", "body": "Zscaler is a single-segment filer whose only disclosed disaggregation is geographic, so the revenue drivers here are regions. Regions do not express retention, seat expansion or platform attach, which are what actually move this business. The case paths allocate one total-revenue thesis across a fixed mix; they are not four independent regional views, and they should not be read as such."}, {"title": "Eight lens claims, all signed", "body": "All eight claims on the Lenses tab were signed by St\u00e9phane Guerraz on 14 Aug 2026. THE DERIVATION SPECIFICATION WAS RATIFIED on 14 Aug 2026, so this read is citable in client work: the spec permits citation and stamping, and the remaining label on the set is simply that no OTS timestamp has been applied to it yet. Probabilities assume maximum dispersion for every branch, the conservative corner ruled on at \u00a710.1."}]}]}, "specStatus": {"status": "RATIFIED", "detail": "14 August 2026, S", "document": "scenario_derivation_spec_v0_1.md"}, "lensRegister": {"schema_version": "lens_register_v0_1", "subject": {"firm": "ZSCALER, INC.", "ticker": "ZS"}, "provenance": {"product_name": "lens_register", "object_id": "zs_lens_register_2026-08-13", "schema_version": "lens_register_v0_1"}, "ledger_mapping": {"teece": "moat", "value_curve": "value", "porter": "industry", "capital_recovery": "financial", "fragility": "fragility", "culture": "culture"}, "r_convention": "r = min(S, O) / (S + O); S = mass supporting the registered thesis, O = mass opposing it, per branch over the entries that land on that branch", "_build_note": "Opened 13 Aug 2026 against the 0.1-skeleton driver registry, before any threat register or scenario set exists. Every entry is drawn from the FY2025 Form 10-K (accession 0001713683-25-000158, filed 11 Sep 2025) and is tier 1 unless stated. Every entry was SIGNED by St\u00e9phane Guerraz on 14 Aug 2026 after review of the full register sheet: direction confirmed, mass set, citation owned. Note that the driver ids these claims land on are GEOGRAPHIC, because geography is the only revenue disaggregation Zscaler discloses; claims about retention and expansion have nowhere firm-specific to land until the revenue tree is upgraded, which is a known weakness of this register, not of the evidence.", "entries": [{"entry_id": "LR-ZS-C01", "lens": "capital_recovery", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "The near-breakeven GAAP result is reached while a large share of the value created is transferred to employees rather than owners. FY2025 stock-based compensation of 661.4 is 16 times the reported net loss of 41.5, and the accumulated deficit stands at -1,189.6 even though book equity is 1,799.3: the equity on the balance sheet is paid-in capital, not earnings retained. Any opex path that assumes the reported loss is the cost of running the business understates the owner's cost.", "direction": "opposes_thesis", "drivers": ["opex_pct_revenue"], "mass": 4, "magnitude_basis": "FY2025: SBC 661.4 = 24.7% of revenue 2,673.1; net loss 41.5; accumulated deficit -1,189.6 against equity 1,799.3. SBC rose 444.8 -> 527.7 -> 661.4 over FY2023-25, faster than revenue in FY2024 and roughly in line in FY2025. What is NOT quantified here: the buyback offset, and the dilution actually realised per share, which needs the share count roll-forward rather than the expense line.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158 (filed 2025-09-11): consolidated statements of cash flows (stock-based compensation), consolidated balance sheets (accumulated deficit, total stockholders' equity), consolidated statements of operations (net loss).", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-C02", "lens": "capital_recovery", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "Customers fund the working capital. Contract liabilities of 2,468.0 exceed four times the annual cost of revenue, and operating working capital anchors at -15.5% of revenue, so growth releases cash into the business instead of absorbing it. The capital recovery question for this firm is not whether growth is financeable but whether the deferred balance keeps pace with it.", "direction": "supports_thesis", "drivers": ["owc_pct_revenue"], "mass": 4, "magnitude_basis": "FY2025 contract liabilities 2,468.0 total, 2,054.4 current, against cost of revenue 618.2. The owc anchor of -0.1551 is computed by the registry from the extraction, under cashPolicy operatingCashPctRevenue = 0.0, so it excludes the cash balance entirely; a different cash policy moves the level but not the sign.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158: contract liabilities in the revenue recognition note; owc anchor computed in inputs/zs/zs_golden_source.json drivers.anchors.owc_pct_revenue.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-T01", "lens": "teece", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "Revenue is largely pre-contracted. Remaining performance obligations of 5,780.1 are 2.16 times FY2025 revenue, and the backlog grew faster than revenue did, so the appropriability of the platform's value is showing up as contract duration rather than only as price.", "direction": "supports_thesis", "drivers": ["us_revenue", "emea_revenue", "apac_revenue", "other_regions_revenue"], "mass": 4, "magnitude_basis": "RPO 3,513.6 -> 4,417.6 -> 5,780.1 over FY2023-25, a 30.8% increase in FY2025 against revenue growth of 23.3%; coverage rose from 2.04x to 2.16x. The claim lands on all four regional drivers because RPO is not disaggregated by region: this is the register inheriting the revenue tree's weakness, and the mass should not be read as regionally specific.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158: remaining performance obligation disclosure in the revenue recognition note.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-F01", "lens": "fragility", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "There is no end-customer concentration to inherit. The filing states plainly that no end customer contributed more than 10% of revenue in any of the last three fiscal years, so no revenue path here depends on the purchasing decision of a single counterparty. This is the direct opposite of the concentration that dominates the NVDA register, and it is the strongest structural point in Zscaler's favour on this lens.", "direction": "supports_thesis", "drivers": ["us_revenue", "emea_revenue", "apac_revenue", "other_regions_revenue"], "mass": 3, "magnitude_basis": "Filing statement covering fiscal 2025, 2024 and 2023. What this does NOT cover is channel concentration: Zscaler sells through a channel model, and the 10-K's customer-concentration statement is about end customers. Whether a small number of resellers intermediate a large share of revenue is a separate question this entry does not answer, and it is precisely where Rubrik's register finds its largest fragility.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158, business section: 'No end customer contributed more than 10% of our revenue in fiscal 2025, fiscal 2024 and fiscal 2023.'", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-F02", "lens": "fragility", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "Sales costs are capitalised and released over several years, so the reported operating expense ratio lags the bookings that drive it. A slowdown in new bookings would show up in opex slowly while the capitalised asset unwinds, making the opex path look better than the underlying sales motion for a year or more.", "direction": "opposes_thesis", "drivers": ["opex_pct_revenue", "other_op_assets_scaling_pct_revenue"], "mass": 3, "magnitude_basis": "Capitalised contract costs, net: 375.2 -> 445.4 -> 509.5 over FY2023-25, with 166.3 of amortisation of deferred contract acquisition costs charged in FY2025 (up from 130.1 and 98.7). The asset is roughly 19% of revenue. The lag length depends on the amortisation period, which this entry does not pin down.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158: deferred contract acquisition costs note, and the amortisation line in the consolidated statements of cash flows.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-F03", "lens": "fragility", "channel": "driver", "locus": "mixed", "locus_note": "Regional demand conditions, currency and public-sector budget cycles are sector-wide and would be demeaned away. The firm-specific component that survives is Zscaler's own regional mix, and more sharply, the fact that in THIS model the revenue drivers ARE regions: a regional shock lands directly on a named driver here in a way it would not in a model whose revenue tree was built on retention and seat expansion. The exposure is structural to the registry, not only to the market.", "claim": "Just under half of revenue is earned outside the United States, and the model's revenue terms are the regions themselves, so any regional demand or currency shock transmits straight into a driver path with no intermediate mechanism to absorb it.", "direction": "opposes_thesis", "drivers": ["emea_revenue", "apac_revenue", "other_regions_revenue"], "mass": 2, "magnitude_basis": "FY2025 mix: United States 51%, EMEA 30%, APAC 16%, other 3%; the filing states 49% of revenue was from customers outside the United States for all periods presented. Mass is held low deliberately: the exposure is real but the driver tree is a weak instrument for it, and inflating mass here would give a methodological artefact the standing of evidence.", "evidence_ref": "Zscaler FY2025 Form 10-K, accession 0001713683-25-000158: revenue recognition note, disaggregation of revenue by geography, and the business section statement on non-US revenue.", "provenance_tier": 1, "status": "signed", "signed_by": "St\u00e9phane Guerraz", "signed_on": "2026-08-14", "signature_note": "Signed after review of the full register sheet, 14 Aug 2026. Entries for ZS and RBRK were drafted in session and reviewed before signature; ASML and NVDA entries predate that session."}, {"entry_id": "LR-ZS-V01", "lens": "value_curve", "channel": "driver", "locus": "firm", "locus_note": null, "claim": "The platform is priced far above its cost o on": "opposes_thesis", "mass": 2, "tier": 1, "status": "signed", "claim": "Just under half of revenue is earned outside the United States, and the model's revenue terms are the regions themselves, so any regional demand or currency shock transmits straight into a driver path with no intermediate mechanism to absorb it."}]}, {"branch_id": "BR-ZS-04", "label": "Customer prepayment weakens: deferred balances grow slower than revenue and the negative working capital unwinds", "S": 4, "O": 0, "r": 0.0, "entries": [{"entry_id": "LR-ZS-C02", "lens": "capital_recovery", "direction": "supports_thesis", "mass": 4, "tier": 1, "status": "signed", "claim": "Customers fund the working capital. Contract liabilities of 2,468.0 exceed four times the annual cost of revenue, and operating working capital anchors at -15.5% of revenue, so growth releases cash into the business instead of absorbing it. The capital recovery question for this firm is not whether growth is financeable but whether the deferred balance keeps pace with it."}]}], "unmatched": [], "drafts": 0, "total": 8}, "conventionsLog": {"schema_version": "conventions_log_v0_1", "subject": {"firm": "ZSCALER, INC.", "ticker": null}, "provenance": {"product_name": "conventions_log", "object_id": "collect_0001713683", "schema_version": "conventions_log_v0_1"}, "_discipline": "Seeded by collect_statements.py with the stances the extraction took. Only the curator moves a convention to decided.", "conventions": [{"id": "E1", "title": "Cost-of-sales basis", "owner": "collect_extraction", "status": "open", "interim_default": "E1: costOfSales is as reported and may include production depreciation (unlike the depreciation-free ASML reference basis); sga is the residual keeping EBIT exact, so EBIT/NOPLAT and derived cash flows are exact while the gross-margin level is not cross-basis comparable.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "E3", "title": "Operating vs excess cash", "owner": "collect_extraction", "status": "open", "interim_default": "E3: operatingCash carries the total cash balance; no operating/excess split exists in XBRL.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "E4", "title": "No reported cash flow statement", "owner": "collect_extraction", "status": "open", "interim_default": "E4: no reported cash flow statement emitted; the identity-derived one ties by construction on this mapping.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "T1", "title": "Tax basis: statutory vs effective", "owner": "curator", "status": "decided", "interim_default": "T1: assumptions.taxRate = 0.2100 is CURATOR-SUPPLIED (--tax-rate), not extracted. The latest fiscal year's effective rate is -1.2677, unusable as a NOPLAT rate. The basis for the supplied rate is the curator's to record here.", "resolution_path": "Curator decision of 13 Aug 2026, taken because the extraction gate refused: FY2025 tax expense of 23.2 on a pre-tax loss of -18.3 gives an effective rate of -126.77%, outside schema v3's [0,1] and meaningless as a NOPLAT rate. Same basis as the RBRK decision of the same date, so the two loss-makers stay comparable.", "resolution": "0.21, the US federal statutory rate, as the marginal rate a profitable Zscaler would pay. NOT a cash rate: Zscaler carries large NOL carryforwards and a valuation allowance, and its tax expense is mostly foreign and state tax on a GAAP loss. When that loss closes \u2014 pre-tax was -18.3 in FY2025 against -29.2 in FY2024, so it is closing \u2014 the effective rate becomes meaningful and this convention should be re-taken on evidence rather than left at statutory.", "decided_on": "2026-08-13"}, {"id": "V0", "title": "WACC unset", "owner": "collect_extraction", "status": "open", "interim_default": "assumptions.wacc = null: valuation input, never extracted.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "C1", "title": "Hand-transcribed statement line", "owner": "collect_extraction", "status": "open", "interim_default": "C1: depreciation, longTermDebt is CURATOR-SUPPLIED, read off the filing by hand because no annual 10-K XBRL fact exists for it. Source: Zscaler 10-K consolidated statements of cash flows, line 'Depreciation and amortization expense', in USD (filings state thousands). FY2023-FY2025 from the FY2025 10-K, accession 0001713683-25-000158 (filed 2025-09-11); FY2021-FY2022 from the FY2023 10-K, accession 0001713683-23-000113 (filed 2023-09-14). FY2023 appears in both filings at 55,756 thousand and agrees. TRANSCRIBED BY HAND because the companyfacts API carries only us-gaap and dei elements, and Zscaler tags this line with a custom extension, zs:DepreciationDepletionAndAmortizationExcludingAmortizationOfDeferredContractCosts, which the API therefore never returns. BASIS, AND WHAT A REVIEWER SHOULD CONTEST: this is the PP&E-consistent charge. It EXCLUDES amortisation of acquired intangibles (16,820 in FY2025), of deferred contract acquisition costs (166,310), and of debt issuance costs (4,293), each a separate cash-flow line. It was chosen over total D&A because the house identity derives capex as delta-PPE + depreciation, so an intangibles-inclusive figure would overstate implied capex. NOTE THE ASYMMETRY: NVDA's golden uses us-gaap:DepreciationDepletionAndAmortization, which DOES include intangibles amortisation, so the two subjects are not on the same D&A basis and their implied-capex series are not directly comparable. Zscaler consolidated balance sheets, convertible senior notes, current plus noncurrent, in USD. FY2025 and FY2024 from the FY2025 10-K, accession 0001713683-25-000158: 'Convertible senior notes, noncurrent' 1,700,727 at 2025-07-31 and 0 at 2024-07-31; 'Convertible senior notes' (current) 0 at 2025-07-31 and 1,142,275 at 2024-07-31. FY2021-FY2023 from us-gaap:LongTermDebt and us-gaap:ConvertibleLongTermNotesPayable in companyfacts, which agree. WHY THIS IS SUPPLIED RATHER THAN EXTRACTED: Zscaler refinanced during FY2025, and the new notes sit under us-gaap:ConvertibleLongTermNotesPayable, which this map's debt candidates do not carry. The extractor would otherwise have carried FY2024's 1,142.3 forward and understated FY2025 net debt by 558.4 million. Current-portion converts are included because the field feeds net debt, matching how NVDA's golden sums noncurrent and current.. Every other line on this file is extracted; this one is transcribed, so it carries transcription risk the XBRL lines do not.", "resolution_path": null, "resolution": null, "decided_on": null}, {"id": "V1", "title": "Stock-based compensation: expensed, never added back", "owner": "curator", "status": "decided", "interim_default": "V1: the model charges stock-based compensation in full. The extraction's sga line is the residual that holds EBIT exact (stance E1), so GAAP operating expense including SBC flows into the opex_pct_revenue driver, and every NOPLAT, free cash flow, enterprise value and per-share figure downstream is therefore AFTER stock compensation. There is no add-back anywhere in the chain.", "resolution_path": "Raised 14 Aug 2026 because it is the single largest cause of the gap between these reads and market prices, across every subject in the set. Market and sell-side practice is generally to value these businesses on cash flow with SBC added back. The magnitudes are not marginal: SBC is 24.7% of revenue at Zscaler and 25.0% at Rubrik, and at Zscaler it is sixteen times the reported net loss. NVIDIA last traded at 225.30 against a 52.16 base case; Zscaler's base case implies roughly 1.0bn of equity against a market capitalisation more than an order of magnitude larger. If this convention is wrong, every valuation in the system is wrong in the same direction and by a large factor.", "resolution": "KEEP EXPENSING. Stock compensation is a real transfer of value from owners to employees, and adding it back values a business as though its labour were partly free. THE TREATMENT IS INTERNALLY CONSISTENT AS IT STANDS, and that consistency is the substance of the decision: the model charges the cost through the income statement AND holds shares outstanding flat at the last actual count, so the cost is counted exactly once. Adding SBC back while growing the share count would also count it once; doing both, or neither, would be wrong. WHAT THIS COSTS: subjects with heavy SBC look severely cheap-to-worthless against their market prices, and this model will keep saying so. That is the intended behaviour, not a defect to be tuned away. REVIEW TRIGGERS, any one of which reopens this: (1) a dilution or share-count path is added to the projection \u2014 at that point expensing SBC as well would double-count it, and one of the two must go; (2) the model is used for any claim relative to a market price or a market multiple, rather than as a standalone read, since the comparison is then between two different definitions of earnings; (3) a subject's SBC falls below about 5% of revenue, where the choice stops changing the answer and the convention can be retired for that name; (4) the derivation specification is ratified, at which point every open convention is re-taken anyway.", "decided_on": "2026-08-14"}, {"id": "S1", "title": "No one-time margin shock in the v0.1 shape set", "owner": "curator", "status": "decided", "interim_default": "S1: this subject's threat register perturbs margin, cost and working-capital ratios with level_shift, which \u00a73.2 permitted only for volume, unit and share drivers at the time the register was written.", "resolution_path": "Raised because level_shift was used on margin and cost-ratio drivers, outside \u00a73.2's stated applicability. Surfaced as a ratification blocker on 14 Aug 2026: \u00a710.5 asks to ratify the shape set as closed, which could not be done honestly while a third of the live corpus breached the applicability column.", "resolution": "CLOSED AT RATIFICATION, 14 Aug 2026. Ratification of scenario_derivation_spec_v0_1 widened \u00a73.2's applicability column for level_shift to include ratio drivers (margin, cost, working-capital and tax ratios). The shape's definition - a one-time shift of X% at the bite date, held thereafter - already described this mechanism exactly; the restriction to volume, unit and share drivers predated the existence of margin-threat branches. Six live branches across NVDA, ZS and RBRK were affected and are now compliant as written. No shape was added, removed or redefined, so \u00a73.2 remains closed at four shapes.", "decided_on": "2026-08-14"}]}, "deriveConfig": {"subject": {"firm": "ZSCALER, INC.", "ticker": "ZS", "engine_version": "track_b_0.4", "drivers_file": "zs_drivers.json"}, "horizon_years": 5, "lambda": 0.4, "atlas_sector": "Business equipment / tech", "atlas_mapping_basis": "DECISION FOR REVIEW. The registry arena is 'cloud-security-saas'; the P4 fade atlas has no such cell, so no exact mapping exists. Business equipment / tech is the nearest available: it is the Fama-French tech grouping, it is the atlas's best-populated cell (n = 196), and it is the cell ASML and NVDA both map to, which keeps all three subjects on one persistence rate. phi 0.84 implies a competitive-advantage period of about 6.4 years. WHAT THIS ASSUMES, and what a reviewer should contest: that a subscription security platform's relative-ROIC advantage decays like the broad tech grouping's. Zscaler's realised ROIC is NEGATIVE on the house basis, because GAAP operating income is negative once stock-based compensation is expensed, so the subject sits outside the population the atlas cell was estimated on in the opposite direction from NVIDIA. The mapping may therefore be close to meaningless for this name until the operating leverage in the base case actually arrives. Alternatives considered: pooled phi 0.73 if the curator judges the tech cell unrepresentative. Recorded, not defaulted.", "atlas_provenance": {"product_name": "p4_fade_atlas", "object_id": "   const vals = tiers.map(([id]) => PATHS0[id] ? PATHS0[id][0] : null);
  if (vals.some(v => v === null)) return "";
  const W=560,H=210,L=52,B=30,T=16,R=14, ymax=280;
  const x=(i)=>L+i*(W-L-R)/(tiers.length-1), y=(v)=>T+(H-T-B)*(1-v/ymax);
  const pts = vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Offer curve: ASP by product tier" style="max-width:100%">
    ${[0,70,140,210,280].map(g=>`<line x1="${L}" y1="${y(g)}" x2="${W-R}" y2="${y(g)}" stroke="var(--rule)" stroke-width="0.5"/>
      <text x="${L-6}" y="${y(g)+3.5}" text-anchor="end" font-size="9" fill="var(--ink-faint)" font-family="monospace">${g}</text>`).join("")}
    <text x="${L}" y="${T-6}" font-size="9" fill="var(--ink-faint)" font-family="monospace">EUR m / system</text>
    <polyline points="${pts}" fill="none" stroke="var(--brass)" stroke-width="2"/>
    ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--brass)"/>
      <text x="${x(i)}" y="${y(v)-9}" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-family="monospace">${v}</text>
      <text x="${x(i)}" y="${H-9}" text-anchor="middle" font-size="10" fill="var(--ink-soft)">${tiers[i][1]}</text>`).join("")}
  </svg>`;
}

function derivedCF() {
  // Cash flow by IDENTITY from the two statements: every balance line is used
  // exactly once, so the total ties to the change in cash by construction.
  // Not the reported statement — that is absent from schema v3 (convention E4).
  const inc = G.income, bal = G.balance, ys = G.years;
  const ni = ys.map((_, t) => inc.revenue[t] - inc.costOfSales[t] - inc.depreciation[t]
    - inc.sga[t] + inc.interestIncome[t] - inc.interestExpense[t] - inc.incomeTaxes[t]);
  const d = (arr, t) => arr[t] - arr[t - 1];
  const rows = [];
  const push = (label, fn, cls) => rows.push({label, vals: ys.slice(1).map((_, i) => fn(i + 1)), cls});
  push("Net income", t => ni[t]);
  push("+ Depreciation & amortisation", t => inc.depreciation[t]);
  push("− Δ other current operating assets", t => -d(bal.otherCurrentAssets, t));
  push("+ Δ accounts payable & accrued", t => d(bal.accountsPayable, t));
  push("+ Δ other non-interest liabilities (incl. prepayments)", t => d(bal.otherNonInterestLiab, t));
  push("Cash from operations", t => ni[t] + inc.depreciation[t] - d(bal.otherCurrentAssets, t)
    + d(bal.accountsPayable, t) + d(bal.otherNonInterestLiab, t), "tot");
  push("− Capex incl. (Δ net PPE + depreciation)", t => -(d(bal.ppe, t) + inc.depreciation[t]));
  push("− Δ R&D / other operating assets, net", t => -d(bal.otherOperatingAssets, t));
  push("Cash from investing", t => -(d(bal.ppe, t) + inc.depreciation[t]) - d(bal.otherOperatingAssets, t), "tot");
  push("Δ interest-bearing debt", t => d(bal.longTermDebt, t));
  push("Net shareholder flows (Δ equity − net income)", t => d(bal.equity, t) - ni[t]);
  push("Cash from financing", t => d(bal.longTermDebt, t) + d(bal.equity, t) - ni[t], "tot");
  const dcash = t => ni[t] + inc.depreciation[t] - d(bal.otherCurrentAssets, t)
    + d(bal.accountsPayable, t) + d(bal.otherNonInterestLiab, t)
    - (d(bal.ppe, t) + inc.depreciation[t]) - d(bal.otherOperatingAssets, t)
    + d(bal.longTermDebt, t) + d(bal.equity, t) - ni[t];
  push("Δ cash (derived)", dcash, "tot");
  push("Check: derived Δ cash − reported Δ cash", t => dcash(t) - d(bal.operatingCash, t));
  return rows;
}

               : key === "supplier" ? "suppl|vendor|foundr|source"
               : key === "buyer" ? "buyer|customer|concentrat"
               : "rival|competitor|monopol|only manufacturer|share", "i").test(e.claim));
    const pbox = (key, label, col, row) => {
      const hits = forceHit(key);
      const sup = hits.some(e => e.direction === "supports_thesis");
      return `<div class="pbox ${hits.length ? (sup ? "sup" : "opp") : "none"}"
        style="grid-column:${col};grid-row:${row}"><b>${label}</b>${
        hits.length ? hits.map(e => `${esc(e.claim.slice(0, 150))} ${eref(e.entry_id)}`).join("<br>")
                    : "no claim registered"}</div>`;
    };
    out += `<div class="panel"><h2>Porter · five forces, firm-relative reading only</h2>
      <div class="porter">
        ${pbox("entrants", "New entrants", 2, 1)}
        ${pbox("supplier", "Supplier power", 1, 2)}
        ${pbox("rivalry", "Rivalry", 2, 2)}
        ${pbox("buyer", "Buyer power", 3, 2)}
        ${pbox("substitutes", "Substitutes", 2, 3)}
      </div>
      <p class="note">Forces are matched to registered claims by mechanism, so a box fills only
      when a cited claim speaks to it. Dashed boxes are coverage gaps, visible rather than filled.
      Sector-level five-forces content demeans away in the closed-set frame; only firm-located
      readings are admitted.</p></div>`;

    // Teece as the appropriability chain, with the atlas regime in the middle.
    const teece = byLens("teece");
    if (teece.length) {
      const sm = S ? S.sector_map : null;
      out += `<div class="panel"><h2>Teece · who keeps the value from the innovation</h2>
        <div class="flow">
          <div class="fnode"><b>Innovation</b>${esc(G.company)}, arena
            ${esc((G.drivers || {}).arena || "unmapped")}.</div>
          <div class="farrow">→<small>appropriability</small></div>
          <div class="fnode"><b>Regime check</b>${sm
            ? `Sector fade φ ${sm.phi}, top-tercile hold ${(sm.hold * 100).toFixed(0)}%/yr — the
               empirical rate at which such advantages decay (atlas, ${esc(sm.grade)} grade).`
            : `No atlas sector mapped yet: the persistence rate this claim should be scored
               against is not on file. Mapping happens in the derivation config.`}</div>
          <div class="farrow">→<small>complementary assets</small></div>
          <div class="fnode" style="border-color:var(--pass)"><b>Complementary asset</b>
            ${esc(teece[0].claim.split(":")[0].slice(0, 160))}<br>${eref(teece[0].entry_id)}</div>
        </div>
        <p class="note">Teece is the one lens the calibration loop can eventually score: it claims
        persistence, and the fade atlas measures persistence.</p></div>`;
    }

    // Capital recovery: the claimed driver plotted across the three cases.
    const cap = byLens("capital_recovery");
    if (cap.length) {
      const d = (cap[0].drivers || [])[0];
      const havePaths = d && CASES.bear && CASES.bear.paths[d];
      out += `<div class="panel"><h2>Capital recovery · commitment vs adoption</h2>
        ${havePaths ? `<div class="scroll"><table>
          <thead><tr><th>${esc(d)}</th>${CASE_ORDER.map(c =>
            `<th style="text-align:right" class="${caseCls(c)}">${c} FY${G.years[G.years.length-1] + (G.drivers.horizonYears || 5)}</th>`).join("")}
            <th style="text-align:right">EV span</th></tr></thead><tbody>
          <tr><td>${esc(unitNote(d))}</td>${CASE_ORDER.map(c =>
            `<td class="n ${caseCls(c)}">${driverVal(d, CASES[c].paths[d].slice(-1)[0])}</td>`).join("")}
            <td class="n">${spanOf(d) ? fmt(spanOf(d)) : "—"}</td></tr>
          </tbody></table></div>` : ""}
        ${cap.map(claimCard).join("")}</div>`;
    }

    // Value curve: the ladder across whichever drivers the claim names.
    const vc = byLens("value_curve");
    if (vc.length) {
      const ids = driversOf(vc).filter(id => PATHS0[id] !== undefined);
      out += `<div class="panel"><h2>Value curve · price/margin ladder (strategy canvas pending)</h2>
        ${ids.length ? `<div class="scroll"><table>
          <thead><tr><th>Driver named by the claim</th><th style="text-align:right">unit</th>
          <th style="text-align:right">anchor</th></tr></thead><tbody>
          ${ids.sort((a,b) => (PATHS0[b][0]||0) - (PATHS0[a][0]||0)).map(id =>
            `<tr><td>${esc(id)}</td>
             <td class="n" style="color:var(--ink-faint);font-size:11.5px">${esc(unitNote(id))}</td>
             <td class="n">${driverVal(id, PATHS0[id][0])}</td></tr>`).join("")}
          </tbody></table></div>` : ""}
        ${vc.map(claimCard).join("")}
        <p class="note">This is level evidence from the firm's own drivers, not a Blue Ocean
        strategy canvas: a canvas plots firm vs industry across the factors buyers weigh and needs
        competitor factor scoring the model does not carry. Open item, stated rather than drawn.</p></div>`;
    }

    // Without a threat register there are no branches to land on: show the
    // entries ungrouped rather than crashing or pretending concordance exists.
    if (!C) {
      const side = (e) => e.direction === "supports_thesis"
        ? `<span style="color:var(--pass)">S${e.mass}</span>`
        : `<span style="color:var(--block)">O${e.mass}</span>`;
      const drafts = R.entries.filter(e => e.status === "draft").length;
      return out + `<div class="panel"><h2>Lens claims — ungrouped</h2>
        <p class="note">No threat register exists for this subject yet, so no branch
        mapping and no concordance r can be computed. Claims are shown ungrouped.
        ${drafts ? `<b style="color:var(--wait)">${drafts} of ${R.entries.length}
        entries are draft: proposals awaiting curator sign-off, not citable.</b>` : ""}</p>
        ${R.entries.map(e => `<div class="conv"><b>${side(e)} · ${esc(e.entry_id)} ·
          ${esc(e.lens)} · ${esc(e.locus)} locus · tier ${e.provenance_tier} ·
          ${esc(e.status)}</b><br>${esc(e.claim)}</div>`).join("")}</div>`;
    }

    out += `<div class="panel"><h2>Disagreement engine</h2>
      <p class="note">Each lens makes a claim about a driver, never about a return and never a
      probability. Supporting mass S and opposing mass O per branch give r = min(S,O)/(S+O),
      the same contestedness the calibration ledger rails on.
      ${C.drafts ? `<b style="color:var(--wait)">${C.drafts} of ${C.total} entries are draft:
      proposals awaiting curator sign-off, not citable.</b>` : ""}</p></div>`;
    for (const b of C.branches) {
      const rTxt = b.r === null ? "no claims land here — uncontested by omission"
        : `S = ${b.S} · O = ${b.O} · r = ${b.r.toFixed(2)}
           ${Math.min(b.S,b.O)===0 ? "(one-sided: opposition or support missing, not resolved)"
             : b.r < 0.15 ? "(clean)" : b.r < 0.30 ? "(mixed)" : "(contested)"}`;
      out += `<div class="panel"><h2>${esc(b.branch_id)}</h2>
        <p class="note" style="margin:0 0 8px">${esc(b.label)}</p>
        <p class="note" style="margin:0 0 10px;font-family:var(--mono);font-size:12px">${rTxt}</p>
        ${b.entries.map(e => `<div class="conv"><b>${side(e)} · ${esc(e.entry_id)} ·
          ${esc(e.lens)} · tier ${e.tier} · ${esc(e.status)}</b><br>${esc(e.claim)}</div>`).join("")
        || '<p class="empty">no lens claims attached</p>'}</div>`;
    }
    if (C.unmatched.length) {
      out += `<div class="panel"><h2>Unmatched claims — coverage findings</h2>
        <p class="note">These land on drivers no active branch perturbs. They contest the
        scenario set's coverage, not a branch's probability: either a threat is missing
        from the register, or the claim needs an explicit target branch.</p>
        ${C.unmatched.map(e => `<div class="conv"><b>${esc(e.entry_id)} · ${esc(e.lens)} ·
          lands on ${esc(e.drivers.join(", "))}</b><br>${esc(e.claim)}</div>`).join("")}</div>`;
    }
    return out;
  },

  "Conventions": () => {
    const log = STATE.conventionsLog;
    const byId = Object.fromEntries(((log && log.conventions) || []).map(c => [c.id, c]));
    const decided = Object.values(byId).filter(c => c.status === "decided").length;
    let out = `<div class="panel"><h2>Conventions ledger</h2>
      <p class="note">Each is a question the engine could not settle on its own, travelling with
      the numbers it affects. Resolving one is a three-step loop: the chat may <b>draft</b> a
      resolution, only the curator moves it to <b>decided</b> in the log, and no number on this
      page changes until the owning engine <b>re-runs</b> — the valuation engine for model
      conventions, scenario_derive.py for derivation conventions. This console computes nothing.
      ${log ? `<b style="color:var(--pass)">${decided} decided</b> · <b style="color:var(--wait)">${Object.keys(byId).length - decided} open</b>` : ""}</p></div>`;
    const items = uc.map(c => {
      const t = typeof c === "string" ? c : (c.note || c.text || JSON.stringify(c));
      const m = /^([A-Z]\d+)\s+([\s\S]*)$/.exec(t.trim());
      return {id: m ? m[1] : (c.id || ""), text: m ? m[2] : t};
    });
    // The engine stamps its own list into computed; the log carries entries added
    // afterwards (routings, new findings). Render the union, or later decisions
    // stay invisible on the face.
    const inEngine = new Set(items.map(x => x.id));
    for (const c of Object.values(byId)) {
      if (!inEngine.has(c.id)) items.push({id: c.id, text: c.interim_default || c.resolution || ""});
    }
    for (const it of items) {
      const lg = byId[it.id];
      const chip = lg ? `<span class="status-chip st-${lg.status}">${lg.status}</span>` : "";
      out += `<div class="conv"><b>${esc(it.id)}</b>${chip}
        ${lg && lg.title ? `<span style="color:var(--ink)"> ${esc(lg.title)}</span>` : ""}<br>
        ${esc(it.text)}
        ${lg && lg.resolution ? `<br><span style="color:var(--pass)">Resolution (${esc(lg.decided_on || "")}): ${esc(lg.resolution)}</span>` : ""}
        ${lg && lg.status === "open" && lg.resolution_path ? `<br><span style="color:var(--wait)">To resolve: ${esc(lg.resolution_path)}</span>` : ""}
        </div>`;
    }
    return out;
  },

  "Method": () => {
    const cfg = STATE.deriveConfig, man = STATE.manifest || [];
    let out = `<div class="panel"><h2>Three engines and a viewer</h2>
      <p class="note">Every number on this page was computed somewhere specific, from inputs that
      hash to specific values. Nothing is computed in the browser or in the chat.</p>
      <div class="scroll"><table>
      <thead><tr><th>Stage</th><th>Logic sits in</th><th>Inputs</th><th>Output</th><th>Re-run</th></tr></thead>
      <tbody>
      <tr><td>Extraction</td><td>/collect agent</td><td>filings, house conventions (E1, E3)</td>
        <td>golden file, schema v3</td><td>re-extract; conventions log tracks open items</td></tr>
      <tr><td>Valuation</td><td>valuation engine ${esc(comp.engineVersion||"")}</td>
        <td>golden drivers + three pre-registered cases</td>
        <td>scenarios.computed, ${esc(comp.computedAt||"")}</td>
        <td>outside this console; page shows the stale block until then</td></tr>
      <tr><td>Derivation</td><td>scenario_derive.py (local)</td>
        <td>config + threats + drivers + atlas (+ contradictions)</td>
        <td>scenario_set JSON + face, byte-deterministic, sha256 printed</td>
        <td>local re-run; successor revisions only, never overwrite</td></tr>
      <tr><td>Disagreement</td><td>lens_register.py (local)</td>
        <td>lens register + threat register</td>
        <td>S, O, r per branch; coverage findings</td>
        <td>local re-run; r does not feed the rail without a declared reading</td></tr>
      <tr><td>Display</td><td>this console</td><td>all of the above</td>
        <td>this page + the chat digest</td><td>restart to pick up file changes</td></tr>
      </tbody></table></div></div>`;
    out += `<div class="panel"><h2>Input manifest · sha256</h2>
      <p class="note">The reproducibility anchor: identical hashes mean an identical page. Quote a
      hash prefix when citing a number from this console.</p>
      <div class="scroll"><table>
      <thead><tr><th>Role</th><th>File</th><th>sha256</th></tr></thead><tbody>
      ${man.map(m => `<tr><td>${esc(m.role)}</td><td style="font-family:var(--mono);font-size:11.5px">${esc(m.file)}</td>
        <td style="font-family:var(--mono);font-size:11px;color:${m.sha256?"var(--ink-soft)":"var(--block)"}">${m.sha256 ? esc(m.sha256.slice(0,16)) + "…" : "missing"}</td></tr>`).join("")}
      </tbody></table></div></div>`;
    if (cfg) {
      out += `<div class="panel"><h2>Derivation readings in force</h2>
        <p class="note">Six points the derivation spec leaves open, each a declared switch in the
        config, never a generator default. Changing one produces a new revision beside the old.</p>
        <dl class="kv">
        ${Object.entries(cfg.readings || {}).sort().map(([k,v]) =>
          `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}
        <dt>lambda</dt><dd>${cfg.lambda} on the base rate</dd>
        <dt>horizon</dt><dd>${cfg.horizon_years} years</dd>
        <dt>atlas sector</dt><dd>${esc(cfg.atlas_sector)}</dd>
        </dl>
        ${cfg.lambda_basis ? `<p class="note" style="margin-top:12px"><b>λ basis on record.</b> ${esc(cfg.lambda_basis)}</p>` : ""}</div>`;
    }
    out += `<div class="panel"><h2>The equations that connect the drivers</h2>
      <div class="scroll"><table><tbody>
      <tr><td>Revenue</td><td style="font-family:var(--mono);font-size:12px">Σ (units × ASP) per system line + metrology + IBM</td></tr>
      <tr><td>Gross profit</td><td style="font-family:var(--mono);font-size:12px">revenue × gross_margin_pct &nbsp;(house GM, depreciation-free — E1)</td></tr>
      <tr><td>EBIT</td><td style="font-family:var(--mono);font-size:12px">GP − opex_pct_revenue × revenue − depreciation</td></tr>
      <tr><td>NOPLAT</td><td style="font-family:var(--mono);font-size:12px">EBIT × (1 − tax_rate)</td></tr>
      <tr><td>FOCF</td><td style="font-family:var(--mono);font-size:12px">NOPLAT + depreciation − capex_incl − Δ working capital</td></tr>
      <tr><td>Value</td><td style="font-family:var(--mono);font-size:12px">Σ FOCF_t / (1+WACC)^t + Gordon terminal on FOCF₅ &nbsp;(WACC 10%, g 2%; terminal = 73.4% of EV)</td></tr>
      <tr><td>Fade path</td><td style="font-family:var(--mono);font-size:12px">driver_t = sector_mean + (driver₀ − sector_mean) × φ^t &nbsp;·&nbsp; CAP ≈ 1/(1−φ)</td></tr>
      <tr><td>Erosion envelope</td><td style="font-family:var(--mono);font-size:12px">1 − hold^H &nbsp;·&nbsp; Σ p_railed ≤ envelope + 0.05</td></tr>
      <tr><td>Rail</td><td style="font-family:var(--mono);font-size:12px">p_railed = λ·p_base + (1−λ)·p_analyst &nbsp;=&nbsp; p_base + (p_analyst − p_base)(1 − λ·2r) at r → 0.5</td></tr>
      <tr><td>Conservation</td><td style="font-family:var(--mono);font-size:12px">p_base_case + Σ p_railed = 1.00 ± 0.02</td></tr>
      <tr><td>Concordance</td><td style="font-family:var(--mono);font-size:12px">r = min(S, O) / (S + O) over signed lens masses per branch</td></tr>
      </tbody></table></div>
      <p class="note">The rail identity in the ninth row is why §10.1 closed the way it did: the
      scenario rail IS the calibration ledger's equation evaluated at maximum dispersion.</p></div>`;

    out += `<div class="panel"><h2>Validation record — what each tool has actually earned</h2>
      <div class="conv"><b>fade atlas</b><br>Module A live: 155 firms, 559 forward transitions,
        2020–24, working grade — the φ and hold cells this page uses. Module B (exit hazard)
        blocked on data: null on a curated large-cap panel (p = 0.80), by construction not by
        failure of the idea. Module C (accruals) directional: Sloan's sign replicates, not
        significant on this window (p = 0.18).</div>
      <div class="conv"><b>position vs lenses (the discriminance harness)</b><br>Gap alone reaches
        pseudo-R² 0.218; adding moat advantage or ROIC advantage adds nothing (p = 0.79 / 0.65).
        Every candidate lens signal's Brier skill sat inside ±0.08 of zero across three test
        years; a regularised six-signal scored −0.14, actively harmful.</div>
      <div class="conv"><b>Teece artifact</b><br>Operationalised (scoring spec exists) and its
        predictive contribution is the moat-advantage null above. Its standing here is therefore
        claims-only — but it is the one lens whose claims the atlas can eventually score, because
        both speak about persistence. First scoreable moment: branch resolutions, 2027–28.</div>
      <div class="conv"><b>lens register / disagreement engine</b><br>No forecast claim at all, by
        design: claims about drivers, r as computed contestedness. Validation is structural — 89
        pytest cases pin the arithmetic, and the register is fully draft until signed.</div>
      <div class="conv"><b>scenario_derive.py</b><br>89 tests, byte-deterministic output, all six
        refusal gates demonstrated. What it does NOT yet have: a single resolved branch, so zero
        calibration evidence. The first falsifiers resolve 2027-12-31.</div>
      <div class="conv"><b>derived cash flows</b><br>Ties to the reported change in cash exactly,
        by construction — an identity, not a model. The check row on the Cash flows tab is the
        proof, per year.</div></div>`;

    out += `<div class="panel"><h2>Status</h2>
      <p class="note">scenario_derivation_spec_v0_1 is DRAFT with amendments A1–A3 recorded; no
      scenario set is OTS-stamped or citable in client work until ratification. The lens register
      is fully draft pending curator signing. The λ rail sits at the maximum-dispersion corner;
      leaving it requires a declared reading consuming the computed r, not a tool side effect.</p></div>`;
    return out;
  },
};

const tabNames = Object.keys(TABS);
$("tabs").innerHTML = tabNames.map((n,i) =>
  `<button role="tab" aria-selected="${i===0}" data-t="${esc(n)}">${esc(n)}</button>`).join("");
function show(name) {
  $("view").innerHTML = TABS[name]();
  [...$("tabs").children].forEach(b => b.setAttribute("aria-selected", b.dataset.t === name));
}
$("tabs").addEventListener("click", e => { if (e.target.dataset.t) show(e.target.dataset.t); });
show(tabNames[0]);

/* ---------- conversation ----------
   In static export mode there is no proxy, so the pane explains where the
   conversation lives instead of pretending to offer one. */
if (STATE.static) {
  document.getElementById("chat").innerHTML = `
    <header><div class="eyebrow">Conversation</div>
      <div class="sub" style="margin-top:6px">not available on the published page</div></header>
    <div style="padding:18px">
      <p class="note" style="margin-top:0">This is a static export. The live console runs a local
      proxy so the conversation can read these numbers without an API key ever reaching the
      browser — that proxy cannot exist on a static host, so the pane is inert here rather than
      insecure.</p>
      <p class="note">Everything else on this page is the same object the live console serves:
      same inputs, same hashes, same refusals. To ask questions of the numbers, run the console
      locally from the repository.</p>
      <p class="note" style="font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)">
      exported ${esc(STATE.exportedAt || "")}</p>
    </div>`;
} else {
$("provider").textContent = P.ready
  ? `${P.name} · ${P.model}`
  : `${P.name} · ${P.model} · ${P.keyEnv} not set`;

const history = [];
function bubble(role, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (cls || (role === "user" ? "you" : "them"));
  d.innerHTML = `<span class="who">${role === "user" ? "You" : (cls === "err" ? "Console" : P.name)}</span>
                 <div class="body">${esc(text)}</div>`;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  return d;
}

const SEEDS = [
  "Which driver moves enterprise value most, and by how much?",
  "Walk me through how gross margin differs across the three cases.",
  "Which numbers here are measured and which are analyst judgement?",
  "Draft a resolution for convention T1, the tax basis question.",
  S ? "Do the branch probabilities fit inside the erosion envelope?"
    : "What is missing before a scenario set can be produced?",
];
$("seed").innerHTML = SEEDS.map(s => `<button type="button">${esc(s)}</button>`).join("");
$("seed").addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") { $("q").value = e.target.textContent; $("ask").requestSubmit(); }
});

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("q").value = ""; $("send").disabled = true;
  $("seed").style.display = "none";
  bubble("user", q);
  history.push({role:"user", content:q});
  const pending = bubble("assistant", "thinking");
  pending.querySelector(".body").innerHTML = '<span class="dots"></span>';
  try {
    const r = await fetch("/api/chat", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({messages: history}),
    });
    const d = await r.json();
    pending.remove();
    if (d.error) { bubble("assistant", d.error, "err"); }
    else { bubble("assistant", d.reply); history.push({role:"assistant", content:d.reply}); }
  } catch (err) {
    pending.remove();
    bubble("assistant", "Could not reach the console proxy: " + err.message, "err");
  } finally {
    $("send").disabled = false; $("q").focus();
  }
});
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); }
});
}
</script>
</body>
</html>
